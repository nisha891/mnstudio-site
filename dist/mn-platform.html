<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MN Studio Platform</title>
<meta name="description" content="UX research, product design, delivery and design debt in one workspace, with AI agents wired through all of it.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23161513%22/><text x=%2250%22 y=%2268%22 font-size=%2258%22 font-family=%22Georgia,serif%22 fill=%22%23f2c48d%22 text-anchor=%22middle%22>M</text></svg>">
<style>
/* =========================================================
   MN Studio — Platform
   App-shell design system. Extends the marketing brand
   (warm paper, ink, ember) into a working product surface.

   Contents
     1.  Tokens & theme
     2.  Base
     3.  App shell (sidebar / topbar / canvas)
     4.  Buttons, chips, badges
     5.  Cards & layout primitives
     6.  Forms & intake
     7.  Score visualisation
     8.  Tables, findings, quadrant, roadmap
     9.  Pipeline: stepper, kanban, agent log, storybook
     10. Workflow composer
     11. Overlays: toast, modal, drawer
     12. Responsive
   ========================================================= */

/* ---------------------------------------------------------
   1. Tokens & theme
   --------------------------------------------------------- */
:root {
  /* brand — shared with css/style.css */
  --ink: #17140f;
  --ink-soft: #4a453d;
  --ink-mute: #736c60;
  --cream: #f6f1e8;
  --cream-2: #efe7d8;
  --paper: #fffdf9;
  --accent: #c1662f;
  --accent-dark: #a1501f;
  --accent-soft: #f2c48d;
  --accent-wash: #fbeee0;

  /* surfaces */
  --bg: #f2ece1;
  --surface: #fffdf9;
  --surface-2: #f8f3ea;
  --surface-3: #efe7d8;
  --sunk: #ebe3d5;
  --line: rgba(23, 20, 15, 0.12);
  --line-soft: rgba(23, 20, 15, 0.07);
  --line-strong: rgba(23, 20, 15, 0.26);

  /* sidebar is always dark — it anchors the app */
  --nav-bg: #14120f;
  --nav-bg-2: #1e1a15;
  --nav-fg: #cfc6b7;
  --nav-fg-strong: #f6f1e8;
  --nav-line: rgba(246, 241, 232, 0.11);

  /* semantic */
  --critical: #b3261e;
  --critical-bg: #fbe6e4;
  --high: #c1662f;
  --high-bg: #fbeee0;
  --medium: #a07b12;
  --medium-bg: #faf1d8;
  --low: #4f6f52;
  --low-bg: #e8f0e6;
  --good: #2f6b4f;
  --good-bg: #e4f0e9;
  --info: #2c5a7a;
  --info-bg: #e3eef5;

  --font-serif: "Iowan Old Style", "Palatino Linotype", Georgia, "Times New Roman", serif;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;

  --r-sm: 8px;
  --r: 12px;
  --r-lg: 18px;
  --r-xl: 26px;
  --ease: cubic-bezier(.19, 1, .22, 1);
  --shadow-sm: 0 1px 2px rgba(23, 20, 15, .06), 0 2px 8px rgba(23, 20, 15, .04);
  --shadow: 0 2px 6px rgba(23, 20, 15, .07), 0 12px 32px rgba(23, 20, 15, .07);
  --shadow-lg: 0 8px 20px rgba(23, 20, 15, .1), 0 32px 64px rgba(23, 20, 15, .13);
  --side-w: 252px;
}

[data-theme="dark"] {
  --ink: #f3eee5;
  --ink-soft: #b9b1a4;
  --ink-mute: #8c8478;
  --bg: #100e0c;
  --surface: #1a1713;
  --surface-2: #221e19;
  --surface-3: #2b261f;
  --sunk: #14120f;
  --line: rgba(246, 241, 232, 0.13);
  --line-soft: rgba(246, 241, 232, 0.07);
  --line-strong: rgba(246, 241, 232, 0.3);
  --paper: #1a1713;
  --accent: #e08c4d;
  --accent-dark: #c1662f;
  --accent-wash: #2e2115;
  --nav-bg: #0b0a08;
  --nav-bg-2: #14120f;

  --critical: #f08379; --critical-bg: #3a1c19;
  --high: #e08c4d;     --high-bg: #33220f;
  --medium: #d9b64a;   --medium-bg: #322914;
  --low: #8fb894;      --low-bg: #1c2a1e;
  --good: #7fc7a0;     --good-bg: #16291f;
  --info: #86b9d9;     --info-bg: #16242e;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow: 0 2px 6px rgba(0, 0, 0, .45), 0 12px 32px rgba(0, 0, 0, .35);
  --shadow-lg: 0 8px 20px rgba(0, 0, 0, .5), 0 32px 64px rgba(0, 0, 0, .45);
}

/* ---------------------------------------------------------
   2. Base
   --------------------------------------------------------- */
* { box-sizing: border-box; }

body.app-body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 {
  font-family: var(--font-serif);
  font-weight: 500;
  line-height: 1.14;
  letter-spacing: -0.012em;
  margin: 0 0 .4em;
  color: var(--ink);
}
h1 { font-size: 34px; }
h2 { font-size: 25px; }
h3 { font-size: 19px; }
h4 { font-size: 16px; font-family: var(--font-sans); font-weight: 650; letter-spacing: 0; }

p { margin: 0 0 1em; color: var(--ink-soft); }
p:last-child { margin-bottom: 0; }
a { color: inherit; text-decoration: none; }
ul, ol { margin: 0; padding: 0; list-style: none; }
img, svg { max-width: 100%; }
hr { border: 0; border-top: 1px solid var(--line-soft); margin: 22px 0; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

.mono { font-family: var(--font-mono); font-size: .92em; }
.muted { color: var(--ink-mute); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.strong { font-weight: 650; color: var(--ink); }
.center { text-align: center; }
.right { text-align: right; }
.nowrap { white-space: nowrap; }
.hidden { display: none !important; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.eyebrow {
  font-size: 11.5px;
  letter-spacing: .15em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--accent-dark);
  margin: 0 0 10px;
}
[data-theme="dark"] .eyebrow { color: var(--accent); }

.stack > * + * { margin-top: 14px; }
.stack-lg > * + * { margin-top: 26px; }
.row { display: flex; align-items: center; gap: 12px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.row-wrap { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.grow { flex: 1; min-width: 0; }

/* ---------------------------------------------------------
   3. App shell
   --------------------------------------------------------- */
.app {
  display: grid;
  grid-template-columns: var(--side-w) minmax(0, 1fr);
  min-height: 100vh;
}

/* --- Sidebar --- */
.side {
  background: var(--nav-bg);
  color: var(--nav-fg);
  border-right: 1px solid var(--nav-line);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  z-index: 40;
}

.side-brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 20px 20px 18px;
  border-bottom: 1px solid var(--nav-line);
}
.side-mark {
  width: 34px; height: 34px;
  border-radius: 9px;
  background: linear-gradient(150deg, var(--accent) 0%, #7d3d17 100%);
  color: #fff;
  font-family: var(--font-serif);
  font-size: 15px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
}
.side-brand-text { line-height: 1.15; min-width: 0; }
.side-brand-text b {
  display: block;
  font-family: var(--font-serif);
  font-size: 16px;
  font-weight: 600;
  color: var(--nav-fg-strong);
}
.side-brand-text span {
  font-size: 10.5px;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: var(--accent-soft);
}

.side-nav { padding: 16px 12px; flex: 1; }
.nav-group + .nav-group { margin-top: 22px; }
.nav-label {
  font-size: 10.5px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: #6d6558;
  font-weight: 700;
  padding: 0 10px 8px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 9px 11px;
  border-radius: 9px;
  font-size: 14px;
  font-weight: 500;
  color: var(--nav-fg);
  transition: background-color .18s ease, color .18s ease;
  position: relative;
}
.nav-item + .nav-item { margin-top: 2px; }
.nav-item:hover { background: var(--nav-bg-2); color: var(--nav-fg-strong); }
.nav-item.active { background: var(--nav-bg-2); color: var(--nav-fg-strong); }
.nav-item.active::before {
  content: "";
  position: absolute;
  left: -12px; top: 50%;
  transform: translateY(-50%);
  width: 3px; height: 20px;
  border-radius: 0 3px 3px 0;
  background: var(--accent);
}
.nav-ico {
  width: 18px; height: 18px;
  flex: none;
  opacity: .85;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.nav-item.active .nav-ico { opacity: 1; color: var(--accent-soft); }
.nav-count {
  margin-left: auto;
  font-size: 11px;
  font-weight: 700;
  background: rgba(246, 241, 232, .1);
  color: var(--nav-fg-strong);
  border-radius: 999px;
  padding: 1px 7px;
}

.side-foot {
  padding: 14px;
  border-top: 1px solid var(--nav-line);
}
.side-card {
  background: var(--nav-bg-2);
  border: 1px solid var(--nav-line);
  border-radius: var(--r);
  padding: 13px;
  font-size: 12.5px;
  color: var(--nav-fg);
}
.side-card b { color: var(--nav-fg-strong); display: block; margin-bottom: 3px; font-size: 13px; }

/* --- Topbar --- */
.top {
  position: sticky;
  top: 0;
  z-index: 30;
  background: color-mix(in srgb, var(--bg) 84%, transparent);
  backdrop-filter: blur(12px) saturate(150%);
  -webkit-backdrop-filter: blur(12px) saturate(150%);
  border-bottom: 1px solid var(--line-soft);
}
.top-inner {
  display: flex;
  align-items: center;
  gap: 16px;
  height: 66px;
  padding: 0 32px;
}
.crumbs { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink-mute); min-width: 0; overflow: hidden; }
.crumbs > * { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumbs a:hover { color: var(--accent-dark); }
.crumbs .sep { opacity: .45; }
.crumbs .now { color: var(--ink); font-weight: 600; }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; flex: none; }

.side-toggle {
  display: none;
  width: 38px; height: 38px;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 10px;
  cursor: pointer;
  color: var(--ink);
  align-items: center;
  justify-content: center;
  flex: none;
}

/* --- Canvas --- */
.canvas { padding: 30px 32px 88px; max-width: 1320px; }
.canvas-narrow { max-width: 940px; }

.page-head { margin-bottom: 26px; }
.page-head h1 { margin-bottom: 8px; }
.page-head .lede { font-size: 16.5px; max-width: 64ch; color: var(--ink-soft); }

.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  margin: 34px 0 14px;
  flex-wrap: wrap;
}
.section-head h2, .section-head h3 { margin: 0; }

/* ---------------------------------------------------------
   4. Buttons, chips, badges
   --------------------------------------------------------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 18px;
  border-radius: 999px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  border: 1px solid transparent;
  cursor: pointer;
  white-space: nowrap;
  transition: background-color .2s ease, color .2s ease, border-color .2s ease, transform .3s var(--ease), opacity .2s ease;
}
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.btn-primary { background: var(--ink); color: var(--bg); }
.btn-primary:hover:not(:disabled) { background: var(--accent-dark); color: #fff; }
[data-theme="dark"] .btn-primary { background: var(--accent); color: #16120d; }
[data-theme="dark"] .btn-primary:hover:not(:disabled) { background: var(--accent-soft); }

.btn-accent { background: var(--accent); color: #fff; }
.btn-accent:hover:not(:disabled) { background: var(--accent-dark); }

.btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn-ghost:hover:not(:disabled) { border-color: var(--line-strong); background: var(--surface); }

.btn-solid { background: var(--surface); color: var(--ink); border-color: var(--line); box-shadow: var(--shadow-sm); }
.btn-solid:hover:not(:disabled) { border-color: var(--line-strong); }

.btn-quiet { background: transparent; color: var(--ink-soft); padding: 7px 11px; }
.btn-quiet:hover:not(:disabled) { background: var(--surface-3); color: var(--ink); }

.btn-sm { padding: 7px 13px; font-size: 13px; }
.btn-lg { padding: 14px 26px; font-size: 15.5px; }
.btn-full { width: 100%; }
.btn-ico { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

.btn-group { display: inline-flex; background: var(--surface-3); border-radius: 999px; padding: 3px; gap: 2px; }
.btn-group button {
  border: 0; background: transparent; cursor: pointer;
  font: inherit; font-size: 13px; font-weight: 600;
  color: var(--ink-soft); padding: 6px 14px; border-radius: 999px;
  transition: background-color .18s ease, color .18s ease;
}
.btn-group button:hover { color: var(--ink); }
.btn-group button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--surface-3);
  color: var(--ink-soft);
  white-space: nowrap;
}
.badge.critical { background: var(--critical-bg); color: var(--critical); }
.badge.high     { background: var(--high-bg);     color: var(--high); }
.badge.medium   { background: var(--medium-bg);   color: var(--medium); }
.badge.low      { background: var(--low-bg);      color: var(--low); }
.badge.good     { background: var(--good-bg);     color: var(--good); }
.badge.info     { background: var(--info-bg);     color: var(--info); }
.badge.dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12.5px;
  font-weight: 500;
  padding: 5px 11px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-soft);
}
.chip b { color: var(--ink); font-weight: 650; }
.chip-x { border: 0; background: none; cursor: pointer; color: var(--ink-mute); padding: 0 0 0 2px; font-size: 14px; line-height: 1; }
.chip-x:hover { color: var(--critical); }

.kbd {
  font-family: var(--font-mono);
  font-size: 11.5px;
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 5px;
  padding: 1px 5px;
  background: var(--surface-2);
  color: var(--ink-soft);
}

/* ---------------------------------------------------------
   5. Cards & layout primitives
   --------------------------------------------------------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
}
.card-pad { padding: 22px; }
.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 17px 22px;
  border-bottom: 1px solid var(--line-soft);
  flex-wrap: wrap;
}
.card-head h3, .card-head h4 { margin: 0; }
.card-head .sub { font-size: 13px; color: var(--ink-mute); margin: 3px 0 0; }
.card-body { padding: 22px; }
.card-foot {
  padding: 15px 22px;
  border-top: 1px solid var(--line-soft);
  background: var(--surface-2);
  border-radius: 0 0 var(--r-lg) var(--r-lg);
}
.card-quiet { background: var(--surface-2); box-shadow: none; }
.card-sunk { background: var(--sunk); border-color: var(--line-soft); box-shadow: none; }
.card-accent { border-color: color-mix(in srgb, var(--accent) 38%, transparent); }

.grid { display: grid; gap: 18px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-side { grid-template-columns: minmax(0, 1fr) 340px; }
.g-side-l { grid-template-columns: 300px minmax(0, 1fr); }

.tile {
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: var(--r-lg);
  padding: 18px 20px;
  box-shadow: var(--shadow-sm);
}
.tile-label {
  font-size: 11.5px;
  letter-spacing: .1em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--ink-mute);
  margin-bottom: 8px;
}
.tile-value {
  font-family: var(--font-serif);
  font-size: 33px;
  line-height: 1;
  color: var(--ink);
  display: flex;
  align-items: baseline;
  gap: 5px;
}
.tile-value small { font-size: 15px; font-family: var(--font-sans); color: var(--ink-mute); font-weight: 500; }
.tile-note { font-size: 12.5px; color: var(--ink-mute); margin-top: 8px; }
.tile-note.up { color: var(--critical); }
.tile-note.down { color: var(--good); }

.empty {
  text-align: center;
  padding: 46px 24px;
  color: var(--ink-mute);
  border: 1px dashed var(--line);
  border-radius: var(--r-lg);
  background: var(--surface-2);
}
.empty h4 { color: var(--ink); margin-bottom: 6px; }
.empty p { max-width: 46ch; margin: 0 auto 16px; font-size: 14px; }

.note {
  display: flex;
  gap: 11px;
  padding: 13px 16px;
  border-radius: var(--r);
  background: var(--info-bg);
  border: 1px solid color-mix(in srgb, var(--info) 22%, transparent);
  font-size: 13.5px;
  color: var(--ink-soft);
  line-height: 1.5;
}
.note b { color: var(--ink); }
.note.warn { background: var(--medium-bg); border-color: color-mix(in srgb, var(--medium) 26%, transparent); }
.note.ok { background: var(--good-bg); border-color: color-mix(in srgb, var(--good) 24%, transparent); }
.note.bad { background: var(--critical-bg); border-color: color-mix(in srgb, var(--critical) 24%, transparent); }
.note-ico { flex: none; font-size: 15px; line-height: 1.4; }

/* ---------------------------------------------------------
   6. Forms & intake
   --------------------------------------------------------- */
.field { display: block; margin-bottom: 16px; }
.field > label, .field-label {
  display: block;
  font-size: 13px;
  font-weight: 650;
  color: var(--ink);
  margin-bottom: 6px;
}
.field .hint { font-size: 12.5px; color: var(--ink-mute); margin: 5px 0 0; }

.input, .select, .textarea {
  width: 100%;
  font: inherit;
  font-size: 14.5px;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 11px 14px;
  transition: border-color .18s ease, box-shadow .18s ease;
}
.input::placeholder, .textarea::placeholder { color: var(--ink-mute); opacity: .8; }
.input:focus, .select:focus, .textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
}
.textarea { min-height: 104px; resize: vertical; line-height: 1.55; }
.select {
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-right: 38px;
}

.input-group { display: flex; gap: 10px; }
.input-group .input { flex: 1; }

.field-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }

/* choice cards */
.choices { display: grid; gap: 10px; }
.choices.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.choices.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.choice {
  position: relative;
  display: block;
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 13px 15px;
  cursor: pointer;
  background: var(--surface);
  transition: border-color .18s ease, background-color .18s ease, box-shadow .18s ease;
}
.choice:hover { border-color: var(--line-strong); }
.choice input { position: absolute; opacity: 0; pointer-events: none; }
.choice b { display: block; font-size: 14px; font-weight: 650; color: var(--ink); }
.choice span { display: block; font-size: 12.5px; color: var(--ink-mute); margin-top: 3px; line-height: 1.45; }
.choice:has(input:checked) {
  border-color: var(--accent);
  background: var(--accent-wash);
  box-shadow: 0 0 0 1px var(--accent) inset;
}
.choice:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }

/* slider */
.slider-field .slider-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.slider-val { font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: var(--accent-dark); }
[data-theme="dark"] .slider-val { color: var(--accent); }
input[type="range"] {
  width: 100%;
  appearance: none;
  height: 5px;
  border-radius: 999px;
  background: var(--surface-3);
  outline: none;
  cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
  appearance: none;
  width: 17px; height: 17px;
  border-radius: 50%;
  background: var(--accent);
  border: 2.5px solid var(--surface);
  box-shadow: var(--shadow-sm);
  cursor: grab;
}
input[type="range"]::-moz-range-thumb {
  width: 15px; height: 15px; border-radius: 50%;
  background: var(--accent); border: 2.5px solid var(--surface); cursor: grab;
}

/* toggle */
.toggle { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; }
.toggle input { position: absolute; opacity: 0; }
.toggle-track {
  width: 38px; height: 22px;
  border-radius: 999px;
  background: var(--surface-3);
  border: 1px solid var(--line);
  position: relative;
  transition: background-color .2s ease;
  flex: none;
}
.toggle-track::after {
  content: "";
  position: absolute;
  top: 2px; left: 2px;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--surface);
  box-shadow: var(--shadow-sm);
  transition: transform .22s var(--ease);
}
.toggle input:checked + .toggle-track { background: var(--accent); border-color: var(--accent); }
.toggle input:checked + .toggle-track::after { transform: translateX(16px); }
.toggle input:focus-visible + .toggle-track { outline: 2px solid var(--accent); outline-offset: 2px; }

/* dropzone */
.dropzone {
  border: 2px dashed var(--line);
  border-radius: var(--r-lg);
  background: var(--surface-2);
  padding: 34px 24px;
  text-align: center;
  cursor: pointer;
  transition: border-color .2s ease, background-color .2s ease;
}
.dropzone:hover, .dropzone.over { border-color: var(--accent); background: var(--accent-wash); }
.dropzone h4 { margin-bottom: 5px; }
.dropzone p { font-size: 13px; margin: 0; }
.dropzone-ico { font-size: 28px; margin-bottom: 8px; opacity: .6; }

.file-pill {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 16px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--surface);
}
.file-pill .fp-ico {
  width: 38px; height: 38px; border-radius: 10px; flex: none;
  background: var(--accent-wash); color: var(--accent-dark);
  display: grid; place-items: center; font-size: 17px;
}
[data-theme="dark"] .file-pill .fp-ico { color: var(--accent); }
.file-pill b { display: block; font-size: 14px; }
.file-pill span { font-size: 12.5px; color: var(--ink-mute); }

/* ---------------------------------------------------------
   7. Score visualisation
   --------------------------------------------------------- */
.gauge {
  --v: 0;
  --gc: var(--accent);
  width: 168px; height: 168px;
  border-radius: 50%;
  background: conic-gradient(var(--gc) calc(var(--v) * 1%), var(--surface-3) 0);
  display: grid;
  place-items: center;
  position: relative;
  flex: none;
  transition: background .9s var(--ease);
}
.gauge::after {
  content: "";
  position: absolute;
  inset: 13px;
  border-radius: 50%;
  background: var(--surface);
}
.gauge-inner { position: relative; z-index: 1; text-align: center; }
.gauge-num {
  font-family: var(--font-serif);
  font-size: 46px;
  line-height: 1;
  color: var(--ink);
}
.gauge-cap {
  font-size: 10.5px;
  letter-spacing: .13em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--ink-mute);
  margin-top: 5px;
}
.gauge-sm { width: 92px; height: 92px; }
.gauge-sm::after { inset: 9px; }
.gauge-sm .gauge-num { font-size: 26px; }
.gauge-sm .gauge-cap { font-size: 9px; margin-top: 2px; }

.grade {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px; height: 44px;
  border-radius: 12px;
  font-family: var(--font-serif);
  font-size: 21px;
  font-weight: 600;
  background: var(--surface-3);
  color: var(--ink);
}
.grade.g-a { background: var(--good-bg); color: var(--good); }
.grade.g-b { background: var(--low-bg); color: var(--low); }
.grade.g-c { background: var(--medium-bg); color: var(--medium); }
.grade.g-d { background: var(--high-bg); color: var(--high); }
.grade.g-f { background: var(--critical-bg); color: var(--critical); }

/* dimension meters */
.meters { display: grid; gap: 15px; }
.meter-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
.meter-name { font-size: 14px; font-weight: 600; color: var(--ink); display: flex; align-items: center; gap: 8px; }
.meter-name .w { font-size: 11px; font-weight: 600; color: var(--ink-mute); background: var(--surface-3); border-radius: 999px; padding: 1px 7px; }
.meter-score { font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: var(--ink); }
.meter-track {
  height: 8px;
  border-radius: 999px;
  background: var(--surface-3);
  overflow: hidden;
  position: relative;
}
.meter-fill {
  height: 100%;
  border-radius: 999px;
  background: var(--accent);
  width: 0;
  transition: width 1s var(--ease);
}
.meter-fill.critical { background: var(--critical); }
.meter-fill.high { background: var(--high); }
.meter-fill.medium { background: var(--medium); }
.meter-fill.low { background: var(--low); }
.meter-fill.good { background: var(--good); }
.meter-foot { font-size: 12.5px; color: var(--ink-mute); margin-top: 6px; line-height: 1.45; }
.meter-row { cursor: pointer; border-radius: var(--r-sm); transition: background-color .16s ease; padding: 6px; margin: -6px; }
.meter-row:hover { background: var(--surface-2); }

/* benchmark bar */
.bench {
  position: relative;
  height: 30px;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--good-bg), var(--medium-bg) 55%, var(--critical-bg));
  border: 1px solid var(--line-soft);
}
.bench-mark {
  position: absolute;
  top: -6px;
  width: 2px; height: 42px;
  background: var(--ink);
  transform: translateX(-50%);
}
.bench-mark::after {
  content: attr(data-label);
  position: absolute;
  top: -19px; left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
  color: var(--ink);
}
.bench-mark.ghost { background: var(--ink-mute); opacity: .5; height: 28px; top: 0; }
.bench-mark.ghost::after { color: var(--ink-mute); font-weight: 600; top: 31px; }

/* scan progress */
.scan { padding: 30px 26px; }
.scan-bar {
  height: 6px;
  border-radius: 999px;
  background: var(--surface-3);
  overflow: hidden;
  margin: 18px 0 20px;
}
.scan-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent-soft));
  width: 0;
  border-radius: 999px;
  transition: width .5s ease;
}
.scan-steps { display: grid; gap: 9px; }
.scan-step {
  display: flex;
  align-items: center;
  gap: 11px;
  font-size: 13.5px;
  color: var(--ink-mute);
  transition: color .3s ease;
}
.scan-step .dot {
  width: 17px; height: 17px;
  border-radius: 50%;
  border: 1.5px solid var(--line-strong);
  flex: none;
  display: grid;
  place-items: center;
  font-size: 10px;
  color: transparent;
}
.scan-step.run { color: var(--ink); font-weight: 600; }
.scan-step.run .dot { border-color: var(--accent); border-right-color: transparent; animation: spin .7s linear infinite; }
.scan-step.done { color: var(--ink-soft); }
.scan-step.done .dot { background: var(--good); border-color: var(--good); color: #fff; }
.scan-step .t { margin-left: auto; font-family: var(--font-mono); font-size: 11.5px; opacity: .7; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------------------------------------------------------
   8. Tables, findings, quadrant, roadmap
   --------------------------------------------------------- */
.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.tbl th {
  text-align: left;
  font-size: 11px;
  letter-spacing: .1em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--ink-mute);
  padding: 0 14px 10px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
table.tbl td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--line-soft);
  vertical-align: top;
  color: var(--ink-soft);
}
table.tbl tr:last-child td { border-bottom: 0; }
table.tbl tbody tr:hover td { background: var(--surface-2); }
table.tbl td.num { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink); white-space: nowrap; }
table.tbl td .t-main { color: var(--ink); font-weight: 600; display: block; margin-bottom: 2px; }

/* findings */
.finding {
  border: 1px solid var(--line-soft);
  border-radius: var(--r);
  background: var(--surface);
  overflow: hidden;
  transition: border-color .18s ease;
}
.finding + .finding { margin-top: 10px; }
.finding:hover { border-color: var(--line); }
.finding.open { border-color: var(--line); box-shadow: var(--shadow-sm); }
.finding-head {
  display: flex;
  align-items: center;
  gap: 13px;
  width: 100%;
  padding: 14px 17px;
  background: none;
  border: 0;
  cursor: pointer;
  text-align: left;
  font: inherit;
  color: inherit;
}
.finding-sev {
  width: 4px;
  align-self: stretch;
  border-radius: 999px;
  flex: none;
  background: var(--ink-mute);
  margin: -2px 0;
}
.finding-sev.critical { background: var(--critical); }
.finding-sev.high { background: var(--high); }
.finding-sev.medium { background: var(--medium); }
.finding-sev.low { background: var(--low); }
.finding-title { font-size: 14.5px; font-weight: 600; color: var(--ink); margin-bottom: 3px; }
.finding-meta { font-size: 12.5px; color: var(--ink-mute); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.finding-caret { margin-left: auto; color: var(--ink-mute); transition: transform .25s var(--ease); flex: none; }
.finding.open .finding-caret { transform: rotate(90deg); }
.finding-body { padding: 0 17px 18px 34px; border-top: 1px solid var(--line-soft); margin-top: 2px; padding-top: 16px; }
.finding-body h5 {
  font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
  font-weight: 700; color: var(--ink-mute); margin: 0 0 7px;
}
.finding-body h5 + * { margin-top: 0; }
.finding-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
.evidence {
  font-family: var(--font-mono);
  font-size: 12px;
  background: var(--sunk);
  border: 1px solid var(--line-soft);
  border-radius: var(--r-sm);
  padding: 11px 13px;
  color: var(--ink-soft);
  line-height: 1.6;
}
.evidence li + li { margin-top: 5px; }
.evidence .k { color: var(--accent-dark); }
[data-theme="dark"] .evidence .k { color: var(--accent); }
.fix-list li { position: relative; padding-left: 20px; font-size: 13.5px; color: var(--ink-soft); line-height: 1.5; }
.fix-list li + li { margin-top: 7px; }
.fix-list li::before {
  content: "";
  position: absolute; left: 4px; top: 8px;
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent);
}

/* filter bar */
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  padding: 13px 16px;
  background: var(--surface-2);
  border: 1px solid var(--line-soft);
  border-radius: var(--r);
  margin-bottom: 14px;
}
.filter-btn {
  font: inherit;
  font-size: 12.5px;
  font-weight: 600;
  padding: 5px 12px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-soft);
  cursor: pointer;
  transition: all .16s ease;
}
.filter-btn:hover { border-color: var(--line-strong); }
.filter-btn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
[data-theme="dark"] .filter-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #16120d; }

/* impact / effort quadrant */
.quadrant {
  position: relative;
  aspect-ratio: 1 / 0.78;
  border-radius: var(--r);
  background:
    linear-gradient(to right, var(--line-soft) 1px, transparent 1px) 0 0 / 25% 100%,
    linear-gradient(to bottom, var(--line-soft) 1px, transparent 1px) 0 0 / 100% 25%,
    var(--surface-2);
  border: 1px solid var(--line);
  overflow: hidden;
}
.quadrant::before, .quadrant::after {
  content: "";
  position: absolute;
  background: var(--line);
}
.quadrant::before { left: 50%; top: 0; bottom: 0; width: 1px; }
.quadrant::after { top: 50%; left: 0; right: 0; height: 1px; }
.q-label {
  position: absolute;
  font-size: 10.5px;
  letter-spacing: .1em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--ink-mute);
  opacity: .85;
  pointer-events: none;
}
.q-tl { top: 10px; left: 12px; }
.q-tr { top: 10px; right: 12px; }
.q-bl { bottom: 10px; left: 12px; }
.q-br { bottom: 10px; right: 12px; }
.q-dot {
  position: absolute;
  width: 15px; height: 15px;
  border-radius: 50%;
  transform: translate(-50%, 50%);
  border: 2px solid var(--surface);
  cursor: pointer;
  transition: transform .2s var(--ease);
}
.q-dot:hover, .q-dot:focus-visible { transform: translate(-50%, 50%) scale(1.5); z-index: 2; }
.q-dot.critical { background: var(--critical); }
.q-dot.high { background: var(--high); }
.q-dot.medium { background: var(--medium); }
.q-dot.low { background: var(--low); }
.q-axis {
  font-size: 11.5px;
  color: var(--ink-mute);
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
  font-weight: 600;
}
.q-axis-y {
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  font-size: 11.5px;
  color: var(--ink-mute);
  font-weight: 600;
  text-align: center;
}

/* roadmap waves */
.wave { position: relative; padding-left: 30px; }
.wave + .wave { margin-top: 26px; }
.wave::before {
  content: "";
  position: absolute;
  left: 8px; top: 26px; bottom: -26px;
  width: 2px;
  background: var(--line);
}
.wave:last-child::before { display: none; }
.wave-dot {
  position: absolute;
  left: 0; top: 5px;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--surface);
  border: 2px solid var(--accent);
  display: grid;
  place-items: center;
  font-size: 9px;
  font-weight: 800;
  color: var(--accent-dark);
}
[data-theme="dark"] .wave-dot { color: var(--accent); }
.wave-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
.wave-head h4 { margin: 0; font-size: 16px; }
.wave-goal { font-size: 13.5px; color: var(--ink-soft); margin-bottom: 12px; max-width: 70ch; }
.wave-items { display: grid; gap: 8px; }
.wave-item {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 11px 14px;
  border: 1px solid var(--line-soft);
  border-radius: var(--r);
  background: var(--surface);
  font-size: 13.5px;
}
.wave-item .wi-title { color: var(--ink); font-weight: 600; }
.wave-item .wi-meta { margin-left: auto; display: flex; gap: 10px; align-items: center; color: var(--ink-mute); font-size: 12.5px; white-space: nowrap; }

/* ---------------------------------------------------------
   9. Pipeline: stepper, kanban, agent log, storybook
   --------------------------------------------------------- */
.stepper {
  display: flex;
  gap: 4px;
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: var(--r-lg);
  padding: 7px;
  box-shadow: var(--shadow-sm);
  overflow-x: auto;
}
.step {
  flex: 1;
  min-width: 132px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 14px;
  border-radius: var(--r);
  background: none;
  border: 0;
  cursor: pointer;
  font: inherit;
  text-align: left;
  color: var(--ink-mute);
  transition: background-color .18s ease, color .18s ease;
}
.step:hover:not(:disabled) { background: var(--surface-2); color: var(--ink-soft); }
.step:disabled { cursor: not-allowed; opacity: .5; }
.step-n {
  width: 25px; height: 25px;
  border-radius: 50%;
  border: 1.5px solid currentColor;
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 700;
  flex: none;
}
.step-t { line-height: 1.2; min-width: 0; }
.step-t b { display: block; font-size: 13.5px; font-weight: 650; }
.step-t span { font-size: 11.5px; opacity: .8; }
.step.done { color: var(--good); }
.step.done .step-n { background: var(--good); border-color: var(--good); color: var(--surface); }
.step.active { background: var(--ink); color: var(--bg); }
.step.active .step-n { border-color: currentColor; }
[data-theme="dark"] .step.active { background: var(--accent); color: #16120d; }
[data-theme="dark"] .step.done .step-n { color: #16120d; }

/* kanban */
.board {
  display: grid;
  grid-template-columns: repeat(4, minmax(232px, 1fr));
  gap: 14px;
  overflow-x: auto;
  padding-bottom: 8px;
  align-items: start;
}
.col {
  background: var(--surface-2);
  border: 1px solid var(--line-soft);
  border-radius: var(--r-lg);
  padding: 13px;
  min-height: 130px;
}
.col-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 4px 12px;
  font-size: 12px;
  letter-spacing: .09em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--ink-soft);
}
.col-head .n {
  background: var(--surface-3);
  border-radius: 999px;
  padding: 1px 7px;
  font-size: 11px;
  letter-spacing: 0;
  color: var(--ink-mute);
}
.col-head .n.live { background: var(--accent); color: #fff; }
.ticket {
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: var(--r);
  padding: 12px 13px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: border-color .18s ease, transform .25s var(--ease);
}
.ticket + .ticket { margin-top: 9px; }
.ticket:hover { border-color: var(--line-strong); transform: translateY(-1px); }
.ticket-key {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-mute);
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
}
.ticket-src { width: 13px; height: 13px; border-radius: 3px; display: inline-grid; place-items: center; font-size: 8px; font-weight: 800; color: #fff; }
.ticket-src.linear { background: #5e6ad2; }
.ticket-src.jira { background: #0052cc; }
.ticket-src.mn { background: var(--accent); }
.ticket-title { font-size: 13.5px; font-weight: 600; color: var(--ink); line-height: 1.35; margin-bottom: 9px; }
.ticket-foot { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.ticket.agent-on { border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
.ticket-agent {
  display: flex; align-items: center; gap: 6px;
  margin-top: 9px; padding-top: 9px;
  border-top: 1px dashed var(--line);
  font-size: 12px; color: var(--accent-dark); font-weight: 600;
}
[data-theme="dark"] .ticket-agent { color: var(--accent); }
.pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1.3s ease-in-out infinite; flex: none; }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .4; transform: scale(.75); } }

.avatar {
  width: 22px; height: 22px;
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 10px; font-weight: 700;
  background: var(--surface-3);
  color: var(--ink-soft);
  flex: none;
}
.avatar.bot { background: linear-gradient(150deg, var(--accent), #7d3d17); color: #fff; }

/* agent run log */
.log {
  background: #14120f;
  border: 1px solid rgba(246, 241, 232, .12);
  border-radius: var(--r);
  padding: 15px 17px;
  font-family: var(--font-mono);
  font-size: 12.3px;
  line-height: 1.75;
  color: #cfc6b7;
  max-height: 340px;
  overflow-y: auto;
}
.log-line { display: flex; gap: 10px; }
.log-line + .log-line { margin-top: 2px; }
.log-t { color: #6d6558; flex: none; }
.log-line .ok { color: #7fc7a0; }

/* storybook grid */

@media (prefers-reduced-motion: reduce) {

<body class="app-body">

<div class="app">
  <aside class="side" id="side" data-page="overview"></aside>
  <div>
    <header class="top">
      <div class="top-inner">
        <button class="side-toggle" id="sideToggle" aria-expanded="false" aria-label="Toggle navigation"></button>
        <div id="crumbHost" class="crumbs grow"></div>
        <div class="top-actions" id="actionHost"></div>
      </div>
    </header>
    <main class="canvas" id="canvas"></main>
  </div>
</div>

<script>
/* =========================================================
   MN Studio — Platform core
   Shared runtime for every platform page: persistent state,
   app shell, deterministic randomness, and UI primitives.

   Everything is client-side. State lives in localStorage so
   the three journeys can hand work to each other (a Figma
   audit feeds the design stage; a debt report becomes
   tickets; agents read whatever the workspace knows).
   ========================================================= */
(() => {
  'use strict';

  const MN = window.MN = window.MN || {};

  /* -------------------------------------------------------
     Utilities
     ------------------------------------------------------- */
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));

  /** Stable 32-bit hash — same input always yields the same analysis. */
  const hash = (str) => {
    let h = 2166136261;
    for (let i = 0; i < String(str).length; i++) {
      h ^= String(str).charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  };

  /** mulberry32 — small seeded PRNG. Deterministic per source. */
  const rng = (seed) => {
    let a = typeof seed === 'number' ? seed : hash(seed);
    return () => {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  const clamp = (n, lo = 0, hi = 100) => Math.max(lo, Math.min(hi, n));
  const round = (n, p = 0) => { const f = 10 ** p; return Math.round(n * f) / f; };
  const pick = (r, arr) => arr[Math.floor(r() * arr.length) % arr.length];
  const shuffle = (r, arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  const uid = (p = 'id') => `${p}_${Math.random().toString(36).slice(2, 9)}`;
  const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + 's')}`;

  const fmt = {
    int: (n) => Math.round(n).toLocaleString('en-US'),
    money: (n) => '$' + Math.round(n).toLocaleString('en-US'),
    money0: (n) => n >= 1000 ? '$' + round(n / 1000, 1) + 'k' : '$' + Math.round(n),
    pct: (n, p = 0) => round(n, p) + '%',
    days: (d) => d >= 10 ? `${round(d)}d` : `${round(d, 1)}d`,
    when: (ts) => {
      const diff = (Date.now() - ts) / 1000;
      if (diff < 60) return 'just now';
      if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
      if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
      return `${Math.floor(diff / 86400)}d ago`;
    },
    clock: () => new Date().toLocaleTimeString('en-GB', { hour12: false })
  };

  const sleep = (ms) => new Promise((res) => setTimeout(res, ms));

  Object.assign(MN, { esc, hash, rng, clamp, round, pick, shuffle, uid, plural, fmt, sleep });

  /* -------------------------------------------------------
     Persistent store
     ------------------------------------------------------- */
  const KEY = 'mn.platform.v1';

  const blank = () => ({
    version: 1,
    theme: null,   // null = follow the operating system
    workspace: { name: 'MN Studio', plan: 'Studio', seats: 12 },
    connectors: { figma: false, linear: false, jira: false, storybook: false, github: false, slack: false },
    debt: null,
    figma: null,
    pipeline: {
      stage: 'research',
      product: null,
      research: { signals: [], synthesis: null },
      viability: null,
      design: null,
      build: { tickets: [], sprint: 1 },
      ship: { components: [], published: 0 }
    },
    workflows: null,
    activity: []
  });

  let state = null;

  const load = () => {
    if (state) return state;
    try {
      const raw = localStorage.getItem(KEY);
      state = raw ? Object.assign(blank(), JSON.parse(raw)) : blank();
    } catch (e) {
      state = blank();
    }
    return state;
  };

  const save = () => {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* quota / private mode */ }
    listeners.forEach((fn) => { try { fn(state); } catch (e) { console.error(e); } });
  };

  const listeners = new Set();

  const store = {
    get all() { return load(); },
    get(path, fallback) {
      const s = load();
      const v = String(path).split('.').reduce((o, k) => (o == null ? o : o[k]), s);
      return v === undefined ? fallback : v;
    },
    set(path, value) {
      const s = load();
      const keys = String(path).split('.');
      const last = keys.pop();
      const target = keys.reduce((o, k) => (o[k] = o[k] || {}), s);
      target[last] = value;
      save();
      return value;
    },
    patch(fn) { fn(load()); save(); },
    reset() { state = blank(); save(); },
    subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); },
    log(kind, text) {
      const s = load();
      s.activity.unshift({ id: uid('act'), kind, text, ts: Date.now() });
      s.activity = s.activity.slice(0, 40);
      save();
    }
  };
  MN.store = store;

  /* -------------------------------------------------------
     Theme
     ------------------------------------------------------- */
  const systemDark = () => !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);

  const applyTheme = (t) => {
    document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
  };

  MN.theme = {
    /** The stored choice if there is one, otherwise whatever the OS asks for. */
    get() { return store.get('theme', null) || (systemDark() ? 'dark' : 'light'); },
    set(t) { store.set('theme', t); applyTheme(t); },
    toggle() { const next = MN.theme.get() === 'dark' ? 'light' : 'dark'; MN.theme.set(next); return next; }
  };

  applyTheme(MN.theme.get());

  // Track the OS until the viewer makes a choice of their own.
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onChange = () => { if (!store.get('theme', null)) applyTheme(MN.theme.get()); };
    if (mq.addEventListener) mq.addEventListener('change', onChange);
    else if (mq.addListener) mq.addListener(onChange);
  }

  /* -------------------------------------------------------
     Icons
     ------------------------------------------------------- */
  const ico = (d) => `<svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
  const ICONS = {
    home: ico('<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>'),
    gauge: ico('<path d="M12 21a9 9 0 1 0-9-9"/><path d="M3 12h3M12 21v-3M21 12h-3"/><path d="m12 12 4.5-4"/>'),
    figma: ico('<path d="M9 3h3v6H9a3 3 0 1 1 0-6Z"/><path d="M12 3h3a3 3 0 0 1 0 6h-3"/><path d="M9 9h3v6H9a3 3 0 1 1 0-6Z"/><path d="M9 15h3v3a3 3 0 1 1-3-3Z"/><circle cx="15" cy="12" r="3"/>'),
    pipeline: ico('<circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="M7 6h10M5 8v3a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3V8"/><path d="M12 14v2"/>'),
    agent: ico('<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4M8 14h.01M16 14h.01M9 18h6"/>'),
    book: ico('<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2Z"/><path d="M4 19a2 2 0 0 1 2-2h13"/>'),
    plug: ico('<path d="M9 3v6M15 3v6"/><path d="M6 9h12v3a6 6 0 0 1-6 6 6 6 0 0 1-6-6Z"/><path d="M12 18v3"/>'),
    sun: ico('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
    moon: ico('<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/>'),
    menu: ico('<path d="M4 7h16M4 12h16M4 17h16"/>')
  };
  MN.ICONS = ICONS;

  /* -------------------------------------------------------
     App shell — sidebar rendered from one definition
     ------------------------------------------------------- */
  const NAV = [
    {
      label: 'Workspace',
      items: [{ id: 'overview', href: 'index.html', icon: 'home', name: 'Overview' }]
    },
    {
      label: 'Journeys',
      items: [
        { id: 'debt', href: 'debt.html', icon: 'gauge', name: 'Design debt' },
        { id: 'figma', href: 'figma.html', icon: 'figma', name: 'Figma audit' },
        { id: 'build', href: 'build.html', icon: 'pipeline', name: 'Product pipeline' }
      ]
    },
    {
      label: 'Intelligence',
      items: [{ id: 'agents', href: 'agents.html', icon: 'agent', name: 'Agents & workflows' }]
    }
  ];

  const badgeFor = (id) => {
    const s = load();
    if (id === 'debt' && s.debt) return String(s.debt.report.findings.length);
    if (id === 'figma' && s.figma) return String(s.figma.report.findings.length);
    if (id === 'build') {
      const open = s.pipeline.build.tickets.filter((t) => t.status !== 'shipped').length;
      return open ? String(open) : '';
    }
    if (id === 'agents' && s.workflows) return String(s.workflows.filter((w) => w.enabled).length);
    return '';
  };

  const mountSide = () => {
    const side = document.getElementById('side');
    if (!side) return;
    const page = side.dataset.page || '';
    const s = load();
    const connected = Object.values(s.connectors).filter(Boolean).length;

    side.innerHTML = `
      <a class="side-brand" href="index.html">
        <span class="side-mark">MN</span>
        <span class="side-brand-text">
          <b>${esc(s.workspace.name)}</b>
          <span>Design intelligence</span>
        </span>
      </a>
      <nav class="side-nav" aria-label="Platform">
        ${NAV.map((g) => `
          <div class="nav-group">
            <p class="nav-label">${esc(g.label)}</p>
            ${g.items.map((it) => {
              const n = badgeFor(it.id);
              return `<a class="nav-item${it.id === page ? ' active' : ''}" href="${it.href}"
                ${it.id === page ? 'aria-current="page"' : ''}>
                ${ICONS[it.icon]}<span>${esc(it.name)}</span>
                ${n ? `<span class="nav-count">${esc(n)}</span>` : ''}
              </a>`;
            }).join('')}
          </div>`).join('')}
      </nav>
      <div class="side-foot">
        <div class="side-card">
          <b>${connected}/6 connected</b>
          ${connected
            ? esc(Object.entries(s.connectors).filter(([, v]) => v)
                .map(([k]) => k[0].toUpperCase() + k.slice(1)).join(', ')) + ' syncing.'
            : 'Connect Figma, Linear/Jira and Storybook to close the loop.'}
          <div style="margin-top:10px"><a class="btn btn-sm btn-ghost btn-full" href="agents.html#connectors"
            style="color:var(--nav-fg-strong);border-color:var(--nav-line)">Manage connections</a></div>
        </div>
      </div>`;
  };

  const mountTop = () => {
    const toggle = document.getElementById('sideToggle');
    const side = document.getElementById('side');
    // Guarded so the single-file build can re-mount the shell per route
    // without stacking listeners on controls that outlive the swap.
    if (toggle && side && !toggle.dataset.bound) {
      toggle.dataset.bound = '1';
      toggle.innerHTML = ICONS.menu;
      toggle.addEventListener('click', () => {
        const open = side.classList.toggle('open');
        toggle.setAttribute('aria-expanded', String(open));
        let scrim = document.querySelector('.scrim');
        if (open && !scrim) {
          scrim = document.createElement('div');
          scrim.className = 'scrim';
          scrim.addEventListener('click', () => {
            side.classList.remove('open');
            toggle.setAttribute('aria-expanded', 'false');
            scrim.remove();
          });
          document.body.appendChild(scrim);
        } else if (!open && scrim) {
          scrim.remove();
        }
      });
    }

    const themeBtn = document.getElementById('themeBtn');
    if (themeBtn && !themeBtn.dataset.bound) {
      themeBtn.dataset.bound = '1';
      const paint = () => {
        const dark = MN.theme.get() === 'dark';
        themeBtn.innerHTML = dark ? ICONS.sun : ICONS.moon;
        themeBtn.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
      };
      paint();
      themeBtn.addEventListener('click', () => { MN.theme.toggle(); paint(); });
    }
  };

  MN.shell = {
    mount() { mountSide(); mountTop(); },
    refresh() { mountSide(); }
  };

  /* -------------------------------------------------------
     Navigation

     Pages address each other through these two rather than
     touching location directly, so the single-file build can
     swap in a hash router without patching any controller.
     ------------------------------------------------------- */
  MN.sub = String(location.hash || '').replace(/^#\/?/, '');

  MN.goto = (page, sub) => {
    const file = (page === 'overview' ? 'index' : page) + '.html';
    window.location.href = file + (sub ? '#' + sub : '');
  };

  /* -------------------------------------------------------
     Toasts
     ------------------------------------------------------- */
  const toastWrap = () => {
    let w = document.querySelector('.toast-wrap');
    if (!w) {
      w = document.createElement('div');
      w.className = 'toast-wrap';
      w.setAttribute('role', 'status');
      w.setAttribute('aria-live', 'polite');
      document.body.appendChild(w);
    }
    return w;
  };

  MN.toast = (title, body, kind = 'ok') => {
    const icons = { ok: '✓', info: 'ℹ', warn: '!', bad: '✕', agent: '◆' };
    const t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = `<span class="tico">${icons[kind] || '✓'}</span>
      <div><b>${esc(title)}</b>${body ? `<span>${esc(body)}</span>` : ''}</div>`;
    const wrap = toastWrap();
    wrap.appendChild(t);
    // Keep the stack readable — drop the oldest beyond three.
    while (wrap.children.length > 3) wrap.firstElementChild.remove();
    setTimeout(() => {
      t.classList.add('out');
      setTimeout(() => t.remove(), 300);
    }, 4200);
  };

  /* -------------------------------------------------------
     Modal
     ------------------------------------------------------- */
  let openModal = null;

  MN.modal = (opts) => {
    MN.closeModal();
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = `
      <div class="modal${opts.wide ? ' modal-wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(opts.title || 'Dialog')}">
        <div class="modal-head">
          <div>
            <h3>${esc(opts.title || '')}</h3>
            ${opts.sub ? `<p class="sub">${esc(opts.sub)}</p>` : ''}
          </div>
          <button class="modal-x" data-close aria-label="Close">✕</button>
        </div>
        <div class="modal-body">${opts.body || ''}</div>
        ${opts.foot ? `<div class="modal-foot">${opts.foot}</div>` : ''}
      </div>`;
    document.body.appendChild(back);
    document.body.style.overflow = 'hidden';
    openModal = back;

    back.addEventListener('click', (e) => {
      if (e.target === back || e.target.closest('[data-close]')) MN.closeModal();
    });
    document.addEventListener('keydown', onEsc);
    const focusable = back.querySelector('button, [href], input, select, textarea');
    if (focusable) focusable.focus();
    if (opts.onMount) opts.onMount(back);
    return back;
  };

  const onEsc = (e) => { if (e.key === 'Escape') MN.closeModal(); };

  MN.closeModal = () => {
    if (!openModal) return;
    openModal.remove();
    openModal = null;
    document.body.style.overflow = '';
    document.removeEventListener('keydown', onEsc);
  };

  /* -------------------------------------------------------
     Tabs & accordions (declarative, no per-page wiring)
     ------------------------------------------------------- */
  MN.bindTabs = (root = document) => {
    root.querySelectorAll('[data-tabs]').forEach((group) => {
      if (group.dataset.bound) return;
      group.dataset.bound = '1';
      const tabs = [...group.querySelectorAll('.tab')];
      tabs.forEach((tab) => {
        tab.addEventListener('click', () => {
          tabs.forEach((t) => {
            const on = t === tab;
            t.setAttribute('aria-selected', String(on));
            const p = document.getElementById(t.getAttribute('aria-controls'));
            if (p) p.hidden = !on;
          });
        });
      });
    });
  };

  MN.bindAccordions = (root = document) => {
    root.querySelectorAll('.finding-head').forEach((head) => {
      if (head.dataset.bound) return;
      head.dataset.bound = '1';
      head.addEventListener('click', () => {
        const f = head.closest('.finding');
        const body = f.querySelector('.finding-body');
        const open = f.classList.toggle('open');
        head.setAttribute('aria-expanded', String(open));
        if (body) body.hidden = !open;
      });
    });
  };

  /* -------------------------------------------------------
     Animated counters & meters
     ------------------------------------------------------- */
  MN.countTo = (el, to, opts = {}) => {
    const dur = opts.duration || 900;
    const from = opts.from || 0;
    const suffix = opts.suffix || '';
    const dp = opts.decimals || 0;
    const start = performance.now();
    const step = (now) => {
      const p = Math.min(1, (now - start) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      const v = from + (to - from) * eased;
      el.textContent = (dp ? v.toFixed(dp) : String(Math.round(v))) + suffix;
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  };

  /** Fill .meter-fill widths and .gauge values once they are in the DOM. */
  MN.paintMeters = (root = document) => {
    requestAnimationFrame(() => {
      root.querySelectorAll('.meter-fill[data-v]').forEach((m) => { m.style.width = m.dataset.v + '%'; });
      root.querySelectorAll('.gauge[data-v]').forEach((g) => { g.style.setProperty('--v', g.dataset.v); });
    });
  };

  /* -------------------------------------------------------
     Severity helpers, shared across journeys
     ------------------------------------------------------- */
  MN.SEVERITY = {
    critical: { label: 'Critical', weight: 4 },
    high: { label: 'High', weight: 3 },
    medium: { label: 'Medium', weight: 2 },
    low: { label: 'Low', weight: 1 }
  };

  /** Debt score → band. Higher score means more debt. */
  MN.band = (score) => {
    if (score >= 70) return { key: 'critical', label: 'Critical debt', grade: 'F' };
    if (score >= 55) return { key: 'high', label: 'Heavy debt', grade: 'D' };
    if (score >= 38) return { key: 'medium', label: 'Moderate debt', grade: 'C' };
    if (score >= 22) return { key: 'low', label: 'Light debt', grade: 'B' };
    return { key: 'good', label: 'Healthy', grade: 'A' };
  };

  /* -------------------------------------------------------
     Copy / export helpers
     ------------------------------------------------------- */
  MN.copy = async (text, label = 'Copied') => {
    try {
      await navigator.clipboard.writeText(text);
      MN.toast(label, 'Pasted straight into your clipboard.');
    } catch (e) {
      MN.modal({
        title: 'Copy manually',
        sub: 'Clipboard access was blocked by the browser.',
        body: `<textarea class="textarea" style="min-height:280px" readonly>${esc(text)}</textarea>`
      });
    }
  };

  /* -------------------------------------------------------
     Boot
     ------------------------------------------------------- */
  const boot = () => {
    MN.shell.mount();
    MN.bindTabs();
    MN.bindAccordions();
    document.querySelectorAll('[data-year]').forEach((e) => { e.textContent = new Date().getFullYear(); });
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

/* =========================================================
   MN Studio — Design Debt Engine

   Turns a product source (live URL, demo video, or Figma
   file) plus declared team context into a Design Debt Index,
   a findings ledger, debt economics, and a phased
   refactoring strategy.

   HOW THE MODEL WORKS
   -------------------
   Two classes of signal feed every score:

     • DECLARED  — facts the user gives us (surface count,
                   design-system maturity, team shape,
                   accessibility target, release cadence).
                   These drive the deterministic base scores
                   and are marked `measured: true`.

     • OBSERVED  — signals a real crawler/vision pass would
                   collect from the artefact (token sprawl,
                   contrast failures, detached instances).
                   In this prototype they are synthesised
                   from a seeded PRNG keyed to the source, so
                   the same input always produces the same
                   report. Marked `measured: false` and
                   surfaced as "simulated" in the UI.

   Swap `observe()` for a real analyzer and the rest of the
   engine — scoring, economics, roadmap — works unchanged.
   ========================================================= */
(() => {
  'use strict';

  const MN = window.MN = window.MN || {};
  const { clamp, round, rng, hash } = MN;

  /* -------------------------------------------------------
     Dimensions — weights sum to 1.00
     ------------------------------------------------------- */
  const DIMENSIONS = [
    {
      key: 'consistency', weight: 0.16, name: 'Visual consistency',
      blurb: 'Colour, type, spacing and elevation applied from one source of truth.'
    },
    {
      key: 'system', weight: 0.16, name: 'Component system health',
      blurb: 'Reuse versus one-off components, variant coverage, and API coherence.'
    },
    {
      key: 'a11y', weight: 0.14, name: 'Accessibility',
      blurb: 'Contrast, focus order, target size, semantics and assistive-tech support.'
    },
    {
      key: 'flow', weight: 0.13, name: 'Interaction & flow',
      blurb: 'Step count, dead ends, error recovery, empty and loading states.'
    },
    {
      key: 'ia', weight: 0.11, name: 'IA & content',
      blurb: 'Navigation depth, labelling, hierarchy and microcopy consistency.'
    },
    {
      key: 'responsive', weight: 0.10, name: 'Responsive & platform fit',
      blurb: 'Breakpoint integrity and native conventions per platform.'
    },
    {
      key: 'perf', weight: 0.10, name: 'Perceived performance',
      blurb: 'Layout shift, skeletons, optimistic UI and interaction latency.'
    },
    {
      key: 'drift', weight: 0.10, name: 'Design–code drift',
      blurb: 'How far shipped UI has diverged from the design source and its docs.'
    }
  ];

  /* -------------------------------------------------------
     Context normalisation
     ------------------------------------------------------- */
  const STAGE_PRESSURE = { 'pre-seed': 22, seed: 16, 'series-a': 10, growth: 4, scale: 0 };
  const SYSTEM_DEBT = { none: 70, partial: 44, mature: 20 };
  const A11Y_DEBT = { none: 66, aa: 36, aaa: 20 };
  const CADENCE_PRESSURE = { monthly: 2, biweekly: 6, weekly: 11, daily: 17 };
  const PEER_MEDIAN = { 'pre-seed': 58, seed: 54, 'series-a': 47, growth: 41, scale: 34 };

  const normalise = (ctx) => ({
    stage: ctx.stage || 'seed',
    surfaces: clamp(Number(ctx.surfaces) || 20, 1, 400),
    designers: clamp(Number(ctx.designers) || 1, 0, 60),
    engineers: clamp(Number(ctx.engineers) || 4, 1, 400),
    system: ctx.system || 'partial',
    platforms: (ctx.platforms && ctx.platforms.length) ? ctx.platforms : ['web'],
    cadence: ctx.cadence || 'biweekly',
    a11yTarget: ctx.a11yTarget || 'none',
    rate: clamp(Number(ctx.rate) || 620, 100, 5000),
    age: clamp(Number(ctx.age) || 2, 0, 30),
    hasStorybook: !!ctx.hasStorybook,
    hasTokens: !!ctx.hasTokens,
    notes: ctx.notes || ''
  });

  /* -------------------------------------------------------
     OBSERVED signals — replace with a real analyzer
     ------------------------------------------------------- */
  const observe = (source, c, r) => {
    const scale = Math.sqrt(c.surfaces);
    const looseness = c.system === 'none' ? 1.5 : c.system === 'partial' ? 1 : 0.55;

    return {
      hexValues: Math.round((9 + scale * 4.2 * looseness) * (0.8 + r() * 0.5)),
      tokenHexes: c.hasTokens ? Math.round(8 + r() * 6) : 0,
      textStyles: Math.round((5 + scale * 2.1 * looseness) * (0.8 + r() * 0.5)),
      spacingValues: Math.round((6 + scale * 2.6 * looseness) * (0.8 + r() * 0.45)),
      shadowStyles: Math.round(2 + scale * 0.9 * looseness * (0.7 + r() * 0.7)),
      components: Math.round(18 + c.surfaces * (1.5 + r())),
      oneOffs: 0, // filled below
      variantGaps: Math.round(3 + r() * 9 * looseness),
      contrastFails: Math.round((c.a11yTarget === 'none' ? 9 : 3) * scale * 0.55 * (0.6 + r())),
      smallTargets: Math.round((c.a11yTarget === 'none' ? 7 : 2) * scale * 0.4 * (0.6 + r())),
      unlabelled: Math.round((c.a11yTarget === 'none' ? 11 : 3) * scale * 0.4 * (0.6 + r())),
      focusTraps: Math.round(r() * (c.a11yTarget === 'none' ? 4 : 1.4)),
      deadEnds: Math.round(r() * scale * 0.75),
      missingEmpty: Math.round(scale * (0.8 + r() * 0.9)),
      missingError: Math.round(scale * (0.6 + r() * 0.8)),
      longestFlow: Math.round(4 + r() * 7),
      navDepth: Math.round(2 + r() * 3),
      labelClashes: Math.round(2 + scale * 0.8 * (0.5 + r())),
      breakpointBreaks: Math.round(scale * 0.7 * (0.4 + r()) * c.platforms.length),
      cls: round(0.03 + r() * 0.24, 3),
      lcp: round(1.3 + r() * 3.1, 2),
      noSkeleton: Math.round(scale * (0.5 + r())),
      driftedScreens: Math.round(c.surfaces * (c.system === 'mature' ? 0.12 : c.system === 'partial' ? 0.28 : 0.46) * (0.7 + r() * 0.6)),
      storyCoverage: c.hasStorybook ? Math.round(45 + r() * 45) : Math.round(r() * 18),
      staleSpecs: Math.round(3 + r() * 14)
    };
  };

  /* -------------------------------------------------------
     Dimension scoring — 0 healthy … 100 crushing debt
     ------------------------------------------------------- */
  const scoreDimensions = (c, o, r) => {
    const stage = STAGE_PRESSURE[c.stage] ?? 12;
    const cadence = CADENCE_PRESSURE[c.cadence] ?? 6;
    const scale = Math.sqrt(c.surfaces) / 4;              // 20 screens ≈ 1.1
    const designRatio = c.designers / Math.max(1, c.engineers); // <0.12 is thin cover
    const thinCover = clamp((0.18 - designRatio) * 90, 0, 18);
    const jitter = () => (r() - 0.5) * 8;

    const raw = {
      consistency:
        (SYSTEM_DEBT[c.system] ?? 44) * 0.62 +
        (c.hasTokens ? -9 : 9) +
        scale * 7 + thinCover * 0.5 + stage * 0.35 + jitter(),

      system:
        (SYSTEM_DEBT[c.system] ?? 44) * 0.8 +
        scale * 6 + thinCover * 0.7 + cadence * 0.4 + jitter(),

      a11y:
        (A11Y_DEBT[c.a11yTarget] ?? 66) * 0.86 +
        scale * 5 + stage * 0.3 + jitter(),

      flow:
        24 + stage * 0.9 + scale * 8 + thinCover * 0.8 + jitter(),

      ia:
        20 + scale * 11 + stage * 0.5 + (c.age > 3 ? 9 : 0) + jitter(),

      responsive:
        16 + (c.platforms.length - 1) * 13 + scale * 8 + thinCover * 0.4 + jitter(),

      perf:
        18 + cadence * 0.9 + scale * 7 + stage * 0.4 + jitter(),

      drift:
        (c.hasStorybook ? 20 : 46) +
        (SYSTEM_DEBT[c.system] ?? 44) * 0.28 +
        cadence * 0.8 + scale * 5 + thinCover * 0.6 + jitter()
    };

    return DIMENSIONS.map((d) => ({
      ...d,
      score: round(clamp(raw[d.key], 3, 97), 1)
    }));
  };

  /* -------------------------------------------------------
     Findings catalogue
       gate  — minimum dimension score for this to fire
       imp   — business impact 0-100
       eff   — remediation effort in person-days
     ------------------------------------------------------- */
  const CATALOG = [
    /* --- consistency --- */
    {
      dim: 'consistency', gate: 30, imp: 74, eff: 6, owner: 'Design systems',
      title: 'Colour is applied ad hoc rather than from tokens',
      why: 'Every new hex value is a decision the next person has to re-make, and a value no theme switch or rebrand can reach. It is the single largest multiplier on every other consistency problem.',
      ev: (o, c) => [
        { label: 'Distinct colour values in shipped UI', value: o.hexValues, measured: false },
        { label: 'Values defined as tokens', value: o.tokenHexes || 'none', measured: true },
        { label: 'Untokenised share', value: MN.fmt.pct(100 - (o.tokenHexes / o.hexValues) * 100), measured: false }
      ],
      fixes: [
        'Extract the live palette, cluster near-duplicates within ΔE < 3, and collapse to a ramp of 9 neutrals plus 4 semantic families.',
        'Publish as CSS custom properties and Figma variables from one source file so both sides consume the same names.',
        'Add a lint rule that fails CI on raw hex values outside the token file.'
      ]
    },
    {
      dim: 'consistency', gate: 34, imp: 62, eff: 5, owner: 'Design systems',
      title: 'Type scale has drifted into arbitrary sizes',
      why: 'An unbounded type scale makes hierarchy unreadable and forces per-screen judgement calls that no two people make the same way.',
      ev: (o) => [
        { label: 'Distinct font-size / line-height pairs', value: o.textStyles, measured: false },
        { label: 'Sizes a modular scale would need', value: 7, measured: true },
        { label: 'Redundant styles', value: Math.max(0, o.textStyles - 7), measured: false }
      ],
      fixes: [
        'Define a 7-step modular scale (1.25 ratio) with paired line-heights and semantic names — display, title, body, caption.',
        'Map every existing style to its nearest scale step; ship the mapping table as the migration checklist.',
        'Delete the orphan styles from Figma so they cannot be re-picked.'
      ]
    },
    {
      dim: 'consistency', gate: 42, imp: 55, eff: 4, owner: 'Design systems',
      title: 'Spacing is eyeballed, not gridded',
      why: 'Off-grid spacing reads as "slightly broken" without anyone being able to say why, and makes every layout unmergeable with a systematised one later.',
      ev: (o) => [
        { label: 'Distinct spacing values', value: o.spacingValues, measured: false },
        { label: 'On a 4pt grid', value: MN.fmt.pct(Math.max(24, 100 - o.spacingValues * 2.4)), measured: false }
      ],
      fixes: [
        'Adopt a 4pt base grid with a 6-step spacing scale and name the steps by intent, not size.',
        'Auto-snap existing values to the nearest step; hand-review only the deltas above 4px.'
      ]
    },
    {
      dim: 'consistency', gate: 52, imp: 44, eff: 3, owner: 'Design systems',
      title: 'Elevation and radius have no shared language',
      why: 'Inconsistent depth cues break the visual hierarchy that tells users what is interactive, floating or fixed.',
      ev: (o) => [
        { label: 'Distinct shadow definitions', value: o.shadowStyles, measured: false },
        { label: 'Elevation levels a system needs', value: 4, measured: true }
      ],
      fixes: [
        'Reduce to 4 elevation levels tied to z-index bands, plus 3 radius steps.',
        'Express both as tokens and forbid inline shadow values in review.'
      ]
    },

    /* --- system --- */
    {
      dim: 'system', gate: 28, imp: 82, eff: 14, owner: 'Design systems',
      title: 'One-off components outnumber systematised ones',
      why: 'This is the compounding core of design debt: every bespoke component is a future bug surface, a fresh accessibility risk, and a change that has to be made N times instead of once.',
      ev: (o, c) => {
        const oneOff = Math.round(o.components * (c.system === 'none' ? 0.62 : c.system === 'partial' ? 0.38 : 0.16));
        return [
          { label: 'Total components in product', value: o.components, measured: false },
          { label: 'Bespoke / one-off', value: oneOff, measured: false },
          { label: 'Reuse rate', value: MN.fmt.pct(100 - (oneOff / o.components) * 100), measured: false },
          { label: 'Healthy reuse rate', value: '78%+', measured: true }
        ];
      },
      fixes: [
        'Run a component census, cluster by visual and behavioural similarity, and pick one canonical implementation per cluster.',
        'Rebuild the canonical set with a variant API rather than forking — props for state, size and emphasis.',
        'Codemod call sites in waves, most-used component first, so each wave retires real duplicates.'
      ]
    },
    {
      dim: 'system', gate: 36, imp: 66, eff: 8, owner: 'Design systems',
      title: 'Components lack the states they are used in',
      why: 'Missing loading, disabled, error and empty variants get improvised at the call site, which is how one component becomes eleven.',
      ev: (o) => [
        { label: 'Components missing required variants', value: o.variantGaps, measured: false },
        { label: 'Most common gap', value: 'loading / disabled', measured: false }
      ],
      fixes: [
        'Define a mandatory state matrix — default, hover, focus, active, disabled, loading, error — for every interactive component.',
        'Block new components in review until every cell in the matrix is either implemented or explicitly marked N/A.'
      ]
    },
    {
      dim: 'system', gate: 55, imp: 58, eff: 7, owner: 'Design systems',
      title: 'No component ownership or deprecation path',
      why: 'Without an owner and a deprecation route, the system accumulates instead of evolving — old and new patterns ship side by side indefinitely.',
      ev: () => [
        { label: 'Documented component owners', value: 'none found', measured: false },

    {

    {

        { label: 'Views with no error state', value: o.missingError, measured: false }
      ],
      fixes: [

        'Define an error taxonomy (recoverable, retryable, terminal) and one component per class.'
      ]
    },
    {
      dim: 'flow', gate: 48, imp: 70, eff: 4, owner: 'Product design',
      title: 'Flows dead-end with no recovery path',
      why: 'A dead end converts a recoverable moment into an abandoned session and a support ticket.',
      ev: (o) => [{ label: 'Dead-end screens found', value: o.deadEnds, measured: false }],
      fixes: [
        'Guarantee every terminal screen offers a next action, a way back, and a way to get help.',

    },

    /* --- ia --- */
    {
      dim: 'ia', gate: 30, imp: 60, eff: 6, owner: 'Product design',
      title: 'Navigation is deeper than the mental model',
      why: 'Depth beyond three levels reliably hides features from the people paying for them, and inflates support load for functionality that already exists.',
      ev: (o) => [
        { label: 'Maximum navigation depth', value: o.navDepth + ' levels', measured: false },
        { label: 'Recommended maximum', value: '3 levels', measured: true }
      ],
      fixes: [
        'Run a tree test against the current IA to find where the model and the menu disagree.',
        'Flatten to a maximum of three levels and promote high-frequency destinations.'
      ]
    },
    {
      dim: 'ia', gate: 38, imp: 52, eff: 4, owner: 'Content design',
      title: 'The same concept is named several different things',
      why: 'Terminology drift between UI, docs and support is a hidden tax on every conversation a user or a colleague has about the product.',
      ev: (o) => [
        { label: 'Concepts with competing labels', value: o.labelClashes, measured: false },
        { label: 'Example', value: 'workspace / project / board', measured: false }
      ],
      fixes: [
        'Build a product lexicon with one approved term per concept and its banned synonyms.',
        'Wire the lexicon into the writing review and into component prop names.'
      ]
    },

    /* --- responsive --- */
    {
      dim: 'responsive', gate: 30, imp: 63, eff: 6, owner: 'Front-end',
      title: 'Layouts break between the designed breakpoints',
      why: 'Designing to three fixed widths leaves the ranges between them undefined — which is where most real devices sit.',
      ev: (o) => [
        { label: 'Views breaking off-breakpoint', value: o.breakpointBreaks, measured: false },
        { label: 'Worst range', value: '820–1040px', measured: false }
      ],
      fixes: [

    },
    {
      dim: 'responsive', gate: 46, imp: 56, eff: 8, owner: 'Product design',
      title: 'Native platform conventions are overridden by web patterns',
      why: 'Users judge a native app against its platform, not against your web app. Convention breaks read as low quality even when the design is objectively fine.',
      ev: (o, c) => [
        { label: 'Platforms shipped', value: c.platforms.join(', '), measured: true },
        { label: 'Convention breaks', value: Math.round(o.breakpointBreaks * 0.6), measured: false }
      ],
      fixes: [
        'Define which patterns are shared and which are deliberately per-platform, then document the split.',
