      ]
    },

    /* --- perf --- */
    {
      dim: 'perf', gate: 30, imp: 67, eff: 5, owner: 'Front-end',
      title: 'Layout shift makes the interface feel unstable',
      why: 'Cumulative layout shift is perceived as unreliability rather than slowness, and it directly causes mis-taps on the elements that move.',
      ev: (o) => [
        { label: 'Cumulative Layout Shift', value: o.cls, measured: false },
        { label: 'Good threshold', value: '< 0.1', measured: true }
      ],
      fixes: [
        'Reserve space for images, embeds and async content with explicit aspect ratios.',
        'Replace late-injected banners with slots that exist in the first paint.'
      ]
    },
    {
      dim: 'perf', gate: 38, imp: 61, eff: 5, owner: 'Front-end',
      title: 'Waiting states are blank rather than structural',
      why: 'A spinner tells the user nothing is happening; a skeleton tells them what is about to arrive. Perceived speed moves without the backend changing at all.',
      ev: (o) => [
        { label: 'Largest Contentful Paint', value: o.lcp + 's', measured: false },
        { label: 'Views with no skeleton', value: o.noSkeleton, measured: false }
      ],
      fixes: [
        'Ship skeletons shaped like the eventual content for every view above 400ms.',
        'Apply optimistic UI to the actions users repeat most.'
      ]
    },

    /* --- drift --- */
    {
      dim: 'drift', gate: 26, imp: 77, eff: 9, owner: 'Design + Front-end',
      title: 'Shipped UI has diverged from the design source',
      why: 'Once the design file stops describing the product, every future decision is made against a fiction — and design review stops catching anything real.',
      ev: (o, c) => [
        { label: 'Screens that differ from source', value: o.driftedScreens, measured: false },
        { label: 'Share of product', value: MN.fmt.pct((o.driftedScreens / c.surfaces) * 100), measured: false }
      ],
      fixes: [
        'Reconcile in one direction only: shipped code becomes the truth, and the design file is rebuilt from it.',
        'Introduce visual regression tests so the reconciled state cannot silently drift again.',
        'Publish components to Storybook as the shared reference both sides review against.'
      ]
    },
    {
      dim: 'drift', gate: 34, imp: 64, eff: 7, owner: 'Front-end',
      title: 'Components ship without stories or documentation',
      why: 'Undocumented components get rebuilt by the next engineer who cannot find them, which is how the one-off count grows even after a system exists.',
      ev: (o) => [
        { label: 'Storybook coverage', value: MN.fmt.pct(o.storyCoverage), measured: true },
        { label: 'Healthy coverage', value: '85%+', measured: true }
      ],
      fixes: [
        'Require a story per variant as a merge condition for anything in the component directory.',
        'Auto-publish Storybook per branch so review happens against the real component.'
      ]
    },
    {
      dim: 'drift', gate: 50, imp: 49, eff: 4, owner: 'Product design',
      title: 'Specs describe features that no longer exist',
      why: 'Stale specs cost more than no specs — they send engineers confidently in the wrong direction.',
      ev: (o) => [{ label: 'Specs stale > 90 days', value: o.staleSpecs, measured: false }],
      fixes: [
        'Archive anything untouched for a quarter and mark the survivors with a review date.',
        'Move durable decisions into the component docs and let the specs stay disposable.'
      ]
    }
  ];

  /* -------------------------------------------------------
     Severity from impact + how bad the dimension is
     ------------------------------------------------------- */
  const severityOf = (imp, dimScore) => {
    const s = imp * 0.62 + dimScore * 0.38;
    if (s >= 74) return 'critical';
    if (s >= 60) return 'high';
    if (s >= 45) return 'medium';
    return 'low';
  };

  /* -------------------------------------------------------
     Economics
     ------------------------------------------------------- */
  const economics = (index, findings, c) => {
    const principalDays = round(findings.reduce((sum, f) => sum + f.effort, 0), 1);
    const principalCost = principalDays * c.rate;

    // Velocity drag: the share of delivery capacity lost to working
    // around the debt. Non-linear — debt compounds past the midpoint.
    const velocityDrag = round(clamp(Math.pow(index / 100, 1.45) * 52, 0, 44), 1);

    const teamSize = c.designers + c.engineers;
    const sprintDays = teamSize * 10;
    const interestPerSprint = round((velocityDrag / 100) * sprintDays * c.rate);
    const annualInterest = interestPerSprint * 26;

    const reworkRate = round(clamp(index * 0.34, 4, 38), 1);
    const paybackSprints = interestPerSprint > 0 ? round(principalCost / interestPerSprint, 1) : 0;
    const yearOneRoi = principalCost > 0 ? round(((annualInterest - principalCost) / principalCost) * 100) : 0;

    return {
      principalDays, principalCost, velocityDrag, interestPerSprint,
      annualInterest, reworkRate, paybackSprints, yearOneRoi,
      teamSize, sprintDays, rate: c.rate
    };
  };

  /* -------------------------------------------------------
     Refactoring strategy — three waves
     ------------------------------------------------------- */
  const buildRoadmap = (findings, index, c) => {
    const value = (f) => f.impact / Math.max(1, f.effort);

    // Every finding lands in exactly one wave — nothing is dropped.
    const waveFor = (f) => {
      if (f.severity === 'critical') return 1;
      if (f.impact >= 55 && f.effort <= 6) return 1;          // quick win
      if (['consistency', 'system', 'a11y'].includes(f.dimension)) return 2;
      return 3;
    };

    const buckets = { 1: [], 2: [], 3: [] };
    findings.forEach((f) => buckets[waveFor(f)].push(f));
    Object.values(buckets).forEach((b) => b.sort((a, z) => value(z) - value(a)));

    // Wave 1 has to stay shippable inside a quarter. Overflow slides
    // down a wave rather than disappearing from the plan.
    while (buckets[1].length > 8) buckets[2].unshift(buckets[1].pop());
    while (buckets[2].length > 9) buckets[3].unshift(buckets[2].pop());

    // A remediation squad, not the whole team — 35% of people, capped at 6.
    const squad = Math.max(1, Math.min(6, round((c.designers + c.engineers) * 0.35, 1)));

    const META = [
      {
        name: 'Wave 1 — Stabilise',
        goal: 'Stop the bleeding. Ship the fixes that remove user-visible harm and legal exposure, and buy back the capacity needed to do the rest.',
        outcome: 'Accessibility exposure closed, dead ends removed, and the most expensive inconsistencies pulled into tokens.'
      },
      {
        name: 'Wave 2 — Systematise',
        goal: 'Build the single source of truth: tokens, a consolidated component set, and the review gates that keep both honest.',
        outcome: 'One canonical component per pattern, a contrast-safe token ramp, and a mandatory state matrix in review.'
      },
      {
        name: 'Wave 3 — Scale',
        goal: 'Make the improvement permanent. Close the design–code loop so drift is caught by machines rather than by memory.',
        outcome: 'Storybook as the shared reference, visual regression in CI, and a deprecation path that actually retires code.'
      }
    ];

    const waves = [1, 2, 3].map((n) => {
      const items = buckets[n];
      const days = round(items.reduce((s, f) => s + f.effort, 0), 1);
      return {
        ...META[n - 1],
        items,
        days,
        squad,
        weeks: Math.max(1, Math.ceil(days / squad / 5)),
        reduction: 0,
        indexAfter: index
      };
    }).filter((w) => w.items.length);

    // Project the index down as each wave lands, weighted by the
    // impact it removes. 0.82 leaves headroom for debt taken on while
    // the remediation itself is in flight.
    const totalImpact = findings.reduce((s, f) => s + f.impact, 0) || 1;
    let running = index;
    waves.forEach((w) => {
      const share = w.items.reduce((s, f) => s + f.impact, 0) / totalImpact;
      w.reduction = round(index * share * 0.82, 1);
      running = round(clamp(running - w.reduction, 5, 100), 1);
      w.indexAfter = running;
    });

    const quickWins = findings
      .filter((f) => f.impact >= 55 && f.effort <= 6)
      .sort((a, z) => value(z) - value(a));

    return { waves, quickWins, projectedIndex: running };
  };

  /* -------------------------------------------------------
     Scan choreography (per source kind)
     ------------------------------------------------------- */
  const SCAN_STEPS = {
    url: [
      'Resolving target and crawling reachable routes',
      'Capturing rendered DOM, computed styles and screenshots',
      'Extracting colour, type, spacing and elevation values',
      'Clustering components by visual and structural similarity',
      'Running accessibility checks — contrast, names, focus, targets',
      'Replaying core flows and probing empty / error states',
      'Measuring layout stability and paint timings',
      'Scoring dimensions and composing the refactor strategy'
    ],
    video: [
      'Decoding upload and sampling keyframes at scene boundaries',
      'Detecting screens, transitions and repeated regions',
      'Reading on-screen text and inferring the interaction graph',
      'Sampling palette, type and spacing from rendered frames',
      'Estimating contrast and target sizes from pixel geometry',
      'Reconstructing the demoed flow and its branch points',
      'Timing interaction latency between input and response',
      'Scoring dimensions and composing the refactor strategy'
    ],
    figma: [
      'Reading file tree — pages, frames, components and variants',
      'Indexing local styles, variables and published library links',
      'Detecting detached instances and overridden components',
      'Clustering near-duplicate components across pages',
      'Checking contrast and target sizes on rendered frames',
      'Auditing auto-layout, constraints and naming conventions',
      'Comparing library usage against the shipped front-end',
      'Scoring dimensions and composing the refactor strategy'
    ]
  };

  /* -------------------------------------------------------
     Public API
     ------------------------------------------------------- */
  const analyze = (input) => {
    const c = normalise(input.context || {});
    const seed = hash(`${input.kind}|${input.source}|${c.surfaces}|${c.system}|${c.a11yTarget}|${c.stage}`);
    const r = rng(seed);
    const o = observe(input.source, c, r);

    const dims = scoreDimensions(c, o, r);
    const dimMap = Object.fromEntries(dims.map((d) => [d.key, d]));

    // Composite Design Debt Index — weighted dimension scores.
    const index = round(dims.reduce((s, d) => s + d.score * d.weight, 0), 1);

    // Fire the findings whose dimension is bad enough to warrant them.
    const findings = CATALOG
      .filter((f) => dimMap[f.dim].score >= f.gate)
      .map((f, i) => {
        const dimScore = dimMap[f.dim].score;
        const wobble = (r() - 0.5) * 10;
        const impact = round(clamp(f.imp * 0.72 + dimScore * 0.28 + wobble, 8, 99));
        const effort = round(clamp(f.eff * (0.72 + (dimScore / 100) * 0.8), 1, 40), 1);
        return {
          id: `F-${String(i + 1).padStart(2, '0')}`,
          dimension: f.dim,
          dimensionName: dimMap[f.dim].name,
          title: f.title,
          why: f.why,
          owner: f.owner,
          severity: severityOf(impact, dimScore),
          impact,
          effort,
          confidence: round(clamp(62 + r() * 34, 40, 97)),
          evidence: f.ev(o, c),
          fixes: f.fixes
        };
      })
      .sort((a, b) => b.impact - a.impact || a.effort - b.effort);

    // Attach finding counts back onto their dimensions.
    dims.forEach((d) => {
      d.findings = findings.filter((f) => f.dimension === d.key).length;
      d.band = MN.band(d.score);
    });

    const econ = economics(index, findings, c);
    const roadmap = buildRoadmap(findings, index, c);
    const band = MN.band(index);

    // Confidence in the whole report: a live URL gives us more than a video.
    const baseConfidence = { url: 84, figma: 91, video: 68 }[input.kind] || 75;
    const confidence = round(clamp(baseConfidence - (c.surfaces > 60 ? 6 : 0) + (c.hasStorybook ? 4 : 0), 40, 97));

    return {
      id: uidReport(seed),
      kind: input.kind,
      source: input.source,
      label: input.label || input.source,
      generatedAt: Date.now(),
      context: c,
      observed: o,
      index,
      band,
      confidence,
      dimensions: dims,
      findings,
      economics: econ,
      roadmap: roadmap.waves,
      quickWins: roadmap.quickWins,
      projectedIndex: roadmap.projectedIndex,
      benchmark: {
        you: index,
        peerMedian: PEER_MEDIAN[c.stage] ?? 48,
        topQuartile: round((PEER_MEDIAN[c.stage] ?? 48) * 0.58, 1)
      },
      scanSteps: SCAN_STEPS[input.kind] || SCAN_STEPS.url
    };
  };

  const uidReport = (seed) => 'DDR-' + (seed % 100000).toString().padStart(5, '0');

  /* -------------------------------------------------------
     Exports: markdown report, and tickets for the pipeline
     ------------------------------------------------------- */
  const toMarkdown = (rep) => {
    const L = [];
    L.push(`# Design debt report — ${rep.label}`);
    L.push('');
    L.push(`**Report** ${rep.id}  ·  **Generated** ${new Date(rep.generatedAt).toISOString().slice(0, 10)}  ·  **Confidence** ${rep.confidence}%`);
    L.push('');
    L.push(`## Design Debt Index: ${rep.index} / 100 — ${rep.band.label} (grade ${rep.band.grade})`);
    L.push('');
    L.push(`Peer median at ${rep.context.stage}: ${rep.benchmark.peerMedian}. Top quartile: ${rep.benchmark.topQuartile}.`);
    L.push('');
    L.push('## Debt economics');
    L.push('');
    L.push(`| Measure | Value |`);
    L.push(`| --- | --- |`);
    L.push(`| Principal (remediation effort) | ${rep.economics.principalDays} person-days · ${MN.fmt.money(rep.economics.principalCost)} |`);
    L.push(`| Interest (cost per sprint) | ${MN.fmt.money(rep.economics.interestPerSprint)} |`);
    L.push(`| Annualised interest | ${MN.fmt.money(rep.economics.annualInterest)} |`);
    L.push(`| Delivery capacity lost | ${rep.economics.velocityDrag}% |`);
    L.push(`| Payback | ${rep.economics.paybackSprints} sprints |`);
    L.push(`| Year-one ROI | ${rep.economics.yearOneRoi}% |`);
    L.push('');
    L.push('## Dimension scores');
    L.push('');
    L.push('| Dimension | Weight | Debt score | Findings |');
    L.push('| --- | --- | --- | --- |');
    rep.dimensions.forEach((d) => L.push(`| ${d.name} | ${Math.round(d.weight * 100)}% | ${d.score} | ${d.findings} |`));
    L.push('');
    L.push('## Findings');
    rep.findings.forEach((f) => {
      L.push('');
      L.push(`### ${f.id} · ${f.title}`);
      L.push(`*${MN.SEVERITY[f.severity].label} · ${f.dimensionName} · impact ${f.impact}/100 · ${f.effort} person-days · owner: ${f.owner}*`);
      L.push('');
      L.push(f.why);
      L.push('');
      L.push('**Evidence**');
      f.evidence.forEach((e) => L.push(`- ${e.label}: \`${e.value}\`${e.measured ? '' : ' _(observed)_'}`));
      L.push('');
      L.push('**Remediation**');
      f.fixes.forEach((x) => L.push(`- ${x}`));
    });
    L.push('');
    L.push('## Refactoring strategy');
    rep.roadmap.forEach((w) => {
      L.push('');
      L.push(`### ${w.name} — ~${w.weeks} weeks · ${w.days} person-days`);
      L.push('');
      L.push(w.goal);
      L.push('');
      w.items.forEach((f) => L.push(`- ${f.id} ${f.title} (${f.effort}d)`));
      L.push('');
      L.push(`**Outcome** ${w.outcome} Index falls to ~${w.indexAfter}.`);
    });
    L.push('');
    L.push(`Projected index after all three waves: **${rep.projectedIndex}** (from ${rep.index}).`);
    L.push('');
    L.push('---');
    L.push('Generated by MN Studio — design intelligence platform.');
    return L.join('\n');
  };

  const toTickets = (rep, source = 'mn') => rep.findings.map((f, i) => ({
    id: MN.uid('tkt'),
    key: `${source === 'jira' ? 'DES' : 'DBT'}-${100 + i}`,
    source,
    title: f.title,
    body: f.why,
    type: f.severity === 'critical' || f.severity === 'high' ? 'bug' : 'chore',
    severity: f.severity,
    points: Math.max(1, Math.round(f.effort / 2)),
    status: 'backlog',
    origin: rep.id,
    dimension: f.dimensionName,
    fixes: f.fixes,
    agent: null,
    log: []
  }));

  MN.DebtEngine = { DIMENSIONS, CATALOG, analyze, toMarkdown, toTickets, SCAN_STEPS, normalise };
})();

/* =========================================================
   MN Studio — Debt report renderer

   One renderer, two entry points: the live-link / demo-video
   calculator and the Figma audit both produce the same report
   shape, so they share this view.
   ========================================================= */
(() => {
  'use strict';

  const MN = window.MN;
  const { esc, fmt } = MN;

  const sevBadge = (s) => `<span class="badge ${s} dot">${MN.SEVERITY[s].label}</span>`;

  /* ---------- summary ---------- */
  const summary = (rep) => {
    const b = rep.band;
    const e = rep.economics;
    const delta = MN.round(rep.benchmark.peerMedian - rep.index, 1);
    const vsPeer = delta > 0
      ? `<b class="strong">${Math.abs(delta)} points better</b> than the median at ${esc(rep.context.stage)}`
      : `<b class="strong">${Math.abs(delta)} points worse</b> than the median at ${esc(rep.context.stage)}`;

    return `
      <div class="card" style="overflow:hidden">
        <div class="card-body" style="display:flex;gap:34px;align-items:center;flex-wrap:wrap">
          <div class="gauge" data-v="${rep.index}" style="--gc:var(--${b.key === 'good' ? 'good' : b.key})">
            <div class="gauge-inner">
              <div class="gauge-num" id="ddiNum">0</div>
              <div class="gauge-cap">Debt index</div>
            </div>
          </div>

          <div class="grow" style="min-width:280px">
            <div class="row-wrap" style="margin-bottom:10px">
              <span class="grade g-${b.grade.toLowerCase()}">${b.grade}</span>
              <div>
                <h2 style="margin:0 0 2px">${esc(b.label)}</h2>
                <p class="small muted" style="margin:0">
                  ${esc(rep.id)} · ${MN.plural(rep.findings.length, 'finding')} ·
                  ${rep.confidence}% confidence · ${esc(new Date(rep.generatedAt).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }))}
                </p>
              </div>
            </div>
            <p style="max-width:56ch">
              ${esc(rep.label)} carries a debt index of <b class="strong">${rep.index}</b> — ${vsPeer}.
              Paying it down costs <b class="strong">${e.principalDays} person-days</b>; carrying it
              costs <b class="strong">${fmt.money(e.interestPerSprint)} every sprint</b> in lost capacity.
            </p>
            <div class="row-wrap">
              <span class="chip">Source <b>${esc(rep.kind === 'url' ? 'live crawl' : rep.kind === 'video' ? 'demo video' : 'Figma file')}</b></span>
              <span class="chip">${MN.plural(rep.context.surfaces, 'surface')}</span>
              <span class="chip">${MN.plural(rep.context.designers, 'designer')} · ${MN.plural(rep.context.engineers, 'engineer')}</span>
              <span class="chip">${esc(rep.context.system)} design system</span>
            </div>
          </div>
        </div>
      </div>`;
  };

  /* ---------- economics tiles ---------- */
  const tiles = (rep) => {
    const e = rep.economics;
    return `
      <div class="grid g4" style="margin-top:18px">
        <div class="tile">
          <p class="tile-label">Principal</p>
          <p class="tile-value">${fmt.money0(e.principalCost)}</p>
          <p class="tile-note">${e.principalDays} person-days to clear the ledger</p>
        </div>
        <div class="tile">
          <p class="tile-label">Interest / sprint</p>
          <p class="tile-value">${fmt.money0(e.interestPerSprint)}</p>
          <p class="tile-note up">↑ ${fmt.money0(e.annualInterest)} a year if nothing changes</p>
        </div>
        <div class="tile">
          <p class="tile-label">Capacity lost</p>
          <p class="tile-value">${e.velocityDrag}<small>%</small></p>
          <p class="tile-note">of ${MN.plural(e.teamSize, 'person')}' delivery time, ${e.reworkRate}% of work is rework</p>
        </div>
        <div class="tile">
          <p class="tile-label">Payback</p>
          <p class="tile-value">${e.paybackSprints}<small>sprints</small></p>
          <p class="tile-note down">↓ ${e.yearOneRoi}% year-one return on the fix</p>
        </div>
      </div>`;
  };

  /* ---------- benchmark ---------- */
  const benchmark = (rep) => {
    const bm = rep.benchmark;
    const pos = (v) => MN.clamp(v, 2, 98);
    return `
      <div class="card card-pad" style="margin-top:18px">
        <div class="row-between" style="margin-bottom:26px">
          <div>
            <h3 style="margin:0">Where you sit</h3>
            <p class="small muted" style="margin:3px 0 0">Against products at the same stage. Lower is healthier.</p>
          </div>
          <span class="badge ${bm.you <= bm.peerMedian ? 'good' : 'high'}">
            ${bm.you <= bm.peerMedian ? 'Better than median' : 'Worse than median'}
          </span>
        </div>
        <div class="bench">
          <span class="bench-mark ghost" style="left:${pos(bm.topQuartile)}%" data-label="Top quartile ${bm.topQuartile}"></span>
          <span class="bench-mark ghost" style="left:${pos(bm.peerMedian)}%" data-label="Peer median ${bm.peerMedian}"></span>
          <span class="bench-mark" style="left:${pos(bm.you)}%" data-label="You ${bm.you}"></span>
        </div>
        <div class="q-axis" style="margin-top:34px">
          <span>0 · healthy</span><span>50</span><span>100 · critical</span>
        </div>
      </div>`;
  };

  /* ---------- dimensions ---------- */
  const dimensions = (rep) => `
    <div class="card">
      <div class="card-head">
        <div>
          <h3>Where the debt sits</h3>
          <p class="sub">Eight weighted dimensions. The weight is how much each moves the index.</p>
        </div>
      </div>
      <div class="card-body">
        <div class="meters">
          ${rep.dimensions.map((d) => `
            <div class="meter-row" data-dim="${d.key}" tabindex="0" role="button"
                 aria-label="Filter findings by ${esc(d.name)}">
              <div class="meter-top">
                <span class="meter-name">${esc(d.name)} <span class="w">${Math.round(d.weight * 100)}%</span></span>
                <span class="meter-score">${d.score} <span class="muted" style="font-weight:500">
                  · ${MN.plural(d.findings, 'finding')}</span></span>
              </div>
              <div class="meter-track">
                <div class="meter-fill ${d.band.key}" data-v="${d.score}"></div>
              </div>
              <p class="meter-foot">${esc(d.blurb)}</p>
            </div>`).join('')}
        </div>
      </div>
    </div>`;

  /* ---------- impact / effort quadrant ---------- */
  const quadrant = (rep) => {
    const maxEffort = Math.max(...rep.findings.map((f) => f.effort), 1);
    return `
      <div class="card">
        <div class="card-head">
          <div>
            <h3>Impact against effort</h3>
            <p class="sub">Top-left is where to start. Hover a dot for the finding.</p>
          </div>
        </div>
        <div class="card-body">
          <div style="display:flex;gap:10px">
            <div class="q-axis-y">Business impact →</div>
            <div class="grow">
              <div class="quadrant">
                <span class="q-label q-tl">Quick wins</span>
                <span class="q-label q-tr">Major projects</span>
                <span class="q-label q-bl">Fill-ins</span>
                <span class="q-label q-br">Reconsider</span>
                ${rep.findings.map((f) => `
                  <button class="q-dot ${f.severity}" data-finding="${f.id}"
                    style="left:${MN.clamp((f.effort / maxEffort) * 92 + 4, 4, 96)}%;bottom:${MN.clamp(f.impact * 0.9 + 4, 4, 94)}%"
                    title="${esc(f.id)} · ${esc(f.title)} — impact ${f.impact}, ${f.effort}d"
                    aria-label="${esc(f.title)}"></button>`).join('')}
              </div>
              <div class="q-axis"><span>Low effort</span><span>Effort →</span><span>${maxEffort}d</span></div>
            </div>
          </div>
        </div>
      </div>`;
  };

  /* ---------- findings ---------- */
  const findingCard = (f) => `
    <div class="finding" data-id="${f.id}" data-sev="${f.severity}" data-dim="${f.dimension}">
      <button class="finding-head" aria-expanded="false">
        <span class="finding-sev ${f.severity}"></span>
        <span class="grow">
          <span class="finding-title">${esc(f.title)}</span>
          <span class="finding-meta">
            <span class="mono">${esc(f.id)}</span>
            <span>${esc(f.dimensionName)}</span>
            <span>Impact ${f.impact}/100</span>
            <span>${f.effort} person-days</span>
            <span>${esc(f.owner)}</span>
          </span>
        </span>
        ${sevBadge(f.severity)}
        <span class="finding-caret">›</span>
      </button>
      <div class="finding-body" hidden>
        <p style="margin-bottom:18px;max-width:74ch">${esc(f.why)}</p>
        <div class="finding-grid">
          <div>
            <h5>Evidence</h5>
            <ul class="evidence">
              ${f.evidence.map((e) => `
                <li><span class="k">${esc(e.label)}</span>: ${esc(e.value)}${e.measured ? '' : ' <span class="muted">(observed)</span>'}</li>
              `).join('')}
            </ul>
            <p class="tiny muted" style="margin-top:9px">
              Confidence ${f.confidence}%. Entries marked <em>observed</em> come from the scan;
              the rest from the context you declared.
            </p>
          </div>
          <div>
            <h5>Remediation</h5>
            <ul class="fix-list">${f.fixes.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
          </div>
        </div>
      </div>
    </div>`;

  const findings = (rep) => {
    const counts = ['critical', 'high', 'medium', 'low']
      .map((s) => [s, rep.findings.filter((f) => f.severity === s).length])
      .filter(([, n]) => n);

    return `
      <div class="section-head" id="findings">
        <div>
          <h2>Findings</h2>
          <p class="small muted" style="margin:2px 0 0">
            ${MN.plural(rep.findings.length, 'finding')} ranked by impact, then by how cheap they are to fix.
          </p>
        </div>
        <div class="row-wrap">
          <button class="btn btn-ghost btn-sm" id="expandAll">Expand all</button>
        </div>
      </div>

      <div class="filters" id="findingFilters">
        <span class="tiny muted" style="font-weight:700;letter-spacing:.08em;text-transform:uppercase">Severity</span>
        <button class="filter-btn" data-filter="all" aria-pressed="true">All ${rep.findings.length}</button>
        ${counts.map(([s, n]) => `<button class="filter-btn" data-filter="${s}" aria-pressed="false">${MN.SEVERITY[s].label} ${n}</button>`).join('')}
        <span style="flex:1"></span>
        <button class="filter-btn" data-filter="quick" aria-pressed="false">⚡ Quick wins ${rep.quickWins.length}</button>
        <button class="btn btn-quiet btn-sm hidden" id="clearDim">Clear dimension filter ✕</button>
      </div>

      <div id="findingList">${rep.findings.map(findingCard).join('')}</div>`;
  };

  /* ---------- strategy ---------- */
  const strategy = (rep) => `
    <div class="section-head" id="strategy">
      <div>
        <h2>Refactoring strategy</h2>
        <p class="small muted" style="margin:2px 0 0">
          Sequenced so each wave frees the capacity that funds the next.
          A squad of ${rep.roadmap[0] ? rep.roadmap[0].squad : 2} against a
          ${MN.plural(rep.economics.teamSize, 'person')} team.
        </p>
      </div>
      <span class="badge good">Index ${rep.index} → ${rep.projectedIndex} projected</span>
    </div>

    <div class="card card-pad">
      ${rep.roadmap.map((w, i) => `
        <div class="wave">
          <span class="wave-dot">${i + 1}</span>
          <div class="wave-head">
            <h4>${esc(w.name)}</h4>
            <span class="badge">${w.weeks} ${w.weeks === 1 ? 'week' : 'weeks'}</span>
            <span class="badge">${w.days} person-days</span>
            <span class="badge good">−${w.reduction} index</span>
          </div>
          <p class="wave-goal">${esc(w.goal)}</p>
          <div class="wave-items">
            ${w.items.map((f) => `
              <div class="wave-item">
                <span class="finding-sev ${f.severity}" style="height:20px;align-self:center"></span>
                <span class="mono tiny muted">${esc(f.id)}</span>
                <span class="wi-title">${esc(f.title)}</span>
                <span class="wi-meta">
                  <span>${f.effort}d</span>
                  <span class="badge ${f.severity}">${MN.SEVERITY[f.severity].label}</span>
                </span>
              </div>`).join('')}
          </div>
          <p class="small" style="margin-top:12px">
            <b class="strong">Outcome.</b> ${esc(w.outcome)}
            Debt index falls to <b class="strong">${w.indexAfter}</b>.
          </p>
        </div>`).join('')}
    </div>`;

  /* ---------- economics detail ---------- */
  const economics = (rep) => {
    const e = rep.economics;
    return `
      <div class="section-head" id="economics"><h2>The economics</h2></div>
      <div class="grid g-side">
        <div class="card">
          <div class="card-head"><h3>How the cost is derived</h3></div>
          <div class="table-wrap">
            <table class="tbl">
              <thead><tr><th>Measure</th><th>Value</th><th>How it is calculated</th></tr></thead>
              <tbody>
                <tr>
                  <td><span class="t-main">Principal</span></td>
                  <td class="num">${e.principalDays}d · ${fmt.money(e.principalCost)}</td>
                  <td>Sum of remediation effort across all ${rep.findings.length} findings, at ${fmt.money(e.rate)}/day.</td>
                </tr>
                <tr>
                  <td><span class="t-main">Velocity drag</span></td>
                  <td class="num">${e.velocityDrag}%</td>
                  <td>Share of delivery capacity spent working around the debt. Compounds non-linearly with the index.</td>
                </tr>
                <tr>
                  <td><span class="t-main">Interest per sprint</span></td>
                  <td class="num">${fmt.money(e.interestPerSprint)}</td>
                  <td>${e.velocityDrag}% of ${e.sprintDays} person-days per two-week sprint, at ${fmt.money(e.rate)}/day.</td>
                </tr>
                <tr>
                  <td><span class="t-main">Annualised interest</span></td>
                  <td class="num">${fmt.money(e.annualInterest)}</td>
                  <td>26 sprints of carrying the debt unchanged.</td>
                </tr>
                <tr>
                  <td><span class="t-main">Rework rate</span></td>
                  <td class="num">${e.reworkRate}%</td>
                  <td>Proportion of shipped work that gets revisited because the foundation moved.</td>
                </tr>
                <tr>
                  <td><span class="t-main">Payback</span></td>
                  <td class="num">${e.paybackSprints} sprints</td>
                  <td>Principal divided by the interest each sprint stops costing once it is paid.</td>
                </tr>
                <tr>
                  <td><span class="t-main">Year-one ROI</span></td>
                  <td class="num">${e.yearOneRoi}%</td>
                  <td>Annual interest avoided against the one-off principal.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="stack-lg">
          <div class="card card-quiet card-pad">
            <p class="eyebrow">Assumptions</p>
            <ul class="fix-list small">
              <li>Two-week sprints, ${MN.plural(e.teamSize, 'person')} on the product.</li>
              <li>${fmt.money(e.rate)} fully-loaded blended day rate.</li>
              <li>Remediation runs alongside feature work, not instead of it.</li>
              <li>Interest is capacity lost, not revenue lost — the revenue case sits on top of this.</li>
            </ul>
          </div>
          <div class="note warn">
            <span class="note-ico">!</span>
            <div>
              <b>Read the ROI carefully.</b> A high return here reflects a large team losing a
              steady share of its capacity. It is an argument for sequencing the work, not for
              stopping feature delivery to do all of it at once.
            </div>
          </div>
        </div>
      </div>`;
  };

  /* ---------- provenance ---------- */
  const provenance = (rep) => `
    <div class="card card-sunk card-pad no-print" style="margin-top:26px">
      <div class="row-between" style="align-items:flex-start;gap:20px">
        <div style="max-width:72ch">
          <p class="eyebrow">How this report was produced</p>
          <p class="small" style="margin:0">
            The model scored eight weighted dimensions from the context you declared and
            ${MN.plural(Object.keys(rep.observed).length, 'signal')} from the
            ${esc(rep.kind === 'url' ? 'crawl' : rep.kind === 'video' ? 'video pass' : 'Figma read')}.
            In this prototype those scan signals are synthesised deterministically from the source —
            report <span class="mono">${esc(rep.id)}</span> will reproduce exactly for
            <span class="mono">${esc(rep.source)}</span>. Findings mark which numbers are declared
            and which are observed.
          </p>
        </div>
        <button class="btn btn-ghost btn-sm" id="rawBtn">View raw signals</button>
      </div>
    </div>`;

  /* -------------------------------------------------------
     Mount + interactions
     ------------------------------------------------------- */
  MN.renderReport = (host, rep) => {
    host.innerHTML = `
      ${summary(rep)}
      ${tiles(rep)}
      ${benchmark(rep)}
      <div class="grid g-side" style="margin-top:18px">${dimensions(rep)}${quadrant(rep)}</div>
      ${findings(rep)}
      ${strategy(rep)}
      ${economics(rep)}
      ${provenance(rep)}`;

    MN.paintMeters(host);
    MN.bindAccordions(host);
    const num = host.querySelector('#ddiNum');
    if (num) MN.countTo(num, rep.index, { duration: 1100, decimals: 1 });

    /* severity + quick-win filters */
    let sevFilter = 'all';
    let dimFilter = null;

    const apply = () => {
      const quickIds = new Set(rep.quickWins.map((f) => f.id));
      host.querySelectorAll('.finding').forEach((el) => {
        const okSev = sevFilter === 'all' ? true
          : sevFilter === 'quick' ? quickIds.has(el.dataset.id)
          : el.dataset.sev === sevFilter;
        const okDim = !dimFilter || el.dataset.dim === dimFilter;
        el.classList.toggle('hidden', !(okSev && okDim));
      });
      const clear = host.querySelector('#clearDim');
      if (clear) clear.classList.toggle('hidden', !dimFilter);
    };

    host.querySelectorAll('#findingFilters .filter-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        sevFilter = btn.dataset.filter;
        host.querySelectorAll('#findingFilters .filter-btn').forEach((b) => {
          b.setAttribute('aria-pressed', String(b === btn));
        });
        apply();
      });
    });

    const setDim = (key) => {
      dimFilter = dimFilter === key ? null : key;
      apply();
      if (dimFilter) {
        host.querySelector('#findings').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    };

    host.querySelectorAll('.meter-row').forEach((row) => {
      row.addEventListener('click', () => setDim(row.dataset.dim));
      row.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setDim(row.dataset.dim); }
      });
    });

    const clearBtn = host.querySelector('#clearDim');
    if (clearBtn) clearBtn.addEventListener('click', () => { dimFilter = null; apply(); });

    /* quadrant dot → open that finding */
    host.querySelectorAll('.q-dot').forEach((dot) => {
      dot.addEventListener('click', () => {
        const el = host.querySelector(`.finding[data-id="${dot.dataset.finding}"]`);
        if (!el) return;
        sevFilter = 'all'; dimFilter = null;
        host.querySelectorAll('#findingFilters .filter-btn').forEach((b) => {
          b.setAttribute('aria-pressed', String(b.dataset.filter === 'all'));
        });
        apply();
        if (!el.classList.contains('open')) el.querySelector('.finding-head').click();
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    });

    /* expand all */
    const expandBtn = host.querySelector('#expandAll');
    if (expandBtn) {
      expandBtn.addEventListener('click', () => {
        const anyClosed = [...host.querySelectorAll('.finding:not(.hidden)')].some((f) => !f.classList.contains('open'));
        host.querySelectorAll('.finding:not(.hidden)').forEach((f) => {
          if (f.classList.contains('open') !== anyClosed) return;
          f.querySelector('.finding-head').click();
        });
        expandBtn.textContent = anyClosed ? 'Collapse all' : 'Expand all';
      });
    }

    /* raw signals */
    const rawBtn = host.querySelector('#rawBtn');
    if (rawBtn) {
      rawBtn.addEventListener('click', () => {
        const rows = Object.entries(rep.observed)
          .map(([k, v]) => `<tr><td class="mono">${esc(k)}</td><td class="num">${esc(v)}</td></tr>`).join('');
        MN.modal({
          title: 'Raw scan signals',
          sub: `${rep.id} · seeded from ${rep.source}`,
          body: `<div class="table-wrap"><table class="tbl">
            <thead><tr><th>Signal</th><th>Value</th></tr></thead><tbody>${rows}</tbody></table></div>
            <p class="tiny muted" style="margin-top:14px">
              These are the values a real crawler, vision pass or Figma read would return.
              Here they are synthesised deterministically from the source string and your context.
            </p>`
        });
      });
    }
  };
})();

      nav: ['Dashboards', 'Explore', 'Sources', 'Alerts', 'Settings'],
