(() => {
  'use strict';
  const MN = window.MN;
  const TPL = {"overview":{"crumbs":"<span class=\"now\">Workspace</span>","actions":"<button class=\"btn btn-quiet\" id=\"themeBtn\" aria-label=\"Toggle theme\"></button>\n          <button class=\"btn btn-primary btn-sm\" id=\"demoBtn\">Load <span class=\"lbl\">demo workspace</span></button>\n        </div>","body":"<div class=\"page-head\">\n        <p class=\"eyebrow\" id=\"wsEyebrow\">MN Studio · Studio plan</p>\n        <h1 id=\"wsTitle\">Good to see you.</h1>\n        <p class=\"lede\" id=\"wsLede\">\n          Three ways in: score the debt in something that already exists, audit a Figma file\n          mid-flight, or take a product from first interview to shipped component. The agents run\n          through all of it.\n        </p>\n      </div>\n\n      <div id=\"kpis\"></div>\n\n      <div class=\"section-head\"><h2>Journeys</h2></div>\n      <div class=\"grid g3\" id=\"journeyCards\"></div>\n\n      <div class=\"grid g-side\" style=\"margin-top:34px\">\n        <div>\n          <div class=\"section-head\" style=\"margin-top:0\"><h2>Recent activity</h2></div>\n          <div id=\"activity\"></div>\n        </div>\n        <aside class=\"stack-lg\">\n          <div class=\"section-head\" style=\"margin-top:0\"><h3>Connections</h3></div>\n          <div id=\"connSummary\"></div>\n          <div class=\"card card-quiet card-pad\">\n            <p class=\"eyebrow\">This is a working prototype</p>\n            <p class=\"small\" style=\"margin:0 0 12px\">\n              Every score, plan and agent run is computed in your browser by a real model — no\n              backend, no API keys. Crawl and file-read signals are simulated but deterministic:\n              the same input always returns the same report.\n            </p>\n            <button class=\"btn btn-ghost btn-sm btn-full\" id=\"resetBtn\">Reset the workspace</button>\n          </div>\n        </aside>\n      </div>","title":"Workspace"},"debt":{"crumbs":"<a href=\"index.html\">Workspace</a>\n          <span class=\"sep\">/</span>\n          <span class=\"now\">Design debt</span>","actions":"<button class=\"btn btn-quiet\" id=\"themeBtn\" aria-label=\"Toggle theme\"></button>\n          <button class=\"btn btn-ghost btn-sm hidden\" id=\"exportBtn\">Export</button>\n          <button class=\"btn btn-ghost btn-sm hidden\" id=\"restartBtn\">New <span class=\"lbl\">analysis</span></button>\n          <button class=\"btn btn-primary btn-sm hidden\" id=\"ticketsBtn\">\n            <span class=\"lbl\">Send to</span> pipeline →\n          </button>\n        </div>","body":"<!-- ============ INTAKE ============ -->\n      <section id=\"intake\">\n        <div class=\"page-head\">\n          <p class=\"eyebrow\">Journey one</p>\n          <h1>What does your product owe?</h1>\n          <p class=\"lede\">\n            Point us at something real — a live URL or a demo video — tell us how the team is\n            shaped, and we return a scored debt ledger, what it costs you every sprint, and the\n            order to pay it down in.\n          </p>\n        </div>\n\n        <div class=\"grid g-side\">\n          <div class=\"stack-lg\">\n\n            <!-- source -->\n            <div class=\"card\">\n              <div class=\"card-head\">\n                <div>\n                  <h3>1 · The source</h3>\n                  <p class=\"sub\">Live product gives us the most signal. A demo video works when the product is behind a login.</p>\n                </div>\n              </div>\n              <div class=\"card-body\">\n                <div class=\"tabs\" data-tabs role=\"tablist\" aria-label=\"Source type\">\n                  <button class=\"tab\" role=\"tab\" id=\"tab-url\" aria-controls=\"pane-url\" aria-selected=\"true\">Live link</button>\n                  <button class=\"tab\" role=\"tab\" id=\"tab-video\" aria-controls=\"pane-video\" aria-selected=\"false\">Demo video</button>\n                </div>\n\n                <div class=\"panel\" id=\"pane-url\" role=\"tabpanel\" aria-labelledby=\"tab-url\">\n                  <label class=\"field\">\n                    <span class=\"field-label\">Product URL</span>\n                    <input class=\"input\" type=\"url\" id=\"urlInput\" placeholder=\"https://app.yourproduct.com\"\n                           autocomplete=\"url\" spellcheck=\"false\">\n                    <p class=\"hint\">We crawl reachable routes, capture rendered styles, and replay the flows we can reach without credentials.</p>\n                  </label>\n                  <div class=\"row-wrap\">\n                    <span class=\"tiny muted\">Try:</span>\n                    <button class=\"chip\" type=\"button\" data-demo-url=\"https://app.northwind.io\">app.northwind.io</button>\n                    <button class=\"chip\" type=\"button\" data-demo-url=\"https://kaido.health\">kaido.health</button>\n                    <button class=\"chip\" type=\"button\" data-demo-url=\"https://loopfinance.app\">loopfinance.app</button>\n                  </div>\n                </div>\n\n                <div class=\"panel\" id=\"pane-video\" role=\"tabpanel\" aria-labelledby=\"tab-video\" hidden>\n                  <div class=\"dropzone\" id=\"dropzone\" tabindex=\"0\" role=\"button\"\n                       aria-label=\"Upload a demo video\">\n                    <div class=\"dropzone-ico\">▶</div>\n                    <h4>Drop a demo walkthrough</h4>\n                    <p>MP4, MOV or WebM up to 500&nbsp;MB — or click to browse</p>\n                  </div>\n                  <input type=\"file\" id=\"fileInput\" accept=\"video/*\" class=\"sr-only\">\n                  <div id=\"filePicked\" class=\"hidden\" style=\"margin-top:14px\"></div>\n                  <p class=\"hint\" style=\"margin-top:12px\">\n                    Frames are sampled at scene boundaries to reconstruct screens and the flow between them.\n                    Video analysis carries lower confidence than a live crawl — we surface that on the report.\n                  </p>\n                </div>\n              </div>\n            </div>\n\n            <!-- context -->\n            <div class=\"card\">\n              <div class=\"card-head\">\n                <div>\n                  <h3>2 · The context</h3>\n                  <p class=\"sub\">These answers drive the model directly — they are not cosmetic.</p>\n                </div>\n              </div>\n              <div class=\"card-body stack-lg\">\n\n                <div class=\"field-row\">\n                  <label class=\"field\">\n                    <span class=\"field-label\">Funding / maturity stage</span>\n                    <select class=\"select\" id=\"ctxStage\">\n                      <option value=\"pre-seed\">Pre-seed — finding the shape</option>\n                      <option value=\"seed\" selected>Seed — first real users</option>\n                      <option value=\"series-a\">Series A — scaling what works</option>\n                      <option value=\"growth\">Growth — multiple squads</option>\n                      <option value=\"scale\">Scale — platform teams</option>\n                    </select>\n                  </label>\n                  <label class=\"field\">\n                    <span class=\"field-label\">Release cadence</span>\n                    <select class=\"select\" id=\"ctxCadence\">\n                      <option value=\"monthly\">Monthly</option>\n                      <option value=\"biweekly\" selected>Every two weeks</option>\n                      <option value=\"weekly\">Weekly</option>\n                      <option value=\"daily\">Continuous</option>\n                    </select>\n                  </label>\n                </div>\n\n                <div class=\"field slider-field\">\n                  <div class=\"slider-top\">\n                    <span class=\"field-label\" style=\"margin:0\">Distinct screens or views</span>\n                    <span class=\"slider-val\" id=\"surfacesVal\">22</span>\n                  </div>\n                  <input type=\"range\" id=\"ctxSurfaces\" min=\"3\" max=\"160\" value=\"22\" step=\"1\">\n                  <p class=\"hint\">Surface count is the main multiplier on inconsistency — every screen is another place a decision gets re-made.</p>\n                </div>\n\n                <div class=\"field-row\">\n                  <label class=\"field\">\n                    <span class=\"field-label\">Designers on the product</span>\n                    <input class=\"input\" type=\"number\" id=\"ctxDesigners\" min=\"0\" max=\"60\" value=\"1\">\n                  </label>\n                  <label class=\"field\">\n                    <span class=\"field-label\">Engineers on the product</span>\n                    <input class=\"input\" type=\"number\" id=\"ctxEngineers\" min=\"1\" max=\"400\" value=\"6\">\n                  </label>\n                </div>\n\n                <div class=\"field\">\n                  <span class=\"field-label\">Design system maturity</span>\n                  <div class=\"choices c3\">\n                    <label class=\"choice\">\n                      <input type=\"radio\" name=\"system\" value=\"none\">\n                      <b>None</b><span>Components are built per feature</span>\n                    </label>\n                    <label class=\"choice\">\n                      <input type=\"radio\" name=\"system\" value=\"partial\" checked>\n                      <b>Partial</b><span>A library exists, coverage is patchy</span>\n                    </label>\n                    <label class=\"choice\">\n                      <input type=\"radio\" name=\"system\" value=\"mature\">\n                      <b>Mature</b><span>Versioned, owned, widely adopted</span>\n                    </label>\n                  </div>\n                </div>\n\n                <div class=\"field\">\n                  <span class=\"field-label\">Accessibility target you hold yourselves to</span>\n                  <div class=\"choices c3\">\n                    <label class=\"choice\">\n                      <input type=\"radio\" name=\"a11y\" value=\"none\" checked>\n                      <b>Nothing formal</b><span>Handled case by case</span>\n                    </label>\n                    <label class=\"choice\">\n                      <input type=\"radio\" name=\"a11y\" value=\"aa\">\n                      <b>WCAG 2.2 AA</b><span>Checked before release</span>\n                    </label>\n                    <label class=\"choice\">\n                      <input type=\"radio\" name=\"a11y\" value=\"aaa\">\n                      <b>AA plus audits</b><span>Third-party tested</span>\n                    </label>\n                  </div>\n                </div>\n\n                <div class=\"field\">\n                  <span class=\"field-label\">Platforms shipped</span>\n                  <div class=\"choices c3\">\n                    <label class=\"choice\">\n                      <input type=\"checkbox\" name=\"platform\" value=\"web\" checked>\n                      <b>Web</b><span>Responsive app or site</span>\n                    </label>\n                    <label class=\"choice\">\n                      <input type=\"checkbox\" name=\"platform\" value=\"ios\">\n                      <b>iOS</b><span>Native or hybrid</span>\n                    </label>\n                    <label class=\"choice\">\n                      <input type=\"checkbox\" name=\"platform\" value=\"android\">\n                      <b>Android</b><span>Native or hybrid</span>\n                    </label>\n                  </div>\n                </div>\n\n                <div class=\"field-row\">\n                  <label class=\"field\">\n                    <span class=\"field-label\">Years in production</span>\n                    <input class=\"input\" type=\"number\" id=\"ctxAge\" min=\"0\" max=\"30\" step=\"0.5\" value=\"2\">\n                  </label>\n                  <label class=\"field\">\n                    <span class=\"field-label\">Blended day rate (USD)</span>\n                    <input class=\"input\" type=\"number\" id=\"ctxRate\" min=\"100\" max=\"5000\" step=\"10\" value=\"620\">\n                    <p class=\"hint\">Used to price the debt. Fully-loaded design + engineering cost.</p>\n                  </label>\n                </div>\n\n                <div class=\"row-wrap\" style=\"gap:22px\">\n                  <label class=\"toggle\">\n                    <input type=\"checkbox\" id=\"ctxTokens\">\n                    <span class=\"toggle-track\"></span>\n                    <span>Design tokens exist</span>\n                  </label>\n                  <label class=\"toggle\">\n                    <input type=\"checkbox\" id=\"ctxStorybook\">\n                    <span class=\"toggle-track\"></span>\n                    <span>Storybook or equivalent is published</span>\n                  </label>\n                </div>\n\n                <label class=\"field\" style=\"margin:0\">\n                  <span class=\"field-label\">Anything you already know is broken <span class=\"muted\">(optional)</span></span>\n                  <textarea class=\"textarea\" id=\"ctxNotes\" placeholder=\"e.g. the onboarding flow drops 40% at the plan-picker, and nobody has touched the mobile breakpoints in a year\"></textarea>\n                </label>\n              </div>\n              <div class=\"card-foot row-between\">\n                <p class=\"tiny muted\" style=\"margin:0\">Analysis takes about ten seconds.</p>\n                <button class=\"btn btn-primary\" id=\"runBtn\">Calculate design debt →</button>\n              </div>\n            </div>\n          </div>\n\n          <!-- aside -->\n          <aside class=\"stack-lg\">\n            <div class=\"card card-quiet card-pad\">\n              <p class=\"eyebrow\">What you get back</p>\n              <ul class=\"fix-list\">\n                <li><b class=\"strong\">A Design Debt Index</b> — one 0–100 number, weighted across eight dimensions, benchmarked against your stage.</li>\n                <li><b class=\"strong\">A findings ledger</b> — every issue with evidence, impact, effort, owner and a specific remediation.</li>\n                <li><b class=\"strong\">The economics</b> — principal, interest per sprint, capacity lost, and payback period.</li>\n                <li><b class=\"strong\">A refactoring strategy</b> — three costed waves, sequenced so each one funds the next.</li>\n              </ul>\n            </div>\n\n            <div class=\"card card-pad\">\n              <p class=\"eyebrow\">The eight dimensions</p>\n              <div id=\"dimPreview\" class=\"stack\" style=\"margin-top:4px\"></div>\n            </div>\n\n            <div class=\"note\">\n              <span class=\"note-ico\">ℹ</span>\n              <div>\n                <b>Prototype behaviour.</b> Scores are computed by a real model from the context you\n                declare, combined with crawl signals that are simulated here and seeded from your\n                source — the same input always returns the same report. Every simulated figure is\n                labelled <em>observed</em> in the findings.\n              </div>\n            </div>\n          </aside>\n        </div>\n      </section>\n\n      <!-- ============ SCANNING ============ -->\n      <section id=\"scanning\" class=\"hidden\">\n        <div class=\"card\" style=\"max-width:660px;margin:40px auto\">\n          <div class=\"scan\">\n            <p class=\"eyebrow\" id=\"scanKind\">Analysing</p>\n            <h2 id=\"scanTarget\">—</h2>\n            <div class=\"scan-bar\"><div class=\"scan-fill\" id=\"scanFill\"></div></div>\n            <div class=\"scan-steps\" id=\"scanSteps\"></div>\n          </div>\n        </div>\n      </section>\n\n      <!-- ============ REPORT ============ -->\n      <section id=\"report\" class=\"hidden\"></section>","title":"Design debt"},"figma":{"crumbs":"<a href=\"index.html\">Workspace</a>\n          <span class=\"sep\">/</span>\n          <span class=\"now\">Figma audit</span>","actions":"<button class=\"btn btn-quiet\" id=\"themeBtn\" aria-label=\"Toggle theme\"></button>\n          <button class=\"btn btn-ghost btn-sm hidden\" id=\"newFile\">New file</button>\n          <button class=\"btn btn-primary btn-sm hidden\" id=\"handoffBtn\">\n            Continue <span class=\"lbl\">in the pipeline</span> →\n          </button>\n        </div>","body":"<!-- ============ CONNECT ============ -->\n      <section id=\"connect\">\n        <div class=\"page-head\">\n          <p class=\"eyebrow\">Journey three</p>\n          <h1>Already halfway into design?</h1>\n          <p class=\"lede\">\n            Connect the Figma file. We read its structure, audit the debt that only exists inside\n            design files, score it on the same index as a live product, and hand you a\n            tokenisation plan and a consolidation map — then you carry on from there.\n          </p>\n        </div>\n\n        <div class=\"grid g-side\">\n          <div class=\"stack-lg\">\n            <div class=\"card\">\n              <div class=\"card-head\">\n                <div>\n                  <h3>Connect a file</h3>\n                  <p class=\"sub\">Read-only access to the file, its styles, components and variables.</p>\n                </div>\n                <span class=\"badge\" id=\"connState\">Not connected</span>\n              </div>\n              <div class=\"card-body\">\n                <label class=\"field\">\n                  <span class=\"field-label\">Figma file URL</span>\n                  <div class=\"input-group\">\n                    <input class=\"input\" id=\"figUrl\" placeholder=\"https://www.figma.com/file/…\" spellcheck=\"false\">\n                    <button class=\"btn btn-primary\" id=\"readBtn\">Read file</button>\n                  </div>\n                  <p class=\"hint\">Nothing is written back to Figma. The audit is read-only.</p>\n                </label>\n\n                <p class=\"field-label\" style=\"margin-top:22px\">Or pick one of the example files</p>\n                <div id=\"sampleList\" class=\"stack\"></div>\n              </div>\n            </div>\n\n            <div class=\"card card-quiet\">\n              <div class=\"card-head\">\n                <div>\n                  <h4>Team context</h4>\n                  <p class=\"sub\">Only needed to price the debt — the rest is read from the file.</p>\n                </div>\n              </div>\n              <div class=\"card-body\">\n                <div class=\"field-row\">\n                  <label class=\"field\" style=\"margin:0\">\n                    <span class=\"field-label\">Designers</span>\n                    <input class=\"input\" type=\"number\" id=\"fDesigners\" min=\"0\" max=\"60\" value=\"2\">\n                  </label>\n                  <label class=\"field\" style=\"margin:0\">\n                    <span class=\"field-label\">Engineers</span>\n                    <input class=\"input\" type=\"number\" id=\"fEngineers\" min=\"1\" max=\"400\" value=\"8\">\n                  </label>\n                </div>\n                <div class=\"field-row\" style=\"margin-top:16px\">\n                  <label class=\"field\" style=\"margin:0\">\n                    <span class=\"field-label\">Stage</span>\n                    <select class=\"select\" id=\"fStage\">\n                      <option value=\"pre-seed\">Pre-seed</option>\n                      <option value=\"seed\">Seed</option>\n                      <option value=\"series-a\" selected>Series A</option>\n                      <option value=\"growth\">Growth</option>\n                      <option value=\"scale\">Scale</option>\n                    </select>\n                  </label>\n                  <label class=\"field\" style=\"margin:0\">\n                    <span class=\"field-label\">Blended day rate (USD)</span>\n                    <input class=\"input\" type=\"number\" id=\"fRate\" min=\"100\" max=\"5000\" step=\"10\" value=\"620\">\n                  </label>\n                </div>\n              </div>\n            </div>\n          </div>\n\n          <aside class=\"stack-lg\">\n            <div class=\"card card-pad\">\n              <p class=\"eyebrow\">What we read</p>\n              <ul class=\"fix-list small\">\n                <li>Pages, frames and the screens among them</li>\n                <li>Components, variants and instance counts</li>\n                <li>Detached instances and where they drifted</li>\n                <li>Local styles, variables and library adoption</li>\n                <li>Auto layout coverage and naming conventions</li>\n                <li>Orphan frames and abandoned explorations</li>\n              </ul>\n            </div>\n            <div class=\"note\">\n              <span class=\"note-ico\">ℹ</span>\n              <div>\n                <b>The file answers the questionnaire.</b> Surface count, design-system maturity and\n                token coverage are derived from the file itself, so the debt score needs almost\n                nothing from you.\n              </div>\n            </div>\n          </aside>\n        </div>\n      </section>\n\n      <!-- ============ SCANNING ============ -->\n      <section id=\"scanning\" class=\"hidden\">\n        <div class=\"card\" style=\"max-width:660px;margin:40px auto\">\n          <div class=\"scan\">\n            <p class=\"eyebrow\">Reading Figma file</p>\n            <h2 id=\"scanTarget\">—</h2>\n            <div class=\"scan-bar\"><div class=\"scan-fill\" id=\"scanFill\"></div></div>\n            <div class=\"scan-steps\" id=\"scanSteps\"></div>\n          </div>\n        </div>\n      </section>\n\n      <!-- ============ RESULT ============ -->\n      <section id=\"result\" class=\"hidden\"></section>","title":"Figma audit"},"build":{"crumbs":"<a href=\"index.html\">Workspace</a>\n          <span class=\"sep\">/</span>\n          <span class=\"now\">Product pipeline</span>","actions":"<button class=\"btn btn-quiet\" id=\"themeBtn\" aria-label=\"Toggle theme\"></button>\n          <button class=\"btn btn-ghost btn-sm\" id=\"resetPipeline\">Reset</button>\n        </div>","body":"<div class=\"page-head\">\n        <p class=\"eyebrow\">Journey two</p>\n        <h1>Research it, prove it, design it, ship it.</h1>\n        <p class=\"lede\">\n          One continuous line from the first interview to a component published in Storybook.\n          Each stage gates the next — you cannot design what research says nobody wants.\n        </p>\n      </div>\n\n      <nav class=\"stepper\" id=\"stepper\" aria-label=\"Pipeline stage\"></nav>\n\n      <!-- ============ RESEARCH ============ -->\n      <section class=\"stage\" id=\"stage-research\" style=\"margin-top:26px\">\n        <div class=\"grid g-side\">\n          <div class=\"stack-lg\">\n\n            <div class=\"card\">\n              <div class=\"card-head\">\n                <div>\n                  <h3>The brief</h3>\n                  <p class=\"sub\">What you think you are building, and for whom. Everything downstream is derived from this.</p>\n                </div>\n                <button class=\"btn btn-ghost btn-sm\" id=\"exampleBrief\">Use an example</button>\n              </div>\n              <div class=\"card-body\">\n                <div class=\"field-row\">\n                  <label class=\"field\">\n                    <span class=\"field-label\">Product name</span>\n                    <input class=\"input\" id=\"pName\" placeholder=\"Fernbank\">\n                  </label>\n                  <label class=\"field\">\n                    <span class=\"field-label\">Who it is for</span>\n                    <input class=\"input\" id=\"pAudience\" placeholder=\"Operations leads at 20–200 person agencies\">\n                  </label>\n                </div>\n                <label class=\"field\">\n                  <span class=\"field-label\">One line</span>\n                  <input class=\"input\" id=\"pOneLiner\" placeholder=\"Reconcile agency retainers without leaving the accounting tool\">\n                </label>\n                <label class=\"field\" style=\"margin:0\">\n                  <span class=\"field-label\">The problem, as you currently understand it</span>\n                  <textarea class=\"textarea\" id=\"pProblem\" placeholder=\"Describe the pain, who feels it, how often, and what they do about it today.\"></textarea>\n                </label>\n              </div>\n            </div>\n\n            <div class=\"card\">\n              <div class=\"card-head\">\n                <div>\n                  <h3>Research signals</h3>\n                  <p class=\"sub\">Every claim in the synthesis traces back to one of these.</p>\n                </div>\n                <button class=\"btn btn-solid btn-sm\" id=\"addSignal\">+ Add signal</button>\n              </div>\n              <div class=\"card-body\">\n                <div id=\"signalList\"></div>\n              </div>\n              <div class=\"card-foot row-between\">\n                <p class=\"small muted\" style=\"margin:0\" id=\"signalHint\">Add at least four signals to synthesise.</p>\n                <button class=\"btn btn-primary\" id=\"synthBtn\" disabled>Synthesise with agent →</button>\n              </div>\n            </div>\n\n            <div id=\"synthesisOut\"></div>\n          </div>\n\n          <aside class=\"stack-lg\">\n            <div class=\"card card-quiet card-pad\">\n              <p class=\"eyebrow\">Signal weighting</p>\n              <p class=\"small\">Not all evidence counts the same. Primary contact with the person who feels the pain outweighs desk research.</p>\n              <div id=\"weightTable\" class=\"stack\" style=\"margin-top:12px\"></div>\n            </div>\n            <div class=\"note\">\n              <span class=\"note-ico\">◆</span>\n              <div><b>Research Synthesist</b> clusters the signals, ranks pains by frequency × severity, and flags the gaps that would make the synthesis unsafe to act on.</div>\n            </div>\n          </aside>\n        </div>\n      </section>\n\n      <!-- ============ VIABILITY ============ -->\n      <section class=\"stage hidden\" id=\"stage-viability\" style=\"margin-top:26px\">\n        <div class=\"grid g-side\">\n          <div class=\"stack-lg\">\n            <div class=\"card\">\n              <div class=\"card-head\">\n                <div>\n                  <h3>The commercial picture</h3>\n                  <p class=\"sub\">Research tells us whether they want it. This tells us whether it is a business.</p>\n                </div>\n              </div>\n              <div class=\"card-body stack-lg\">\n                <div class=\"field-row\">\n                  <label class=\"field\">\n                    <span class=\"field-label\">Market shape</span>\n                    <select class=\"select\" id=\"vMarket\">\n                      <option value=\"niche\">Niche — a few thousand buyers</option>\n                      <option value=\"focused\" selected>Focused — a defined segment</option>\n                      <option value=\"broad\">Broad — horizontal need</option>\n                    </select>\n                  </label>\n                  <label class=\"field\">\n                    <span class=\"field-label\">Direct competitors</span>\n                    <input class=\"input\" type=\"number\" id=\"vCompetitors\" min=\"0\" max=\"40\" value=\"4\">\n                  </label>\n                </div>\n\n                <div class=\"field\">\n                  <span class=\"field-label\">Hardest evidence of willingness to pay</span>\n                  <div class=\"choices c2\">\n                    <label class=\"choice\"><input type=\"radio\" name=\"wtp\" value=\"none\" checked>\n                      <b>None yet</b><span>Nobody has been asked for money</span></label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"wtp\" value=\"signals\">\n                      <b>Stated intent</b><span>People said they would pay</span></label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"wtp\" value=\"loi\">\n                      <b>Letters of intent</b><span>Signed, not yet billed</span></label>\n                    <label class=\"choice\"><input type=\"radio\" name=\"wtp\" value=\"paying\">\n                      <b>Paying already</b><span>Pre-payments or a pilot invoice</span></label>\n                  </div>\n                </div>\n\n                <div class=\"field-row\">\n                  <label class=\"field\">\n                    <span class=\"field-label\">Build complexity</span>\n                    <select class=\"select\" id=\"vComplexity\">\n                      <option value=\"low\">Low — a focused app</option>\n                      <option value=\"medium\" selected>Medium — integrations and state</option>\n                      <option value=\"high\">High — infrastructure or compliance</option>\n                    </select>\n                  </label>\n                  <label class=\"field\">\n                    <span class=\"field-label\">Team fit for this problem</span>\n                    <select class=\"select\" id=\"vTeamFit\">\n                      <option value=\"weak\">Weak — new domain to us</option>\n                      <option value=\"ok\" selected>Adequate — adjacent experience</option>\n                      <option value=\"strong\">Strong — we have lived it</option>\n                    </select>\n                  </label>\n                </div>\n\n                <label class=\"field\">\n                  <span class=\"field-label\">Primary route to the buyer</span>\n                  <select class=\"select\" id=\"vChannel\">\n                    <option value=\"none\">Not established</option>\n                    <option value=\"organic\" selected>Organic — content and search</option>\n                    <option value=\"audience\">An audience we already own</option>\n                    <option value=\"partnerships\">Partnerships and integrations</option>\n                    <option value=\"outbound\">Outbound sales</option>\n                  </select>\n                </label>\n\n                <div class=\"row-wrap\" style=\"gap:22px\">\n                  <label class=\"toggle\">\n                    <input type=\"checkbox\" id=\"vWedge\">\n                    <span class=\"toggle-track\"></span>\n                    <span>We have a clear wedge we can be best at</span>\n                  </label>\n                  <label class=\"toggle\">\n                    <input type=\"checkbox\" id=\"vUnlock\">\n                    <span class=\"toggle-track\"></span>\n                    <span>Something changed recently that makes this possible now</span>\n                  </label>\n                </div>\n              </div>\n              <div class=\"card-foot row-between\">\n                <p class=\"small muted\" style=\"margin:0\">Scored against your research synthesis.</p>\n                <button class=\"btn btn-primary\" id=\"viabilityBtn\">Run viability assessment →</button>\n              </div>\n            </div>\n\n            <div id=\"viabilityOut\"></div>\n          </div>\n\n          <aside class=\"stack-lg\">\n            <div class=\"card card-quiet card-pad\">\n              <p class=\"eyebrow\">The six axes</p>\n              <div id=\"axisPreview\" class=\"stack\" style=\"margin-top:4px\"></div>\n            </div>\n            <div class=\"note warn\">\n              <span class=\"note-ico\">!</span>\n              <div><b>This is a real gate.</b> A no-go verdict blocks the design stage. You can override it, but the override is recorded on the project.</div>\n            </div>\n          </aside>\n        </div>\n      </section>\n\n      <!-- ============ DESIGN ============ -->\n      <section class=\"stage hidden\" id=\"stage-design\" style=\"margin-top:26px\">\n        <div id=\"designOut\"></div>\n      </section>\n\n      <!-- ============ BUILD ============ -->\n      <section class=\"stage hidden\" id=\"stage-build\" style=\"margin-top:26px\">\n        <div id=\"buildOut\"></div>\n      </section>\n\n      <!-- ============ SHIP ============ -->\n      <section class=\"stage hidden\" id=\"stage-ship\" style=\"margin-top:26px\">\n        <div id=\"shipOut\"></div>\n      </section>","title":"Product pipeline"},"agents":{"crumbs":"<a href=\"index.html\">Workspace</a>\n          <span class=\"sep\">/</span>\n          <span class=\"now\">Agents &amp; workflows</span>","actions":"<button class=\"btn btn-quiet\" id=\"themeBtn\" aria-label=\"Toggle theme\"></button>\n          <button class=\"btn btn-primary btn-sm\" id=\"newWorkflow\">+ New workflow</button>\n        </div>","body":"<div class=\"page-head\">\n        <p class=\"eyebrow\">Intelligence</p>\n        <h1>The agents, and what you wire them into.</h1>\n        <p class=\"lede\">\n          Twelve agents covering research, design debt and delivery. Compose them into workflows\n          with your own triggers, gates and outputs — the platform runs them so the work happens\n          whether or not anyone opens the tab.\n        </p>\n      </div>\n\n      <div class=\"tabs\" data-tabs role=\"tablist\" aria-label=\"Sections\">\n        <button class=\"tab\" role=\"tab\" id=\"t-flows\" aria-controls=\"p-flows\" aria-selected=\"true\">Workflows</button>\n        <button class=\"tab\" role=\"tab\" id=\"t-agents\" aria-controls=\"p-agents\" aria-selected=\"false\">Agent roster</button>\n        <button class=\"tab\" role=\"tab\" id=\"t-conn\" aria-controls=\"p-conn\" aria-selected=\"false\">Connections</button>\n        <button class=\"tab\" role=\"tab\" id=\"t-activity\" aria-controls=\"p-activity\" aria-selected=\"false\">Activity</button>\n      </div>\n\n      <div class=\"panel\" id=\"p-flows\" role=\"tabpanel\">\n        <div class=\"grid g-side-l\" id=\"flowLayout\">\n          <div id=\"flowList\"></div>\n          <div id=\"flowDetail\"></div>\n        </div>\n      </div>\n\n      <div class=\"panel\" id=\"p-agents\" role=\"tabpanel\" hidden>\n        <div id=\"agentRoster\"></div>\n      </div>\n\n      <div class=\"panel\" id=\"p-conn\" role=\"tabpanel\" hidden>\n        <div class=\"grid g-side\">\n          <div id=\"connList\"></div>\n          <aside>\n            <div class=\"note\">\n              <span class=\"note-ico\">ℹ</span>\n              <div>\n                <b>Prototype behaviour.</b> Connections are simulated — nothing leaves your browser\n                and no OAuth is performed. In a real deployment each of these is a scoped token\n                stored server-side, and the workflows above run against the live APIs.\n              </div>\n            </div>\n          </aside>\n        </div>\n      </div>\n\n      <div class=\"panel\" id=\"p-activity\" role=\"tabpanel\" hidden>\n        <div id=\"activityList\"></div>\n      </div>","title":"Agents & workflows"}};
  const IDS = Object.keys(TPL);

  const $ = (s) => document.querySelector(s);

  /* Override the multi-page navigator with hash routing. */
  MN.goto = (page, sub) => {
    window.location.hash = '#/' + page + (sub ? '/' + sub : '');
  };

  const parse = () => {
    const raw = String(location.hash || '').replace(/^#\/?/, '');
    const [page, sub] = raw.split('/');
    return { page: TPL[page] ? page : 'overview', sub: sub || '' };
  };

  let currentPage = null;

  const route = () => {
    const { page, sub } = parse();
    const t = TPL[page];
    MN.sub = sub;

    $('#side').dataset.page = page;
    $('#crumbHost').innerHTML = t.crumbs;
    $('#actionHost').innerHTML = t.actions;
    $('#canvas').innerHTML = t.body;
    document.title = t.title + ' — MN Studio Platform';

    MN.shell.mount();
    MN.bindTabs();
    MN.bindAccordions();

    try {
      MN.PAGES[page]();
    } catch (err) {
      console.error(err);
      $('#canvas').innerHTML =
        '<div class="empty"><h4>Something went wrong on this page</h4>' +
        '<p>' + MN.esc(err.message) + '</p>' +
        '<button class="btn btn-primary btn-sm" onclick="location.reload()">Reload</button></div>';
    }

    if (page !== currentPage) window.scrollTo({ top: 0, behavior: 'auto' });
    currentPage = page;
  };

  /* Links written for the multi-page app resolve to routes here. */
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[href]');
    if (!a) return;
    const m = (a.getAttribute('href') || '')
      .match(/^(?:\.\.?\/)?(index|debt|figma|build|agents)\.html(?:#(.+))?$/);
    if (!m) return;
    e.preventDefault();
    MN.goto(m[1] === 'index' ? 'overview' : m[1], m[2] || '');
    const side = $('#side');
    if (side) side.classList.remove('open');
    const scrim = document.querySelector('.scrim');
    if (scrim) scrim.remove();
  });

  window.addEventListener('hashchange', route);
  route();
})();

</script>
</body>
</html>
