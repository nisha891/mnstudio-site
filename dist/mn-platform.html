    },
    saas: {
      name: 'B2B SaaS product',
      keys: [],
      nav: ['Home', 'Work', 'Team', 'Reports', 'Settings'],
      objects: ['workspace', 'item', 'member', 'report'],
      flows: ['Sign up and reach first value', 'Invite the team', 'Complete the core task', 'Upgrade a plan'],
      screens: ['Workspace home', 'Item list', 'Item detail', 'Creation flow', 'Team and roles', 'Reporting', 'Billing and plans', 'Account settings'],
      components: ['WorkspaceSwitcher', 'ItemRow', 'RoleSelect', 'PlanCard', 'InviteDialog'],
      palette: ['#2c5a7a', '#c1662f', '#2f6b4f', '#6b3f6b'],
      risks: ['undifferentiated positioning', 'seat-based expansion', 'onboarding drop-off']
    }
  };

  const classify = (text) => {
    const t = String(text || '').toLowerCase();
    let best = 'saas', bestScore = 0;
    Object.entries(ARCHETYPES).forEach(([key, a]) => {
      const score = a.keys.reduce((s, k) => s + (t.includes(k) ? 1 : 0), 0);
      if (score > bestScore) { bestScore = score; best = key; }
    });
    return { key: best, ...ARCHETYPES[best], matched: bestScore };
  };

  /* -------------------------------------------------------
     Research signals
     ------------------------------------------------------- */
  const SIGNAL_TYPES = {
    interview: { label: 'User interview', weight: 3.0, icon: '🎙' },
    survey: { label: 'Survey response set', weight: 2.0, icon: '📋' },
    support: { label: 'Support ticket pattern', weight: 2.2, icon: '🎫' },
    analytics: { label: 'Analytics observation', weight: 2.4, icon: '📈' },
    competitor: { label: 'Competitor teardown', weight: 1.6, icon: '🔍' },
    sales: { label: 'Sales call note', weight: 2.6, icon: '💬' },
    desk: { label: 'Desk research', weight: 1.2, icon: '📚' }
  };

  const THEME_SHAPES = [
    { title: 'The current workaround is a spreadsheet', tone: 'opportunity' },
    { title: 'Trust is the gate, not price', tone: 'risk' },
    { title: 'The pain is felt weekly, not daily', tone: 'risk' },
    { title: 'One role carries the cost for everyone else', tone: 'opportunity' },
    { title: 'Setup effort is the reason people abandon', tone: 'risk' },
    { title: 'The decision is made by someone who never uses it', tone: 'risk' },
    { title: 'People pay to avoid the reporting, not the work', tone: 'opportunity' },
    { title: 'Existing tools solve it for larger teams only', tone: 'opportunity' },
    { title: 'The trigger event is predictable and recurring', tone: 'opportunity' },
    { title: 'Switching cost is mostly emotional, not technical', tone: 'opportunity' }
  ];

  const synthesise = (product, signals) => {
    const arch = classify(`${product.name} ${product.oneLiner} ${product.problem} ${product.audience}`);
    const r = rng(hash(product.name + product.problem + signals.length));

    const weighted = signals.reduce((s, sig) => s + (SIGNAL_TYPES[sig.type] || { weight: 1 }).weight, 0);
    const coverage = clamp((weighted / 26) * 100, 8, 96);

    const themeCount = clamp(Math.round(2 + signals.length / 2.4), 3, 6);
    const themes = shuffle(r, THEME_SHAPES).slice(0, themeCount).map((t, i) => {
      const backing = Math.max(2, Math.round(signals.length * (0.55 - i * 0.07) + r() * 2));
      return {
        id: 'T' + (i + 1),
        title: t.title,
        tone: t.tone,
        signals: Math.min(backing, signals.length),
        confidence: round(clamp(46 + (backing / Math.max(1, signals.length)) * 48 + r() * 10, 30, 95)),
        quote: pick(r, [
          `"We tried three tools and went back to the sheet because at least everyone can see it."`,
          `"I do this every Monday and I dread it every Monday."`,
          `"Nobody signs off on a new tool unless it survives the security review."`,
          `"It's not that it's hard, it's that it's on me and I never have the time."`,
          `"We'd pay for it if it meant I never build that report again."`,
          `"The trial ended before I'd got our data in."`
        ])
      };
    });

    const jtbd = arch.flows.slice(0, 3).map((f, i) => ({
      id: 'J' + (i + 1),
      statement: `When I need to ${f.toLowerCase()}, I want to do it without leaving my current context, so I can keep moving instead of context-switching.`,
      frequency: pick(r, ['Daily', 'Weekly', 'Every sprint', 'Monthly']),
      currentSolution: pick(r, ['Spreadsheet', 'A competing tool', 'Manual process', 'Internal script', 'Nothing — it goes undone'])
    }));

    const pains = shuffle(r, [
      { text: 'Setup takes longer than the value it returns in week one', sev: 4 },
      { text: 'The person who feels the pain cannot authorise the purchase', sev: 5 },
      { text: 'Data has to be re-entered from a system that already has it', sev: 4 },
      { text: 'There is no way to see whether it worked', sev: 3 },
      { text: 'The workflow breaks the moment a second person is involved', sev: 4 },
      { text: 'Errors are only discovered downstream, after they cost something', sev: 5 },
      { text: 'Nobody trusts the numbers enough to act on them', sev: 4 }
    ]).slice(0, 5).map((p, i) => ({
      ...p,
      id: 'P' + (i + 1),
      frequency: round(clamp(80 - i * 11 + r() * 14, 18, 96)),
      score: 0
    }));
    pains.forEach((p) => { p.score = round((p.frequency / 100) * p.sev * 20); });
    pains.sort((a, b) => b.score - a.score);

    const opportunities = themes.filter((t) => t.tone === 'opportunity').slice(0, 3).map((t, i) => ({
      id: 'O' + (i + 1),
      title: t.title.replace(/^The |^One |^People |^Existing /, ''),
      bet: pick(r, [
        'Remove the setup entirely by importing from what they already use.',
        'Make the output the thing they buy, not the workflow that produces it.',
        'Design for the second user from day one — the workflow is never solo.',
        'Win the security review before the trial, not after it.',
        'Trigger the product at the recurring event rather than waiting to be opened.'
      ]),
      linkedTheme: t.id
    }));

    return {
      archetype: arch.key,
      archetypeName: arch.name,
      coverage: round(coverage),
      signalCount: signals.length,
      weightedSignals: round(weighted, 1),
      themes, jtbd, pains, opportunities,
      gaps: coverage < 55 ? [
        'Too few primary interviews to separate a real pattern from a loud one',
        'No evidence yet from the person who authorises spend',
        'Nothing from users who chose a competitor instead'
      ].slice(0, coverage < 35 ? 3 : 2) : []
    };
  };

  /* -------------------------------------------------------
     Viability
     ------------------------------------------------------- */
  const VIABILITY_AXES = [
    { key: 'desirability', name: 'Desirability', weight: 0.24, blurb: 'Evidence that the pain is real, frequent and felt by a nameable person.' },
    { key: 'viability', name: 'Business viability', weight: 0.22, blurb: 'Willingness to pay, at a price that clears cost of acquisition.' },
    { key: 'feasibility', name: 'Feasibility', weight: 0.16, blurb: 'Whether this team can build and run it at acceptable cost.' },
    { key: 'differentiation', name: 'Differentiation', weight: 0.16, blurb: 'A reason to choose this over the incumbent and the spreadsheet.' },
    { key: 'distribution', name: 'Distribution', weight: 0.14, blurb: 'A repeatable route to the buyer that is not paid-only.' },
    { key: 'timing', name: 'Timing', weight: 0.08, blurb: 'Why this is buildable and buyable now rather than two years ago.' }
  ];

  const WTP = { none: 12, signals: 42, loi: 68, paying: 92 };
  const MARKET = { niche: 38, focused: 62, broad: 84 };
  const COMPLEXITY = { low: 84, medium: 58, high: 30 };
  const TEAMFIT = { weak: 32, ok: 60, strong: 88 };
  const CHANNEL = { none: 18, organic: 52, audience: 76, partnerships: 68, outbound: 58 };

  const assessViability = (product, synthesis, inputs) => {
    const r = rng(hash(product.name + JSON.stringify(inputs)));
    const jit = () => (r() - 0.5) * 7;

    const painStrength = synthesis.pains.length
      ? synthesis.pains.reduce((s, p) => s + p.score, 0) / synthesis.pains.length
      : 40;
    const competitors = clamp(Number(inputs.competitors) || 0, 0, 40);

    const raw = {
      desirability: painStrength * 0.62 + synthesis.coverage * 0.34 + jit(),
      viability: (WTP[inputs.wtp] ?? 12) * 0.66 + (MARKET[inputs.market] ?? 62) * 0.3 + jit(),
      feasibility: (COMPLEXITY[inputs.complexity] ?? 58) * 0.62 + (TEAMFIT[inputs.teamFit] ?? 60) * 0.36 + jit(),
      differentiation: clamp(92 - competitors * 6, 14, 92) * 0.55 + (inputs.wedge ? 38 : 12) + jit(),
      distribution: (CHANNEL[inputs.channel] ?? 18) * 0.82 + (inputs.wedge ? 10 : 0) + jit(),
      timing: 48 + (inputs.unlock ? 30 : 0) + (competitors > 6 ? -14 : 8) + jit()
    };

    const axes = VIABILITY_AXES.map((a) => ({
      ...a,
      score: round(clamp(raw[a.key], 4, 97), 1)
    }));

    const score = round(axes.reduce((s, a) => s + a.score * a.weight, 0), 1);
    const weakest = [...axes].sort((a, b) => a.score - b.score).slice(0, 2);

    let verdict, headline;
    if (score >= 68) {
      verdict = 'go';
      headline = 'Proceed to design. The evidence supports building this.';
    } else if (score >= 48) {
      verdict = 'pivot';
      headline = `Conditional. ${weakest[0].name.toLowerCase()} has to move before this is worth building.`;
    } else {
      verdict = 'no-go';
      headline = 'Do not build this yet. The evidence does not support it.';
    }

    const arch = ARCHETYPES[synthesis.archetype];
    const risks = [
      ...weakest.map((a) => ({
        axis: a.name,
        score: a.score,
        text: {
          desirability: 'The pain is not yet demonstrated to be frequent or severe enough that anyone changes behaviour over it.',
          viability: 'Nobody has committed money or a signature. Stated intent is not willingness to pay.',
          feasibility: 'The build is heavier than this team can carry alongside everything else it owns.',
          differentiation: 'A buyer comparing this to the incumbent has no clear reason to switch.',
          distribution: 'There is no repeatable way to reach the buyer that does not depend on paid acquisition.',
          timing: 'Nothing has changed recently that makes this newly possible or newly urgent.'
        }[a.key]
      })),
      ...arch.risks.slice(0, 1).map((t) => ({ axis: 'Domain', score: null, text: `Category risk: ${t}.` }))
    ];

    const unlocks = weakest.map((a) => ({
      axis: a.name,
      action: {
        desirability: 'Run 6 more interviews with the people who feel the pain weekly, and measure how they solve it today.',
        viability: 'Take 3 letters of intent or 3 pre-payments at the real price before writing production code.',
        feasibility: 'Cut the first release to the single flow that proves the value and buy the rest.',
        differentiation: 'Pick one wedge you can be unambiguously best at and drop the parity features from v1.',
        distribution: 'Prove one repeatable non-paid channel converts before scaling anything.',
        timing: 'Name the specific change — regulation, cost curve, behaviour — that makes now the moment.'
      }[a.key],
      lifts: round(clamp((70 - a.score) * a.weight * 1.3, 1, 18), 1)
    }));

    return {
      axes, score, verdict, headline, risks, unlocks,
      inputs,
      projectedScore: round(clamp(score + unlocks.reduce((s, u) => s + u.lifts, 0), 0, 97), 1)
    };
  };

  /* -------------------------------------------------------
     Design generation
     ------------------------------------------------------- */
  const BASE_COMPONENTS = [
    'Button', 'IconButton', 'TextField', 'Select', 'Checkbox', 'RadioGroup', 'Toggle',
    'Card', 'Modal', 'Drawer', 'Toast', 'Tooltip', 'Tabs', 'Badge', 'Avatar',
    'Table', 'Pagination', 'Breadcrumb', 'EmptyState', 'Skeleton', 'Banner'
  ];

  const generateDesign = (product, synthesis, viability) => {
    const arch = ARCHETYPES[synthesis.archetype];
    const r = rng(hash(product.name + synthesis.archetype + 'design'));

    const ia = {
      root: product.name || 'Product',
      primary: arch.nav.map((n, i) => ({
        name: n,
        children: i === 0 ? [] : shuffle(r, ['All', 'Assigned to me', 'Archived', 'Templates', 'Trash']).slice(0, 2)
      }))
    };

    const flows = arch.flows.map((f, i) => {
      const steps = 3 + Math.floor(r() * 3);
      return {
        id: 'FL' + (i + 1),
        name: f,
        critical: i < 2,
        steps: Array.from({ length: steps }, (_, s) => ({
          n: s + 1,
          name: ['Entry', 'Input', 'Confirm', 'Result', 'Follow-up'][s] || 'Step ' + (s + 1)
        })),
        successMetric: pick(r, [
          'Time to first success under 4 minutes',
          'Completion rate above 70%',
          'Fewer than 2 support contacts per 100 completions',
          'Return within 7 days above 45%'
        ])
      };
    });

    const screens = arch.screens.map((s, i) => ({
      id: 'S' + String(i + 1).padStart(2, '0'),
      name: s,
      priority: i < 4 ? 'P0' : i < 6 ? 'P1' : 'P2',
      states: shuffle(r, ['empty', 'loading', 'error', 'populated', 'permission-denied']).slice(0, 2 + Math.floor(r() * 2)).concat('default'),
      flow: flows[Math.min(flows.length - 1, Math.floor(i / 2))].id
    }));

    const paletteBase = arch.palette;
    const tokens = {
      color: [
        { name: 'brand/primary', value: paletteBase[0], role: 'Primary actions and active state' },
        { name: 'brand/accent', value: paletteBase[2], role: 'Emphasis, focus and highlights' },
        { name: 'support/positive', value: '#2f6b4f', role: 'Success and confirmation' },
        { name: 'support/warning', value: '#a07b12', role: 'Caution and pending' },
        { name: 'support/critical', value: '#b3261e', role: 'Destructive and error' },
        { name: 'surface/base', value: '#fffdf9', role: 'Page and card background' },
        { name: 'surface/sunk', value: '#f2ece1', role: 'Recessed and disabled areas' },
        { name: 'ink/primary', value: '#17140f', role: 'Body and heading text' },
        { name: 'ink/muted', value: '#736c60', role: 'Secondary and metadata text' }
      ],
      type: [
        { name: 'display', value: '34/38', use: 'Page titles' },
        { name: 'title', value: '25/29', use: 'Section headings' },
        { name: 'subtitle', value: '19/25', use: 'Card headings' },
        { name: 'body', value: '15/23', use: 'Default text' },
        { name: 'body-sm', value: '13.5/20', use: 'Dense tables and meta' },
        { name: 'caption', value: '12/16', use: 'Labels and hints' },
        { name: 'mono', value: '13/20', use: 'Identifiers and code' }
      ],
      space: ['2', '4', '8', '12', '18', '26', '40', '64'],
      radius: ['4', '8', '12', '18', '999']
    };

    const components = [...BASE_COMPONENTS, ...arch.components].map((name, i) => ({
      id: 'C' + String(i + 1).padStart(2, '0'),
      name,
      kind: BASE_COMPONENTS.includes(name) ? 'foundation' : 'domain',
      variants: 2 + Math.floor(r() * 5),
      usedIn: 1 + Math.floor(r() * Math.min(8, screens.length)),
      status: 'specified',
      stories: 0
    }));

    return {
      archetype: synthesis.archetype,
      archetypeName: arch.name,
      generatedAt: Date.now(),
      ia, flows, screens, tokens, components,
      principles: [
        {
          name: 'One screen, one decision',
          body: `Every ${arch.objects[0]} view answers a single question. Anything the user does not need to decide here moves to a detail view or a default.`
        },
        {
          name: 'The empty state is the onboarding',
          body: 'No blank frames. Each empty view states what it is, why it is empty and the one action that fills it.'
        },
        {
          name: 'Show state, not spinners',
          body: 'Every wait over 400ms uses a skeleton shaped like the content that is coming.'
        },
        {
          name: 'Accessible by construction',
          body: 'Contrast is guaranteed at the token layer and accessible names are required props, so no call site can opt out.'
        }
      ]
    };
  };

  /** Turn the generated design into build tickets. */
  const designToTickets = (design, source = 'mn') => {
    const t = [];
    design.screens.filter((s) => s.priority !== 'P2').forEach((s, i) => {
      t.push({
        id: MN.uid('tkt'),
        key: `${source === 'jira' ? 'PRD' : 'FEA'}-${200 + i}`,
        source,
        title: `Build ${s.name}`,
        body: `Implement the ${s.name} screen with states: ${s.states.join(', ')}. Belongs to flow ${s.flow}.`,
        type: 'feature',
        severity: s.priority === 'P0' ? 'high' : 'medium',
        points: s.priority === 'P0' ? 5 : 3,
        status: 'backlog',
        dimension: 'Product design',
        origin: 'design',
        fixes: [`Cover every state: ${s.states.join(', ')}`, 'Use only system components and tokens', 'Ship with stories for each state'],
        agent: null,
        log: []
      });
    });
    design.components.filter((c) => c.kind === 'domain').forEach((c, i) => {
      t.push({
        id: MN.uid('tkt'),
        key: `${source === 'jira' ? 'PRD' : 'FEA'}-${300 + i}`,
        source,
        title: `Build ${c.name} component`,
        body: `${c.variants} variants, used on ${c.usedIn} screens. Domain component for the ${design.archetypeName.toLowerCase()}.`,
        type: 'component',
        severity: 'medium',
        points: 3,
        status: 'backlog',
        dimension: 'Design system',
        origin: 'design',
        component: c.name,
        fixes: ['Implement the full state matrix', 'Accessible name as a required prop', 'One story per variant'],
        agent: null,
        log: []
      });
    });
    return t;
  };

  /* -------------------------------------------------------
     Agents
     ------------------------------------------------------- */
  const AGENTS = [
    { id: 'synthesist', name: 'Research Synthesist', role: 'Research', icon: '🎙', desc: 'Clusters raw signals into themes, jobs-to-be-done and ranked pains, keeping every claim traceable to the interview it came from.', area: 'research' },
    { id: 'analyst', name: 'Viability Analyst', role: 'Research', icon: '⚖', desc: 'Scores desirability, viability, feasibility, differentiation, distribution and timing, then states what would have to change to flip the verdict.', area: 'research' },
    { id: 'auditor', name: 'Debt Auditor', role: 'Design debt', icon: '🔬', desc: 'Crawls a live product or reads a Figma file, scores eight debt dimensions and writes the costed refactoring strategy.', area: 'debt' },
    { id: 'tokens', name: 'Token Architect', role: 'Design debt', icon: '🎨', desc: 'Extracts the live palette, type and spacing, collapses near-duplicates and emits tokens for both CSS and Figma variables.', area: 'debt' },
    { id: 'consolidator', name: 'Component Consolidator', role: 'Design debt', icon: '🧩', desc: 'Clusters near-duplicate components, picks the canonical implementation and codemods the call sites in waves.', area: 'debt' },
    { id: 'a11y', name: 'Accessibility Guardian', role: 'Design debt', icon: '♿', desc: 'Checks contrast, names, focus order and target size on every change, and blocks the ones that regress.', area: 'debt' },
    { id: 'architect', name: 'Product Architect', role: 'Design', icon: '🗺', desc: 'Turns synthesis into information architecture, core flows and a prioritised screen inventory.', area: 'design' },
    { id: 'systemsmith', name: 'System Smith', role: 'Design', icon: '⚙', desc: 'Generates the token set and component inventory the screens need, with the full state matrix specified.', area: 'design' },
    { id: 'triager', name: 'Ticket Triager', role: 'Build', icon: '🗂', desc: 'Reads incoming Linear and Jira tickets, classifies them, sizes them and routes them to the right agent or human.', area: 'build' },
    { id: 'fixer', name: 'Bug Fixer', role: 'Build', icon: '🔧', desc: 'Reproduces the defect, writes a failing test, fixes it against the design system and opens the pull request.', area: 'build' },
    { id: 'builder', name: 'Feature Builder', role: 'Build', icon: '🏗', desc: 'Implements a feature ticket from the spec using only system components, with stories and tests attached.', area: 'build' },
    { id: 'publisher', name: 'Storybook Publisher', role: 'Ship', icon: '📚', desc: 'Publishes reviewed components with a story per variant and runs visual regression against the baseline.', area: 'ship' }
  ];

  const agentFor = (ticket) => {
    if (ticket.type === 'bug') return AGENTS.find((a) => a.id === 'fixer');
    if (ticket.type === 'component') return AGENTS.find((a) => a.id === 'systemsmith');
    if (ticket.type === 'chore') return AGENTS.find((a) => a.id === (ticket.dimension === 'Accessibility' ? 'a11y' : 'consolidator'));
    return AGENTS.find((a) => a.id === 'builder');
  };

  /** Deterministic run script for an agent working a ticket. */
  const agentScript = (ticket, agent) => {
    const r = rng(hash(ticket.key + agent.id));
    const slug = (ticket.component || ticket.title)
      .replace(/[^a-zA-Z0-9 ]/g, '').trim().split(/\s+/).slice(0, 3)
      .map((w) => w[0].toUpperCase() + w.slice(1)).join('');
    const branch = `${ticket.type === 'bug' ? 'fix' : 'feat'}/${ticket.key.toLowerCase()}-${slug.toLowerCase()}`;
    const files = [
      `src/components/${slug}/${slug}.tsx`,
      `src/components/${slug}/${slug}.stories.tsx`,
      `src/components/${slug}/${slug}.test.tsx`
    ];

    const common = [
      { t: 'dim', s: `reading ticket ${ticket.key} — ${ticket.title}` },
      { t: 'ag', s: `${agent.name} picked up the ticket` },
      { t: 'dim', s: `loading design system context: tokens, ${20 + Math.floor(r() * 14)} components, state matrix` },
      { t: 'dim', s: `branch ${branch}` }
    ];

    const body = ticket.type === 'bug' ? [
      { t: 'dim', s: 'reproducing against the reported conditions' },
      { t: 'err', s: `reproduced — assertion failed in ${files[0].replace('.tsx', '')}` },
      { t: 'dim', s: 'writing a failing test that captures the defect' },
      { t: 'ok', s: `+ ${files[2]} (1 failing test)` },
      { t: 'dim', s: 'applying fix using system tokens rather than local values' },
      { t: 'ok', s: `~ ${files[0]}` }
    ] : ticket.type === 'component' ? [
      { t: 'dim', s: `generating component from spec — ${2 + Math.floor(r() * 4)} variants, full state matrix` },
      { t: 'ok', s: `+ ${files[0]}` },
      { t: 'dim', s: 'accessible name enforced as a required prop' },
      { t: 'ok', s: `+ ${files[1]} (story per variant)` },
      { t: 'ok', s: `+ ${files[2]}` }
    ] : [
      { t: 'dim', s: 'reading the spec and the screens it touches' },
      { t: 'ok', s: `+ ${files[0]}` },
      { t: 'dim', s: 'wiring empty, loading and error states' },
      { t: 'ok', s: `+ ${files[1]}` },
      { t: 'ok', s: `+ ${files[2]}` }
    ];

    const checks = [
      { t: 'dim', s: 'running checks' },
      { t: 'ok', s: `typecheck passed` },
      { t: 'ok', s: `unit tests passed (${8 + Math.floor(r() * 22)} tests)` },
      { t: r() > 0.72 ? 'warn' : 'ok', s: r() > 0.72
        ? `contrast 4.38:1 on the muted label — nudged to the next token step`
        : `accessibility checks passed — contrast, names, focus, targets` },
      { t: 'ok', s: `visual regression: ${Math.floor(r() * 3)} diffs, none unexpected` },
      { t: 'ag', s: `opened PR #${300 + Math.floor(r() * 400)} — ready for review` }
    ];

    return [...common, ...body, ...checks];
  };

  MN.Pipeline = {
    ARCHETYPES, SIGNAL_TYPES, VIABILITY_AXES, AGENTS,
    classify, synthesise, assessViability, generateDesign,
    designToTickets, agentFor, agentScript
  };
})();

/* =========================================================
   MN Studio — Figma engine

   Reads a Figma file into a structural model, audits it for
   the debt that only exists inside design files, and derives
   the product context the shared debt engine needs — so a
   half-finished design file can be scored without the user
   answering a questionnaire about it.

   `parse` stands in for the Figma REST API (GET /v1/files/:key
   plus /styles, /components and /variables). Swap it out and
   `audit`, `tokenPlan` and `consolidation` work unchanged.
   ========================================================= */
(() => {
  'use strict';

  const MN = window.MN;
  const { clamp, round, rng, hash, pick, shuffle } = MN;

  /* -------------------------------------------------------
     Example files — three very different states of health
     ------------------------------------------------------- */
  const SAMPLES = [
    {
      key: 'Kq7fB2xNvR', name: 'Northwind — Product', team: 'Northwind Design',
      note: 'Two years old, three designers in and out, no library owner.', health: 'poor'
    },
    {
      key: 'Ld9mT4pQwZ', name: 'Kaido Health — App v3', team: 'Kaido',
      note: 'Mid-rebuild. New library exists, old screens still reference the old one.', health: 'mixed'
    },
    {
      key: 'Ry2cJ8kHsV', name: 'Loop Finance — Design System', team: 'Loop',
      note: 'Actively maintained, variables in use, versioned releases.', health: 'good'
    }
  ];

  const HEALTH = {
    poor: { adoption: 0.22, detach: 0.44, autoLayout: 0.31, vars: 0, dupes: 9 },
    mixed: { adoption: 0.56, detach: 0.24, autoLayout: 0.62, vars: 14, dupes: 5 },
    good: { adoption: 0.86, detach: 0.07, autoLayout: 0.91, vars: 48, dupes: 1 }
  };

  const PAGE_NAMES = [
    '📐 Cover', '🧩 Components', '🎨 Foundations', 'Onboarding', 'Core flows',
    'Dashboard', 'Settings', 'Mobile', '🗄 Archive', '⚠️ WIP — do not use', 'Explorations'
  ];

  /* -------------------------------------------------------
     Parse — the structural read
     ------------------------------------------------------- */
  const parse = (input) => {
    const sample = SAMPLES.find((s) => s.key === input.key || s.name === input.name);
    const seed = hash(input.url || input.key || input.name || 'figma');
    const r = rng(seed);
    const h = HEALTH[(sample && sample.health) || pick(r, ['poor', 'mixed', 'good'])];

    const pageCount = 5 + Math.floor(r() * 5);
    const pages = shuffle(r, PAGE_NAMES).slice(0, pageCount).map((name) => ({
      name,
      frames: 3 + Math.floor(r() * 22),
      components: /component|foundation/i.test(name) ? 12 + Math.floor(r() * 40) : Math.floor(r() * 4),
      lastTouched: Math.floor(r() * 340)
    }));

    const frames = pages.reduce((s, p) => s + p.frames, 0);
    const components = pages.reduce((s, p) => s + p.components, 0);
    const instances = Math.round(frames * (2.4 + r() * 3.4));
    const detached = Math.round(instances * h.detach * (0.8 + r() * 0.4));

    // Screens are top-level frames on non-utility pages.
    const screenPages = pages.filter((p) => !/cover|component|foundation|archive|exploration/i.test(p.name));
    const screens = Math.max(4, screenPages.reduce((s, p) => s + p.frames, 0));

    const colorStyles = Math.round(6 + r() * 26);
    const rawFills = Math.round(colorStyles + frames * (h.vars ? 0.5 : 1.6) * (0.7 + r() * 0.6));
    const textStyles = Math.round(5 + (h.vars ? 4 : 14) * (0.6 + r()));

    return {
      key: (sample && sample.key) || input.key || 'F' + (seed % 1000000),
      name: (sample && sample.name) || input.name || 'Untitled file',
      team: (sample && sample.team) || 'Your team',
      note: sample && sample.note,
      url: input.url || `https://www.figma.com/file/${(sample && sample.key) || 'unknown'}`,
      lastModified: Date.now() - Math.floor(r() * 1000 * 60 * 60 * 24 * 21),
      pages,
      stats: {
        pages: pages.length,
        frames,
        screens,
        components,
        instances,
        detached,
        detachRate: round((detached / Math.max(1, instances)) * 100, 1),
        variants: Math.round(components * (0.6 + r() * 1.6)),
        colorStyles,
        rawFills,
        textStyles,
        effectStyles: Math.round(2 + r() * 9),
        variables: h.vars,
        libraryAdoption: round(h.adoption * 100, 1),
        autoLayoutPct: round(h.autoLayout * 100, 1),
        duplicateClusters: h.dupes,
        orphanFrames: Math.round(frames * (0.06 + r() * 0.18)),
        namingIssues: Math.round(components * (0.12 + r() * 0.4)),
        untouchedPages: pages.filter((p) => p.lastTouched > 120).length,
        publishedVersions: h.vars ? Math.round(3 + r() * 20) : 0
      }
    };
  };

  /* -------------------------------------------------------
     Derive the debt-engine context from the file itself
     ------------------------------------------------------- */
  const deriveContext = (file, overrides = {}) => {
    const s = file.stats;
    const system = s.libraryAdoption >= 70 && s.variables > 0 ? 'mature'
      : s.libraryAdoption >= 35 ? 'partial' : 'none';
    return Object.assign({
      stage: 'series-a',
      surfaces: clamp(s.screens, 3, 160),
      designers: 2,
      engineers: 8,
      system,
      platforms: ['web'],
      cadence: 'biweekly',
      a11yTarget: 'none',
      age: 2,
      rate: 620,
      hasTokens: s.variables > 0,
      hasStorybook: false
    }, overrides);
  };

  /* -------------------------------------------------------
     Figma-native findings
     ------------------------------------------------------- */
  const audit = (file) => {
    const s = file.stats;
    const out = [];
    const add = (o) => out.push({ id: 'FG-' + String(out.length + 1).padStart(2, '0'), ...o });

    if (s.detachRate > 8) {
      add({
        title: 'Instances have been detached from their components',
        severity: s.detachRate > 30 ? 'critical' : s.detachRate > 18 ? 'high' : 'medium',
        metric: `${s.detachRate}% of ${MN.fmt.int(s.instances)} instances`,
        effort: round(clamp(s.detached / 40, 2, 22), 1),
        why: 'A detached instance is a component that will never receive another fix. Every one of them is a silent fork of the design system.',
        fixes: [
          'Sort detached instances by how far they differ from the master — most are cosmetic overrides that can be re-attached directly.',
          'Where the detach exists to express a state the component lacks, add the variant rather than re-attaching.',
          'Turn on library analytics and review the detach rate weekly, not annually.'
        ]
      });
    }

    if (s.variables === 0) {
      add({
        title: 'No variables — every value is a raw fill or a local style',
        severity: 'critical',
        metric: `${s.rawFills} raw fills across ${s.frames} frames`,
        effort: round(clamp(s.rawFills / 22, 3, 20), 1),
        why: 'Without variables there is no theming, no mode switching, and no shared language with code. The file cannot describe intent, only appearance.',
        fixes: [
          'Build a primitive collection (the raw ramp) and a semantic collection (surface, ink, border, accent) that references it.',
          'Bind existing styles to the semantic collection so usages update in place.',
          'Export the same collections as CSS custom properties so design and code share one vocabulary.'
        ]
      });
    } else if (s.rawFills > s.variables * 2.2) {
      add({
        title: 'Variables exist but most values still bypass them',
        severity: 'high',
        metric: `${s.rawFills} raw fills against ${s.variables} variables`,
        effort: round(clamp(s.rawFills / 30, 2, 14), 1),
        why: 'A partially adopted variable system is worse than none — it creates the belief that changes propagate when most of them will not.',
        fixes: [
          'Run a fill audit page by page and bind every raw value to its nearest variable.',
          'Delete unbound local styles once their usages are migrated so they cannot be reselected.'
        ]
      });
    }

    if (s.duplicateClusters > 0) {
      add({
        title: 'Near-duplicate components across pages',
        severity: s.duplicateClusters > 6 ? 'high' : 'medium',
        metric: `${s.duplicateClusters} clusters, ${s.duplicateClusters * 3} components`,
        effort: round(clamp(s.duplicateClusters * 1.6, 2, 20), 1),
        why: 'Duplicates are how a design system quietly stops being one. Each cluster means a change has to be made three times or it gets made once and drifts.',
        fixes: [
          'For each cluster pick the canonical component by usage count, not by recency.',
          'Swap instances of the losers to the canonical component, then delete them.',
          'Where the duplicates encode a real difference, express it as a variant property.'
        ]
      });
    }

    if (s.autoLayoutPct < 80) {
      add({
        title: 'Frames are absolutely positioned rather than auto-laid-out',
        severity: s.autoLayoutPct < 45 ? 'high' : 'medium',
        metric: `${s.autoLayoutPct}% on auto layout`,
        effort: round(clamp(s.frames * (1 - s.autoLayoutPct / 100) / 12, 2, 18), 1),
        why: 'Absolute positioning makes every content change a manual reflow, and it hides responsive behaviour that engineering then has to invent.',
        fixes: [
          'Convert component internals first — they propagate to every instance.',
          'Set resizing behaviour explicitly so the intent survives handoff.',
          'Use the same spacing scale for gaps as the token set defines.'
        ]
      });
    }

    if (s.textStyles > 9) {
      add({
        title: 'Text styles have multiplied past a usable scale',
        severity: s.textStyles > 18 ? 'high' : 'medium',
        metric: `${s.textStyles} text styles`,
        effort: round(clamp(s.textStyles / 4, 1.5, 10), 1),
        why: 'Beyond about seven steps nobody can hold the scale in their head, so people pick by eye and the hierarchy stops meaning anything.',
        fixes: [
          'Collapse to a 7-step scale with semantic names, then map each existing style to its nearest step.',
          'Delete the orphans after migration so they cannot be reselected.'
        ]
      });
    }

    if (s.libraryAdoption < 70) {
      add({
        title: 'The library is published but not adopted',
        severity: s.libraryAdoption < 40 ? 'high' : 'medium',
        metric: `${s.libraryAdoption}% of instances come from the library`,
        effort: round(clamp((70 - s.libraryAdoption) / 6, 2, 14), 1),
        why: 'Publishing a library is not the same as adopting one. Low adoption means the system exists as documentation rather than as infrastructure.',
        fixes: [
          'Find the pages with the lowest adoption and migrate them one page at a time.',
          'Give the library an owner with review rights, and a release cadence people can plan against.'
        ]
      });
    }

    if (s.namingIssues > 4) {
      add({
        title: 'Component naming does not follow one convention',
        severity: 'medium',
        metric: `${s.namingIssues} components off-convention`,
        effort: round(clamp(s.namingIssues / 8, 1, 6), 1),
        why: 'Naming is the search index of a design file. Inconsistent names mean components cannot be found, so they get rebuilt.',
        fixes: [
          'Adopt Category/Component/Variant naming and rename in one pass.',
          'Match the names to the code component names exactly — the mapping is the handoff.'
        ]
      });
    }

    if (s.orphanFrames > 6) {
      add({
        title: 'Orphan frames and abandoned explorations are still in the file',
        severity: 'low',
        metric: `${s.orphanFrames} orphan frames · ${s.untouchedPages} pages untouched for 4+ months`,
        effort: round(clamp(s.orphanFrames / 14, 1, 5), 1),
        why: 'Dead frames are indistinguishable from live ones at a glance, which is how engineering builds the wrong screen.',
        fixes: [
          'Move anything untouched for a quarter to an archive page with a dated name.',
          'Mark the live pages with a status prefix so the file states its own truth.'
        ]
      });
    }

    if (s.publishedVersions === 0) {
      add({
        title: 'The library is unversioned',
        severity: 'medium',
        metric: 'no published releases',
        effort: 3,
        why: 'Without versioned releases, consumers cannot tell what changed or choose when to take it — so they stop taking updates at all.',
        fixes: [
          'Publish with release notes on a fixed cadence.',
          'Match the version to the code package so both sides can name the same state.'
        ]
      });
    }

    return out.sort((a, b) => MN.SEVERITY[b.severity].weight - MN.SEVERITY[a.severity].weight);
  };

  /* -------------------------------------------------------
     Tokenisation plan
     ------------------------------------------------------- */
  const tokenPlan = (file) => {
    const s = file.stats;
    const primitives = clamp(Math.round(9 + s.colorStyles * 0.25), 12, 34);
    return {
      before: { values: s.rawFills + s.colorStyles, styles: s.colorStyles, variables: s.variables, textStyles: s.textStyles },
      after: { primitives, semantic: 18, textStyles: 7, spacing: 8, radius: 5 },
      collections: [
        { name: 'primitive/colour', count: primitives, note: 'The raw ramp — neutrals plus four semantic families, nine steps each.' },
        { name: 'semantic/colour', count: 18, note: 'surface, ink, border, accent, and state. References primitives only.' },
        { name: 'semantic/typography', count: 7, note: 'display, title, subtitle, body, body-sm, caption, mono.' },
        { name: 'semantic/space', count: 8, note: '4pt base grid — named by intent, not by size.' },
        { name: 'semantic/radius', count: 5, note: 'sm through full, tied to component scale.' }
      ],
      reduction: round((1 - (primitives + 18) / Math.max(1, s.rawFills + s.colorStyles)) * 100, 1),
      steps: [
        'Extract every fill and text style in the file with its usage count.',
        'Cluster colours within ΔE < 3 and pick the most-used member of each cluster as the primitive.',
        'Build the semantic collection on top and bind styles to it — usages update in place.',
        'Export both collections as CSS custom properties so code consumes the same names.',
        'Delete unbound local styles so the old values cannot be reselected.'
      ]
    };
  };

  /* -------------------------------------------------------
     Component consolidation map
     ------------------------------------------------------- */
  const CLUSTER_SEEDS = [
    ['Button', ['Button', 'Btn / Primary', 'CTA Button', 'button-new']],
    ['Card', ['Card', 'Card / v2', 'ContentCard', 'card copy 3']],
    ['Input', ['Input', 'TextField', 'Form / Input', 'input-fixed']],
    ['Modal', ['Modal', 'Dialog', 'Overlay / Modal']],
    ['Badge', ['Badge', 'Tag', 'Pill', 'Status chip']],
    ['Avatar', ['Avatar', 'User pic', 'Profile circle']],
    ['Table row', ['TableRow', 'Row / Default', 'List item']],
    ['Nav item', ['NavItem', 'Sidebar link', 'Menu row']],
    ['Empty state', ['EmptyState', 'Blank slate', 'No results']]
  ];

  const consolidation = (file) => {
    const r = rng(hash(file.key + 'cluster'));
    return shuffle(r, CLUSTER_SEEDS).slice(0, file.stats.duplicateClusters).map(([canonical, members], i) => {
      const usages = members.map((m, j) => ({
        name: m,
        instances: Math.round((j === 0 ? 60 : 24) * (0.4 + r()) + 4)
      })).sort((a, b) => b.instances - a.instances);
      return {
        id: 'CL-' + (i + 1),
        canonical,
        keep: usages[0].name,
        retire: usages.slice(1),
        instances: usages.reduce((s, u) => s + u.instances, 0),
        effort: round(clamp(usages.length * 0.9, 1, 6), 1)
      };
    });
  };

  /* -------------------------------------------------------
     Handoff — turn the file into a pipeline design
     ------------------------------------------------------- */
  const toDesign = (file, report) => {
    const r = rng(hash(file.key + 'design'));
    const screenPages = file.pages.filter((p) => !/cover|component|foundation|archive/i.test(p.name));
    const plan = tokenPlan(file);

    const screens = screenPages.slice(0, 10).map((p, i) => ({
      id: 'S' + String(i + 1).padStart(2, '0'),
      name: p.name.replace(/^[^\w]+/, '').trim() || 'Screen ' + (i + 1),
      priority: i < 3 ? 'P0' : i < 6 ? 'P1' : 'P2',
      states: ['default', 'empty', 'loading'],
      flow: 'FL1'
    }));

    const clusters = consolidation(file);
    const components = [
      ...clusters.map((c) => c.canonical),
      'Button', 'TextField', 'Select', 'Toggle', 'Tabs', 'Toast', 'Skeleton', 'EmptyState'
    ].filter((n, i, a) => a.indexOf(n) === i).map((name, i) => ({
      id: 'C' + String(i + 1).padStart(2, '0'),
      name: name.replace(/\s+/g, ''),
      kind: i < clusters.length ? 'domain' : 'foundation',
      variants: 2 + Math.floor(r() * 5),
      usedIn: 1 + Math.floor(r() * 8),
      status: 'specified',
      stories: 0
    }));

    return {
      archetype: 'figma-import',
      archetypeName: `Imported from ${file.name}`,
      generatedAt: Date.now(),
      ia: { root: file.name, primary: screens.slice(0, 5).map((s) => ({ name: s.name, children: [] })) },
      flows: [{
        id: 'FL1', name: 'Core flow reconstructed from the file', critical: true,
        steps: [{ n: 1, name: 'Entry' }, { n: 2, name: 'Input' }, { n: 3, name: 'Confirm' }, { n: 4, name: 'Result' }],
        successMetric: 'Parity with the current product, with the debt findings resolved'
      }],
      screens,
      tokens: {
        color: plan.collections.filter((c) => c.name.includes('colour')).flatMap((c, ci) =>
          ['primary', 'accent', 'positive', 'warning', 'critical', 'surface', 'ink'].slice(0, ci ? 7 : 4).map((n, i) => ({
            name: `${c.name.split('/')[0]}/${n}`,
            value: ['#1c3d5a', '#c1662f', '#2f6b4f', '#a07b12', '#b3261e', '#fffdf9', '#17140f'][i],
            role: c.note
          }))),
        type: [
          { name: 'display', value: '34/38', use: 'Page titles' },
          { name: 'title', value: '25/29', use: 'Section headings' },
          { name: 'subtitle', value: '19/25', use: 'Card headings' },
          { name: 'body', value: '15/23', use: 'Default text' },
          { name: 'body-sm', value: '13.5/20', use: 'Dense tables' },
          { name: 'caption', value: '12/16', use: 'Labels' },
          { name: 'mono', value: '13/20', use: 'Identifiers' }
        ],
        space: ['2', '4', '8', '12', '18', '26', '40', '64'],
        radius: ['4', '8', '12', '18', '999']
      },
      components,
      principles: [
        { name: 'Rebuild from the canonical component', body: `The ${clusters.length} duplicate clusters collapse to one component each before any new screen work starts.` },
        { name: 'Variables before pixels', body: `Every value binds to the semantic collection — ${plan.reduction}% fewer distinct values than the file holds today.` },
        { name: 'The file states its own truth', body: 'Archive pages are dated and prefixed; live pages carry a status so nobody builds a dead exploration.' },
        { name: 'Names match code', body: 'Component names in the file are the component names in the repository. The mapping is the handoff.' }
      ],
      fromFigma: { key: file.key, name: file.name, reportId: report.id }
    };
  };

  MN.Figma = { SAMPLES, parse, deriveContext, audit, tokenPlan, consolidation, toDesign };
})();

</script>
<script>
window.MN.PAGES = {};
/* =========================================================
   MN Studio — Workspace overview
   What the workspace currently knows, and the way in to each
   journey. Also carries the demo seeder, which populates all
   three journeys with a coherent worked example.
   ========================================================= */
MN.PAGES["overview"] = () => {
  'use strict';

  const MN = window.MN;
  const { esc, fmt } = MN;
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];

  const S = () => MN.store.all;

  /* -------------------------------------------------------
     KPIs — only what the workspace actually knows
     ------------------------------------------------------- */
  const renderKpis = () => {
    const s = S();
    const tiles = [];

    if (s.debt) {
      const r = s.debt.report;
      tiles.push({
        label: 'Design debt index', value: r.index, note: `${esc(r.band.label)} · ${r.findings.length} findings`,
        tone: r.index >= 55 ? 'up' : ''
      });
      tiles.push({
        label: 'Carrying cost', value: fmt.money0(r.economics.interestPerSprint),
        note: `every sprint · ${r.economics.velocityDrag}% capacity lost`, tone: 'up'
      });
    }
    if (s.figma) {
      tiles.push({
        label: 'Figma detach rate', value: s.figma.file.stats.detachRate + '%',
        note: `${esc(s.figma.file.name)} · ${s.figma.audit.length} file findings`,
        tone: s.figma.file.stats.detachRate > 18 ? 'up' : ''
      });
    }
    if (s.pipeline.viability) {
      tiles.push({
        label: 'Viability', value: s.pipeline.viability.score,
        note: s.pipeline.viability.verdict.toUpperCase() + (s.pipeline.viability.overridden ? ' · overridden' : ''),
        tone: s.pipeline.viability.verdict === 'go' ? 'down' : ''
      });
    }
    const open = s.pipeline.build.tickets.filter((t) => t.status !== 'shipped').length;
    if (s.pipeline.build.tickets.length) {
      tiles.push({
        label: 'Open tickets', value: open,
        note: `${s.pipeline.build.tickets.length - open} shipped · ${s.pipeline.ship.published} components published`
      });
    }

    $('#kpis').innerHTML = tiles.length
      ? `<div class="grid g4">${tiles.slice(0, 4).map((t) => `
          <div class="tile">
            <p class="tile-label">${esc(t.label)}</p>
            <p class="tile-value">${t.value}</p>
            <p class="tile-note ${t.tone || ''}">${t.note}</p>
          </div>`).join('')}</div>`
      : `<div class="note">
           <span class="note-ico">ℹ</span>
           <div>
             <b>The workspace is empty.</b> Start any journey below, or press
             <b>Load demo workspace</b> in the header to populate all three with a worked
             example you can click through immediately.
           </div>
         </div>`;
  };

  /* -------------------------------------------------------
     Journey cards
     ------------------------------------------------------- */
  const renderJourneys = () => {
    const s = S();
    const p = s.pipeline;
    const stageName = { research: 'Research', viability: 'Viability', design: 'Design', build: 'Build', ship: 'Ship' }[p.stage];

    const cards = [
      {
        href: 'debt.html', icon: '🔬', title: 'Design debt calculator',
        blurb: 'A live URL or a demo video in; a scored debt ledger, its cost per sprint, and a costed refactoring strategy out.',
        state: s.debt
          ? { badge: `Index ${s.debt.report.index}`, tone: 'medium', line: `${esc(s.debt.label)} · ${s.debt.report.findings.length} findings · ${fmt.when(s.debt.report.generatedAt)}` }
          : { badge: 'Not started', tone: '', line: 'Point it at something real and it returns a report in about ten seconds.' },
        cta: s.debt ? 'Open the report' : 'Calculate design debt'
      },
      {

          : { badge: 'Not started', tone: '', line: 'Bring your own research, or load the worked example.' },

        <div class="row-between">
          <span class="agent-ava" style="width:42px;height:42px;font-size:19px">${c.icon}</span>
          <span class="badge ${c.state.tone}">${esc(c.state.badge)}</span>
        </div>
        <h3 style="margin:0">${esc(c.title)}</h3>
        <p class="small" style="margin:0;flex:1">${esc(c.blurb)}</p>
        <p class="tiny muted" style="margin:0;padding-top:12px;border-top:1px solid var(--line-soft)">${c.state.line}</p>
        <span class="strong small" style="color:var(--accent-dark)">${esc(c.cta)} →</span>
      </a>`).join('');
  };

  /* -------------------------------------------------------
     Activity + connections
     ------------------------------------------------------- */
  const KIND_ICON = { debt: '🔬', research: '🎙', viability: '⚖', design: '🗺', pipeline: '🗂', agent: '🤖', ship: '📚', workflow: '⚡', figma: '🎨', connector: '🔌' };

  const renderActivity = () => {
    const acts = MN.store.get('activity', []).slice(0, 12);
    $('#activity').innerHTML = acts.length ? `
      <div class="card card-pad">
        <div class="stack">
          ${acts.map((a) => `
            <div class="row" style="gap:12px;padding:8px 0;border-bottom:1px solid var(--line-soft)">
              <span style="font-size:15px">${KIND_ICON[a.kind] || '•'}</span>
              <span class="grow small" style="color:var(--ink)">${esc(a.text)}</span>
              <span class="tiny muted nowrap">${fmt.when(a.ts)}</span>
            </div>`).join('')}
        </div>
      </div>` : `
      <div class="empty">
        <h4>Nothing yet</h4>
        <p>Analyses, agent runs and workflow executions all land here.</p>
      </div>`;
  };

  const CONNECTORS = [
    ['figma', 'Figma', 'figma'], ['linear', 'Linear', 'linear'], ['jira', 'Jira', 'jira'],
    ['storybook', 'Storybook', 'sb'], ['github', 'GitHub', 'gh'], ['slack', 'Slack', 'slack']
  ];

  const renderConn = () => {
    const c = MN.store.get('connectors');
    const on = Object.values(c).filter(Boolean).length;
    $('#connSummary').innerHTML = `
      <div class="card card-pad">
        <div class="row-between" style="margin-bottom:14px">
          <span class="strong">${on} of 6 connected</span>
          <a class="tiny" href="agents.html#connectors" style="color:var(--accent-dark)">Manage →</a>
        </div>
        <div class="row-wrap">
          ${CONNECTORS.map(([k, name, cls]) => `
            <span class="chip" style="${c[k] ? '' : 'opacity:.5'}">
              <span class="conn-logo ${cls}" style="width:18px;height:18px;font-size:8px;border-radius:5px">${name[0]}</span>
              ${esc(name)}
            </span>`).join('')}
        </div>
      </div>`;
  };

  /* -------------------------------------------------------
     Demo seeder — a coherent worked example across all three
     ------------------------------------------------------- */
  const seedDemo = async () => {
    const btn = $('#demoBtn');
    btn.disabled = true;
    btn.innerHTML = 'Seeding…';

    // 1 — design debt on a live product
    const debtCtx = {
      stage: 'seed', cadence: 'weekly', surfaces: 26, designers: 1, engineers: 6,
      system: 'partial', a11yTarget: 'none', platforms: ['web', 'ios'],
      age: 2.5, rate: 620, hasTokens: false, hasStorybook: false
    };
    const debtReport = MN.DebtEngine.analyze({
      kind: 'url', source: 'https://app.northwind.io', label: 'app.northwind.io', context: debtCtx
    });

    // 2 — Figma audit on the same company's file
    const file = MN.Figma.parse({ key: 'Kq7fB2xNvR' });
    const figCtx = MN.Figma.deriveContext(file, { stage: 'seed', designers: 1, engineers: 6, rate: 620 });
    const figReport = MN.DebtEngine.analyze({ kind: 'figma', source: file.key, label: file.name, context: figCtx });

    // 3 — the pipeline, run through to a shipped component
    const product = {
      name: 'Fernbank',
      audience: 'Operations leads at 20–200 person design and dev agencies',
      oneLiner: 'Reconcile agency retainers against delivered work without leaving the accounting tool',
      problem: 'Agency ops leads reconcile retainer invoices against timesheets and delivered scope every month. '
        + 'The data lives in three places, so the reconciliation happens in a spreadsheet one person maintains. '
        + 'It takes two to three days a month and errors surface only when a client disputes an invoice.'
    };
    const signals = [
      ['interview', 'Priya, ops lead, Havenly (48 people)', 'Spends the first three days of every month in a reconciliation spreadsheet she built herself. Nobody else can run it.'],
      ['interview', 'Marcus, MD, Solstice (22 people)', 'Found out about a £14k under-billing nine months late. Now checks manually and still does not trust it.'],
      ['interview', 'Dee, finance manager, Kaido', 'Says the accounting tool is fine — the problem is that delivered scope never gets back into it.'],
      ['sales', 'Discovery call — Northwind', 'Asked directly about price. Said they would pay per seat if it removed the monthly spreadsheet entirely.'],
      ['support', 'Competitor forum thread, 84 replies', 'Recurring complaint that existing tools reconcile time but not scope, so the number is still wrong.'],
      ['analytics', 'Time-tracker export, 6 agencies', 'Between 11% and 19% of tracked hours never make it onto an invoice.'],
      ['competitor', 'Teardown — three incumbents', 'All three are built for firms above 200 people and price accordingly. Setup assumes a finance team.']
    ].map(([type, source, note]) => ({ id: MN.uid('sig'), type, source, note }));

    const synthesis = MN.Pipeline.synthesise(product, signals);
    const viability = MN.Pipeline.assessViability(product, synthesis, {
      market: 'focused', competitors: 4, wtp: 'loi', complexity: 'medium',
      teamFit: 'strong', channel: 'audience', wedge: true, unlock: true
    });
    const design = MN.Pipeline.generateDesign(product, synthesis, viability);
    const tickets = [
      ...MN.Pipeline.designToTickets(design, 'mn'),
      ...MN.DebtEngine.toTickets(debtReport, 'linear').slice(0, 6)
    ];

    // Work the first few component tickets through to shipped.
    const shipComponents = [];
    tickets.filter((t) => t.type === 'component').slice(0, 4).forEach((t) => {
      const agent = MN.Pipeline.agentFor(t);
      t.status = 'shipped';
      t.agent = agent.id;
      t.pr = 300 + Math.floor(MN.rng(MN.hash(t.key))() * 400);
      t.log = MN.Pipeline.agentScript(t, agent).map((l) => ({ ...l, time: fmt.clock() }));
      const spec = design.components.find((c) => c.name === t.component);
      shipComponents.push({
        name: t.component, stories: spec ? spec.variants : 3,
        published: true, coverage: 100, diffs: 0, from: t.key
      });
    });
    tickets.filter((t) => t.type === 'bug').slice(0, 2).forEach((t) => {
      const agent = MN.Pipeline.agentFor(t);
      t.status = 'review';
      t.agent = agent.id;
      t.pr = 300 + Math.floor(MN.rng(MN.hash(t.key))() * 400);
      t.log = MN.Pipeline.agentScript(t, agent).map((l) => ({ ...l, time: fmt.clock() }));
    });

    await MN.sleep(900);

    MN.store.patch((s) => {
      s.debt = { source: 'https://app.northwind.io', label: 'app.northwind.io', kind: 'url', context: debtCtx, report: debtReport };
      s.figma = { file, report: figReport, audit: MN.Figma.audit(file), plan: MN.Figma.tokenPlan(file), clusters: MN.Figma.consolidation(file) };
      s.pipeline = {
        stage: 'build',
        product,
        research: { signals, synthesis },
        viability,
        design,
        build: { tickets, sprint: 3 },
        ship: { components: shipComponents, published: shipComponents.length }
      };
      s.connectors = { figma: true, linear: true, jira: false, storybook: true, github: true, slack: false };
      s.activity = [
        ['ship', `${shipComponents.length} components published to Storybook`],
        ['agent', 'Feature Builder completed FEA-301 — PR #412 open'],
        ['pipeline', `${tickets.length} build tickets created`],
        ['design', `Generated ${design.screens.length} screens and ${design.components.length} components`],
        ['viability', `Viability ${viability.score} — ${viability.verdict.toUpperCase()}`],
        ['research', `Synthesised ${synthesis.themes.length} themes from ${signals.length} signals`],
        ['figma', `Audited ${file.name} — index ${figReport.index}`],
        ['debt', `Design debt report ${debtReport.id} — index ${debtReport.index} for app.northwind.io`]
      ].map(([kind, text], i) => ({ id: MN.uid('act'), kind, text, ts: Date.now() - i * 1000 * 60 * 37 }));
    });

    MN.shell.refresh();
    paint();
    btn.disabled = false;
    btn.innerHTML = 'Reseed <span class="lbl">demo</span>';
    MN.toast('Demo workspace loaded', 'All three journeys are populated — open any of them.', 'ok');
  };

  /* -------------------------------------------------------
     Boot
     ------------------------------------------------------- */
  const paint = () => {
    renderKpis();
    renderJourneys();
    renderActivity();
    renderConn();
    const s = S();
    const has = s.debt || s.figma || s.pipeline.research.synthesis;
    $('#demoBtn').innerHTML = has
      ? 'Reseed <span class="lbl">demo</span>'
      : 'Load <span class="lbl">demo workspace</span>';
    $('#wsTitle').textContent = has ? 'Where things stand.' : 'Good to see you.';
  };

  $('#demoBtn').addEventListener('click', seedDemo);

  $('#resetBtn').addEventListener('click', () => {
    MN.modal({
      title: 'Reset the workspace',
      sub: 'Clears every journey, ticket, workflow and connection.',
      body: '<p>This empties local storage for the platform. Nothing else on your machine is touched.</p>',
      foot: `<button class="btn btn-ghost" data-close>Cancel</button>
             <button class="btn btn-accent" id="doReset">Reset everything</button>`,
      onMount: (root) => root.querySelector('#doReset').addEventListener('click', () => {
        MN.store.reset();
        MN.closeModal();
        window.location.reload();
      })
    });
  });

  paint();
};

/* =========================================================
   MN Studio — Design debt calculator (journey one)
   Live link or demo video → scored report → pipeline.
   ========================================================= */
MN.PAGES["debt"] = () => {
  'use strict';

  const MN = window.MN;
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];

  const views = {
    intake: $('#intake'),
    scanning: $('#scanning'),
    report: $('#report')
  };

  const show = (name) => {
    Object.entries(views).forEach(([k, el]) => el.classList.toggle('hidden', k !== name));
    const onReport = name === 'report';
    ['#restartBtn', '#ticketsBtn', '#exportBtn'].forEach((sel) => {
      const b = $(sel);
      if (b) b.classList.toggle('hidden', !onReport);
    });
    window.scrollTo({ top: 0, behavior: 'auto' });
  };

  /* -------------------------------------------------------
     Aside: the eight dimensions, straight from the engine
     ------------------------------------------------------- */
  const preview = $('#dimPreview');
  if (preview) {
    preview.innerHTML = MN.DebtEngine.DIMENSIONS.map((d) => `
      <div>
        <div class="row-between" style="gap:8px">
          <span class="small strong">${MN.esc(d.name)}</span>
          <span class="tiny muted mono">${Math.round(d.weight * 100)}%</span>
        </div>
        <p class="tiny muted" style="margin:2px 0 0;line-height:1.45">${MN.esc(d.blurb)}</p>
      </div>`).join('');
  }

  /* -------------------------------------------------------
     Intake wiring
     ------------------------------------------------------- */
  let sourceKind = 'url';
  let videoFile = null;

  $$('.tab').forEach((tab) => {
    tab.addEventListener('click', () => { sourceKind = tab.id === 'tab-video' ? 'video' : 'url'; });
  });

  $$('[data-demo-url]').forEach((chip) => {
    chip.addEventListener('click', () => { $('#urlInput').value = chip.dataset.demoUrl; });
  });

  const surfaces = $('#ctxSurfaces');
  const surfacesVal = $('#surfacesVal');
  surfaces.addEventListener('input', () => { surfacesVal.textContent = surfaces.value; });

  /* video intake */
  const dropzone = $('#dropzone');
  const fileInput = $('#fileInput');
  const filePicked = $('#filePicked');

  const acceptFile = (file) => {
    if (!file) return;
    if (!file.type.startsWith('video/')) {
      MN.toast('Not a video', 'Upload an MP4, MOV or WebM walkthrough.', 'warn');
      return;
    }
    videoFile = file;
    filePicked.classList.remove('hidden');
    filePicked.innerHTML = `
      <div class="file-pill">
        <span class="fp-ico">▶</span>
        <span class="grow">
          <b>${MN.esc(file.name)}</b>
          <span>${(file.size / 1048576).toFixed(1)} MB · ${MN.esc(file.type || 'video')}</span>
        </span>
        <button class="btn btn-quiet btn-sm" type="button" id="dropFile">Remove</button>
      </div>`;
    $('#dropFile').addEventListener('click', () => {
      videoFile = null;
      fileInput.value = '';
      filePicked.classList.add('hidden');
      filePicked.innerHTML = '';
    });
  };

  dropzone.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
  });
  fileInput.addEventListener('change', () => acceptFile(fileInput.files[0]));
  ['dragenter', 'dragover'].forEach((ev) => dropzone.addEventListener(ev, (e) => {
    e.preventDefault(); dropzone.classList.add('over');
  }));
  ['dragleave', 'drop'].forEach((ev) => dropzone.addEventListener(ev, (e) => {
    e.preventDefault(); dropzone.classList.remove('over');
  }));
  dropzone.addEventListener('drop', (e) => acceptFile(e.dataTransfer.files[0]));

  /* -------------------------------------------------------
     Gather context
     ------------------------------------------------------- */
  const readContext = () => ({
    stage: $('#ctxStage').value,
    cadence: $('#ctxCadence').value,
    surfaces: Number(surfaces.value),
    designers: Number($('#ctxDesigners').value),
    engineers: Number($('#ctxEngineers').value),
    system: ($$('input[name="system"]').find((r) => r.checked) || {}).value,
    a11yTarget: ($$('input[name="a11y"]').find((r) => r.checked) || {}).value,
    platforms: $$('input[name="platform"]:checked').map((c) => c.value),
    age: Number($('#ctxAge').value),
    rate: Number($('#ctxRate').value),
    hasTokens: $('#ctxTokens').checked,
    hasStorybook: $('#ctxStorybook').checked,
    notes: $('#ctxNotes').value.trim()
  });

  /* -------------------------------------------------------
     Scan choreography
     ------------------------------------------------------- */
  const runScan = async (steps, label, kindLabel) => {
    show('scanning');
    $('#scanKind').textContent = kindLabel;
    $('#scanTarget').textContent = label;
    const list = $('#scanSteps');
    list.innerHTML = steps.map((s) => `
      <div class="scan-step"><span class="dot">✓</span><span class="grow">${MN.esc(s)}</span><span class="t"></span></div>
    `).join('');
    const rows = $$('.scan-step', list);
    const fill = $('#scanFill');

    for (let i = 0; i < rows.length; i++) {
      rows[i].classList.add('run');
      const started = performance.now();
      await MN.sleep(560 + Math.random() * 620);
      rows[i].classList.remove('run');
      rows[i].classList.add('done');
      rows[i].querySelector('.t').textContent = ((performance.now() - started) / 1000).toFixed(1) + 's';
      fill.style.width = ((i + 1) / rows.length * 100) + '%';
    }
    await MN.sleep(320);
  };

  /* -------------------------------------------------------
     Run
     ------------------------------------------------------- */
  const runBtn = $('#runBtn');

  runBtn.addEventListener('click', async () => {
    const ctx = readContext();
    let source, label, kindLabel;

    if (sourceKind === 'url') {
      const raw = $('#urlInput').value.trim();
      if (!raw) {
        MN.toast('Add a product URL', 'Or switch to the demo video tab.', 'warn');
        $('#urlInput').focus();
        return;
      }
      source = /^https?:\/\//i.test(raw) ? raw : 'https://' + raw;
      label = source.replace(/^https?:\/\//, '').replace(/\/$/, '');
      kindLabel = 'Crawling live product';
    } else {
      if (!videoFile) {
        MN.toast('Add a demo video', 'Drop an MP4, MOV or WebM to analyse.', 'warn');
        return;
      }
      source = videoFile.name;
      label = videoFile.name;
      kindLabel = 'Analysing demo video';
    }

    if (!ctx.platforms.length) {
      MN.toast('Pick at least one platform', 'Web, iOS or Android.', 'warn');
      return;
    }

    runBtn.disabled = true;
    const report = MN.DebtEngine.analyze({ kind: sourceKind, source, label, context: ctx });

    await runScan(report.scanSteps, label, kindLabel);

    MN.store.set('debt', { source, label, kind: sourceKind, context: ctx, report });
    MN.store.log('debt', `Design debt report ${report.id} — index ${report.index} for ${label}`);
    MN.shell.refresh();

    renderReport(report);
    runBtn.disabled = false;
    MN.toast('Analysis complete', `${report.findings.length} findings · index ${report.index}`, 'ok');
  });

  /* -------------------------------------------------------
     Report + header actions
     ------------------------------------------------------- */
  const renderReport = (report) => {
    MN.renderReport(views.report, report);
    show('report');
    wireHeader(report);
  };

  let headerWired = false;
  const wireHeader = (report) => {
    if (headerWired) return;
    headerWired = true;

    $('#restartBtn').addEventListener('click', () => {
      MN.store.set('debt', null);
      MN.shell.refresh();
      show('intake');
    });

    $('#exportBtn').addEventListener('click', () => {
      const rep = MN.store.get('debt').report;
      const md = MN.DebtEngine.toMarkdown(rep);
      MN.modal({
        title: 'Export report',
        sub: `${rep.id} · ${rep.findings.length} findings`,
        wide: true,
        body: `
          <div class="row-wrap" style="margin-bottom:14px">
            <button class="btn btn-primary btn-sm" id="copyMd">Copy markdown</button>
            <button class="btn btn-ghost btn-sm" id="printRep">Print / save as PDF</button>
          </div>
          <textarea class="textarea mono" style="min-height:340px;font-size:12px" readonly>${MN.esc(md)}</textarea>`,
        onMount: (root) => {
          root.querySelector('#copyMd').addEventListener('click', () => MN.copy(md, 'Report copied'));
          root.querySelector('#printRep').addEventListener('click', () => { MN.closeModal(); setTimeout(() => window.print(), 120); });
        }
      });
    });

    $('#ticketsBtn').addEventListener('click', () => {
      const rep = MN.store.get('debt').report;
      MN.modal({
        title: 'Send findings to the product pipeline',
        sub: 'Each finding becomes a ticket the agents can pick up.',
        body: `
          <p>Create <b class="strong">${rep.findings.length} tickets</b> from report
             ${MN.esc(rep.id)}, ordered by the refactoring strategy.</p>
          <div class="field">
            <span class="field-label">Ticket destination</span>
            <div class="choices c3">
              <label class="choice"><input type="radio" name="dest" value="mn" checked>
                <b>MN board</b><span>Native, no connector needed</span></label>
              <label class="choice"><input type="radio" name="dest" value="linear">
                <b>Linear</b><span>Sync as issues</span></label>
              <label class="choice"><input type="radio" name="dest" value="jira">
                <b>Jira</b><span>Sync as tasks</span></label>
            </div>
          </div>`,
        foot: `<button class="btn btn-ghost" data-close>Cancel</button>
               <button class="btn btn-primary" id="confirmTickets">Create tickets</button>`,
        onMount: (root) => {
          root.querySelector('#confirmTickets').addEventListener('click', () => {
            const dest = [...root.querySelectorAll('input[name="dest"]')].find((r) => r.checked).value;
            const tickets = MN.DebtEngine.toTickets(rep, dest);
            MN.store.patch((s) => {
              s.pipeline.build.tickets = [...tickets, ...s.pipeline.build.tickets];
              if (dest !== 'mn') s.connectors[dest] = true;
            });
            MN.store.log('pipeline', `${tickets.length} debt tickets created from ${rep.id}`);
            MN.shell.refresh();
            MN.closeModal();
            MN.toast(`${tickets.length} tickets created`, 'Open the product pipeline to assign agents.', 'ok');
            setTimeout(() => MN.goto('build', 'build'), 900);
          });
        }
      });
    });
  };

  /* -------------------------------------------------------
     Restore a previous report
     ------------------------------------------------------- */
  const saved = MN.store.get('debt');
  if (saved && saved.report) {
    renderReport(saved.report);
  } else {
    show('intake');
  }
};

/* =========================================================
   MN Studio — Figma audit (journey three)
   Read a file → structural audit + debt score → tokenisation
   and consolidation plans → hand off into the pipeline.
   ========================================================= */
MN.PAGES["figma"] = () => {
  'use strict';

  const MN = window.MN;
  const F = MN.Figma;
  const { esc, fmt } = MN;
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];

  const views = { connect: $('#connect'), scanning: $('#scanning'), result: $('#result') };
  const show = (name) => {
    Object.entries(views).forEach(([k, el]) => el.classList.toggle('hidden', k !== name));
    ['#newFile', '#handoffBtn'].forEach((sel) => $(sel).classList.toggle('hidden', name !== 'result'));
    window.scrollTo({ top: 0, behavior: 'auto' });
  };

  /* -------------------------------------------------------
     Sample files
     ------------------------------------------------------- */
  $('#sampleList').innerHTML = F.SAMPLES.map((s) => `
    <button class="conn" data-sample="${esc(s.key)}" style="width:100%;text-align:left;cursor:pointer;font:inherit">
      <span class="conn-logo figma">F</span>
      <span class="conn-body grow">
        <b>${esc(s.name)}</b>
        <span>${esc(s.team)} · ${esc(s.note)}</span>
      </span>
      <span class="badge ${s.health === 'good' ? 'good' : s.health === 'mixed' ? 'medium' : 'critical'}">${esc(s.health)}</span>
    </button>`).join('');

  $$('[data-sample]').forEach((b) => b.addEventListener('click', () => run({ key: b.dataset.sample })));

  $('#readBtn').addEventListener('click', () => {
    const url = $('#figUrl').value.trim();
    if (!url) { MN.toast('Add a file URL', 'Or pick one of the example files below.', 'warn'); return; }
    const m = url.match(/figma\.com\/(?:file|design)\/([A-Za-z0-9]+)(?:\/([^/?#]+))?/);
    run({ url, key: m ? m[1] : undefined, name: m && m[2] ? decodeURIComponent(m[2]).replace(/-/g, ' ') : undefined });
  });

  /* -------------------------------------------------------
     Run
     ------------------------------------------------------- */
  const overrides = () => ({
    designers: Number($('#fDesigners').value),
    engineers: Number($('#fEngineers').value),
    stage: $('#fStage').value,
    rate: Number($('#fRate').value)
  });

  const run = async (input) => {
    const file = F.parse(input);
    const ctx = F.deriveContext(file, overrides());
    const report = MN.DebtEngine.analyze({
      kind: 'figma',
      source: file.key,
      label: file.name,
      context: ctx
    });

    show('scanning');
    $('#connState').textContent = 'Connected';
    $('#scanTarget').textContent = file.name;

    const steps = report.scanSteps;
    const list = $('#scanSteps');
    list.innerHTML = steps.map((s) => `
      <div class="scan-step"><span class="dot">✓</span><span class="grow">${esc(s)}</span><span class="t"></span></div>`).join('');

    const clusters = F.consolidation(file);

    MN.shell.refresh();

            <label class="choice"><input type="checkbox" id="hoDebt" checked>

          if (wantDebt) tickets.push(...MN.DebtEngine.toTickets(saved.report, 'mn'));
          if (wantFile) {
            tickets.push(...saved.audit.map((f, i) => ({
              id: MN.uid('tkt'),
              key: `FIG-${100 + i}`,

              title: f.title,
              body: f.why,
              type: 'chore',
              severity: f.severity,
              points: Math.max(1, Math.round(f.effort / 2)),
              status: 'backlog',
              dimension: 'Design system',
              origin: 'figma',
              fixes: f.fixes,
              agent: null,
              log: []
            })));
