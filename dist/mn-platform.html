};

/* =========================================================
   MN Studio — Product pipeline (journey two)
   Research → viability gate → design → build → ship.
   ========================================================= */
MN.PAGES["build"] = () => {
  'use strict';

  const MN = window.MN;
  const P = MN.Pipeline;
  const { esc, fmt } = MN;
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];

  const STAGES = [
    { key: 'research', title: 'Research', sub: 'Signals & synthesis' },
    { key: 'viability', title: 'Viability', sub: 'The gate' },
    { key: 'design', title: 'Design', sub: 'IA, flows, system' },
    { key: 'build', title: 'Build', sub: 'Tickets & agents' },
    { key: 'ship', title: 'Ship', sub: 'Storybook' }
  ];

  const st = () => MN.store.get('pipeline');
  /** store.patch hands back the whole state; pipeline code wants its own slice. */
  const pat = (fn) => MN.store.patch((root) => fn(root.pipeline));
  const conn = () => MN.store.get('connectors');

  /* Which stages the project has actually earned. */
  const reached = (key) => {
    const s = st();
    switch (key) {
      case 'research': return true;
      case 'viability': return !!s.research.synthesis;
      case 'design': return !!s.viability && (s.viability.verdict === 'go' || s.viability.overridden);
      case 'build': return !!s.design || s.build.tickets.length > 0;
      case 'ship': return !!s.design;
      default: return false;
    }
  };

  const stageDone = (key) => {
    const s = st();
    return { research: !!s.research.synthesis, viability: !!s.viability, design: !!s.design,
      build: s.build.tickets.some((t) => t.status !== 'backlog'), ship: s.ship.published > 0 }[key];
  };

  /* -------------------------------------------------------
     Stepper + stage switching
     ------------------------------------------------------- */
  let current = st().stage || 'research';

  const paintStepper = () => {
    $('#stepper').innerHTML = STAGES.map((s, i) => {
      const ok = reached(s.key);
      const done = stageDone(s.key) && s.key !== current;
      return `<button class="step${s.key === current ? ' active' : done ? ' done' : ''}"
        data-stage="${s.key}" ${ok ? '' : 'disabled'}
        title="${ok ? '' : 'Complete the previous stage first'}">
        <span class="step-n">${done ? '✓' : i + 1}</span>
        <span class="step-t"><b>${esc(s.title)}</b><span>${esc(s.sub)}</span></span>
      </button>`;
    }).join('');
    $$('#stepper .step').forEach((b) => b.addEventListener('click', () => goto(b.dataset.stage)));
  };

  const goto = (key) => {
    if (!reached(key)) { MN.toast('Not yet', 'Finish the earlier stage first.', 'warn'); return; }
    current = key;
    MN.store.set('pipeline.stage', key);
    STAGES.forEach((s) => $('#stage-' + s.key).classList.toggle('hidden', s.key !== key));
    paintStepper();
    render(key);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const render = (key) => ({
    research: renderResearch, viability: renderViability,
    design: renderDesign, build: renderBuild, ship: renderShip
  }[key] || (() => {}))();

  /* =======================================================
     STAGE 1 — RESEARCH
     ======================================================= */
  const brief = () => ({
    name: $('#pName').value.trim(),
    audience: $('#pAudience').value.trim(),
    oneLiner: $('#pOneLiner').value.trim(),
    problem: $('#pProblem').value.trim()
  });

  const restoreBrief = () => {
    const p = st().product;
    if (!p) return;
    $('#pName').value = p.name || '';
    $('#pAudience').value = p.audience || '';
    $('#pOneLiner').value = p.oneLiner || '';
    $('#pProblem').value = p.problem || '';
  };

  $('#weightTable').innerHTML = Object.entries(P.SIGNAL_TYPES)
    .sort((a, b) => b[1].weight - a[1].weight)
    .map(([, v]) => `
      <div class="row-between" style="gap:10px">
        <span class="small">${v.icon} ${esc(v.label)}</span>
        <span class="tiny mono muted">×${v.weight.toFixed(1)}</span>
      </div>`).join('');

  const renderSignals = () => {
    const sig = st().research.signals;
    const host = $('#signalList');
    if (!sig.length) {
      host.innerHTML = `<div class="empty">
        <h4>No signals yet</h4>
        <p>Add interviews, support patterns, analytics observations or competitor teardowns.
           Four is the minimum for a synthesis worth acting on.</p>
      </div>`;
    } else {
      host.innerHTML = `<div class="table-wrap"><table class="tbl">
        <thead><tr><th>Type</th><th>Source</th><th>What it told you</th><th></th></tr></thead>
        <tbody>${sig.map((s) => `
          <tr>
            <td class="nowrap">${P.SIGNAL_TYPES[s.type].icon} <span class="t-main" style="display:inline">${esc(P.SIGNAL_TYPES[s.type].label)}</span></td>
            <td class="nowrap">${esc(s.source)}</td>
            <td>${esc(s.note)}</td>
            <td class="right"><button class="btn btn-quiet btn-sm" data-drop="${s.id}" aria-label="Remove signal">✕</button></td>
          </tr>`).join('')}</tbody>
      </table></div>`;
      $$('[data-drop]', host).forEach((b) => b.addEventListener('click', () => {
        pat((s) => { s.research.signals = s.research.signals.filter((x) => x.id !== b.dataset.drop); });
        renderSignals();
      }));
    }

    const n = sig.length;
    const weighted = sig.reduce((a, s) => a + P.SIGNAL_TYPES[s.type].weight, 0);
    $('#signalHint').innerHTML = n < 4
      ? `${MN.plural(n, 'signal')} — add ${4 - n} more to synthesise.`
      : `${MN.plural(n, 'signal')} · weighted evidence <b class="strong">${weighted.toFixed(1)}</b>`;
    $('#synthBtn').disabled = n < 4;
  };

  $('#addSignal').addEventListener('click', () => {
    MN.modal({
      title: 'Add a research signal',
      sub: 'One observation, one source.',
      body: `
        <label class="field">
          <span class="field-label">Type</span>
          <select class="select" id="sType">
            ${Object.entries(P.SIGNAL_TYPES).map(([k, v]) => `<option value="${k}">${v.icon} ${v.label}</option>`).join('')}
          </select>
        </label>
        <label class="field">
          <span class="field-label">Source</span>
          <input class="input" id="sSource" placeholder="e.g. Priya, ops lead at Havenly">
        </label>
        <label class="field" style="margin:0">
          <span class="field-label">What it told you</span>
          <textarea class="textarea" id="sNote" placeholder="The observation itself — not your interpretation of it."></textarea>
        </label>`,
      foot: `<button class="btn btn-ghost" data-close>Cancel</button>
             <button class="btn btn-primary" id="saveSignal">Add signal</button>`,
      onMount: (root) => {
        root.querySelector('#saveSignal').addEventListener('click', () => {
          const source = root.querySelector('#sSource').value.trim();
          const note = root.querySelector('#sNote').value.trim();
          if (!source || !note) { MN.toast('Fill both fields', 'A signal needs a source and an observation.', 'warn'); return; }
          pat((s) => s.research.signals.push({
            id: MN.uid('sig'), type: root.querySelector('#sType').value, source, note
          }));
          MN.closeModal();
          renderSignals();
        });
      }
    });
  });

  $('#exampleBrief').addEventListener('click', () => {
    $('#pName').value = 'Fernbank';
    $('#pAudience').value = 'Operations leads at 20–200 person design and dev agencies';
    $('#pOneLiner').value = 'Reconcile agency retainers against delivered work without leaving the accounting tool';
    $('#pProblem').value = 'Agency ops leads reconcile retainer invoices against timesheets and delivered scope every month. '
      + 'The data lives in three places — the accounting tool, the time tracker and the project board — so the reconciliation '
      + 'happens in a spreadsheet that one person maintains. It takes two to three days a month, errors surface only when a '
      + 'client disputes an invoice, and nobody else in the business can pick it up.';
    const seed = [
      ['interview', 'Priya, ops lead, Havenly (48 people)', 'Spends the first three days of every month in a reconciliation spreadsheet she built herself. Nobody else can run it.'],
      ['interview', 'Marcus, MD, Solstice (22 people)', 'Found out about a £14k under-billing nine months late. Now checks manually and still does not trust it.'],
      ['interview', 'Dee, finance manager, Kaido', 'Says the accounting tool is fine — the problem is that delivered scope never gets back into it.'],
      ['sales', 'Discovery call — Northwind', 'Asked directly about price. Said they would pay per seat if it removed the monthly spreadsheet entirely.'],
      ['support', 'Competitor forum thread, 84 replies', 'Recurring complaint that existing tools reconcile time but not scope, so the number is still wrong.'],
      ['analytics', 'Time-tracker export, 6 agencies', 'Between 11% and 19% of tracked hours never make it onto an invoice.'],
      ['competitor', 'Teardown — three incumbents', 'All three are built for firms above 200 people and price accordingly. Setup assumes a finance team.']
    ];
    pat((s) => {
      s.research.signals = seed.map(([type, source, note]) => ({ id: MN.uid('sig'), type, source, note }));
    });
    renderSignals();
    MN.toast('Example loaded', 'A brief plus seven research signals.', 'ok');
  });

  $('#synthBtn').addEventListener('click', async () => {
    const b = brief();
    if (!b.name || !b.problem) {
      MN.toast('Complete the brief', 'A name and a problem statement at minimum.', 'warn');
      $('#pName').focus();
      return;
    }
    const btn = $('#synthBtn');
    btn.disabled = true;

              <p class="small muted" style="margin:0">

                ${tickets.reduce((a, t) => a + (t.status === 'shipped' ? 0 : t.points), 0)} points remaining
              </p>
            </div>
            <div class="row-wrap">
              <button class="btn btn-ghost btn-sm" id="importTickets">Import tickets</button>
              <button class="btn btn-primary btn-sm" id="runAll"
                title="Works the next four tickets, components first — the screens that consume them depend on them"
                ${tickets.some((t) => t.status === 'backlog') ? '' : 'disabled'}>
                Run agents on backlog
              </button>
            </div>
          </div>

          ${tickets.length ? `
            <div class="board">
              ${COLUMNS.map((c) => {
                const items = tickets.filter((t) => t.status === c.key);
                return `<div class="col" data-col="${c.key}">
                  <div class="col-head">${esc(c.name)}
                    <span class="n${c.key === 'progress' && items.length ? ' live' : ''}">${items.length}</span>
                  </div>
                  ${items.map(ticketCard).join('') || '<p class="tiny muted center" style="padding:14px 0">—</p>'}
                </div>`;
              }).join('')}
            </div>` : `
            <div class="empty">
              <h4>No tickets yet</h4>
              <p>Create them from the generated design, import a design debt report, or connect Linear or Jira.</p>
              <button class="btn btn-primary btn-sm" id="emptyImport">Import tickets</button>
            </div>`}
        </div>

        <div class="grid g2" style="margin-top:22px">
          ${debt ? `
            <div class="card card-accent card-pad">
              <p class="eyebrow">Design debt in scope</p>
              <p class="small" style="margin-bottom:12px">
                Report ${esc(debt.report.id)} — index ${debt.report.index},
                ${debt.report.findings.length} findings on ${esc(debt.label)}.
              </p>
              <button class="btn btn-ghost btn-sm" id="pullDebt">Pull debt findings in</button>
            </div>` : ''}
          <div class="card card-quiet card-pad">
            <p class="eyebrow">How agents work a ticket</p>
            <ol class="fix-list small" style="margin:0">
              <li>Triager classifies and sizes the ticket.</li>
              <li>The matched agent loads the design system as context.</li>
              <li>It branches, implements, and writes stories and tests.</li>
              <li>Checks run — types, tests, accessibility, visual regression.</li>
              <li>A pull request opens for human review.</li>
            </ol>
          </div>
        </div>
      </div>`;

    $$('[data-conn]', host).forEach((b) => b.addEventListener('click', () => {
      const k = b.dataset.conn;
      MN.store.patch((x) => { x.connectors[k] = !x.connectors[k]; });
      MN.shell.refresh();
      MN.toast(conn()[k] ? 'Connected' : 'Disconnected',
        `${k[0].toUpperCase() + k.slice(1)} ${conn()[k] ? 'is now syncing.' : 'sync stopped.'}`,
        conn()[k] ? 'ok' : 'info');
      renderBuild();
    }));

    [$('#importTickets'), $('#emptyImport')].filter(Boolean).forEach((b) => b.addEventListener('click', importModal));

    const pull = $('#pullDebt');
    if (pull) pull.addEventListener('click', () => {
      const t = MN.DebtEngine.toTickets(debt.report, 'mn');
      pat((x) => { x.build.tickets = [...x.build.tickets, ...t]; });
      MN.store.log('pipeline', `${t.length} debt tickets pulled into the board`);
      MN.shell.refresh();
      renderBuild();
      MN.toast(`${t.length} debt tickets added`, 'Agents can pick these up like any other ticket.', 'ok');
    });

    $$('[data-ticket]', host).forEach((el) => {
      const open = () => openTicket(el.dataset.ticket);
      el.addEventListener('click', open);
      el.addEventListener('keydown', (e) => { if (e.key === 'Enter') open(); });
    });

    const runAll = $('#runAll');
    if (runAll) runAll.addEventListener('click', async () => {
      // Components first: the screens that consume them depend on them existing.
      const backlog = st().build.tickets
        .filter((t) => t.status === 'backlog')
        .sort((a, b) => (a.type === 'component' ? 0 : 1) - (b.type === 'component' ? 0 : 1))
        .slice(0, 4);
      if (!backlog.length) return;
      runAll.disabled = true;
      runAll.textContent = `Working ${backlog.length} tickets…`;
      for (const t of backlog) {
        await runAgent(t.id, { quiet: true });
        renderBuild();
      }
      MN.toast(`${backlog.length} tickets worked`, 'All are in review with pull requests open.', 'agent');
    });
  };

  const importModal = () => {
    const debt = MN.store.get('debt');
    MN.modal({
      title: 'Import tickets',
      sub: 'Pull work in from a connected tracker or from your own analysis.',
      body: `
        <div class="stack">
          <button class="btn btn-solid btn-full" data-import="linear" style="justify-content:flex-start;border-radius:12px;padding:14px 16px">
            <span class="conn-logo linear" style="width:28px;height:28px;font-size:12px">L</span>
            <span style="text-align:left"><b>Linear</b><br><span class="tiny muted">Pull 6 open issues from the current cycle</span></span>
          </button>
          <button class="btn btn-solid btn-full" data-import="jira" style="justify-content:flex-start;border-radius:12px;padding:14px 16px">
            <span class="conn-logo jira" style="width:28px;height:28px;font-size:12px">J</span>
            <span style="text-align:left"><b>Jira</b><br><span class="tiny muted">Pull 5 tasks from the active sprint</span></span>
          </button>
          ${debt ? `
            <button class="btn btn-solid btn-full" data-import="debt" style="justify-content:flex-start;border-radius:12px;padding:14px 16px">
              <span class="conn-logo" style="width:28px;height:28px;font-size:12px;background:var(--accent)">D</span>
              <span style="text-align:left"><b>Design debt report ${esc(debt.report.id)}</b><br>
                <span class="tiny muted">${debt.report.findings.length} findings as tickets</span></span>
            </button>` : ''}
        </div>`,
      onMount: (root) => {
        $$('[data-import]', root).forEach((b) => b.addEventListener('click', () => {
          const kind = b.dataset.import;
          let added = [];
          if (kind === 'debt') {
            added = MN.DebtEngine.toTickets(debt.report, 'mn');
          } else {
            added = mockTracker(kind);
            MN.store.patch((s) => { s.connectors[kind] = true; });
          }
          pat((s) => { s.build.tickets = [...s.build.tickets, ...added]; });
          MN.store.log('pipeline', `${added.length} tickets imported from ${kind}`);
          MN.shell.refresh();
          MN.closeModal();
          renderBuild();
          MN.toast(`${added.length} tickets imported`, `From ${kind === 'debt' ? 'the debt report' : kind}.`, 'ok');
        }));
      }
    });
  };

  /** Stand-in for a real Linear/Jira fetch. */
  const mockTracker = (source) => {
    const rows = source === 'linear' ? [
      ['Date picker traps keyboard focus on Safari', 'bug', 'critical', 3],
      ['Empty state missing on the saved views list', 'chore', 'medium', 2],
      ['Add bulk select to the item table', 'feature', 'medium', 5],
      ['Toast stacks overlap the primary action on mobile', 'bug', 'high', 2],
      ['Invite dialog does not announce validation errors', 'bug', 'high', 3],
      ['Settings nav is three levels deep for one setting', 'chore', 'low', 3]
    ] : [
      ['Checkout totals shift after fonts load', 'bug', 'high', 3],
      ['Support filtering by owner on the report screen', 'feature', 'medium', 5],
      ['Disabled buttons fail contrast at AA', 'bug', 'critical', 2],
      ['Session expiry drops the user to a blank page', 'bug', 'critical', 3],
      ['Add skeletons to the dashboard cards', 'chore', 'medium', 2]
    ];
    return rows.map(([title, type, severity, points], i) => ({
      id: MN.uid('tkt'),
      key: `${source === 'jira' ? 'PROJ' : 'ENG'}-${(source === 'jira' ? 400 : 500) + i}`,
      source, title, type, severity, points,
      body: `Imported from ${source[0].toUpperCase() + source.slice(1)}.`,
      status: 'backlog',
      dimension: type === 'bug' ? 'Interaction & flow' : 'Product design',
      origin: source,
      fixes: ['Reproduce and confirm the conditions', 'Fix using system components and tokens', 'Add a regression test'],
      agent: null,
      log: []
    }));
  };

  /* ---------- ticket detail + agent run ---------- */
  const openTicket = (id) => {
    const t = st().build.tickets.find((x) => x.id === id);
    if (!t) return;
    const agent = P.agentFor(t);

    MN.modal({
      title: t.title,
      sub: `${t.key} · ${t.type} · ${t.points} points · ${t.dimension}`,
      wide: true,
      body: `
        <p>${esc(t.body)}</p>
        ${t.fixes && t.fixes.length ? `
          <h5 style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mute);margin:18px 0 8px">Acceptance</h5>
          <ul class="fix-list small">${t.fixes.map((f) => `<li>${esc(f)}</li>`).join('')}</ul>` : ''}
        <h5 style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mute);margin:20px 0 8px">Agent run</h5>
        <div class="log" id="agentLog">${t.log && t.log.length
          ? t.log.map((l) => `<div class="log-line"><span class="log-t">${esc(l.time)}</span><span class="${esc(l.t)}">${esc(l.s)}</span></div>`).join('')
          : `<div class="log-line"><span class="log-t">--:--:--</span><span class="dim">no run yet — ${esc(agent.name)} is matched to this ticket</span></div>`}</div>`,
      foot: `
        <button class="btn btn-ghost" data-close>Close</button>
        ${t.status === 'review' ? `<button class="btn btn-primary" id="approve">Approve &amp; ship</button>`
          : t.status === 'shipped' ? `<span class="badge good" style="align-self:center">Shipped</span>`
          : `<button class="btn btn-primary" id="runOne">${agent.icon} Run ${esc(agent.name)}</button>`}`,
      onMount: (root) => {
        const run = root.querySelector('#runOne');
        if (run) run.addEventListener('click', async () => {
          run.disabled = true;
          run.textContent = 'Working…';
          await runAgent(id, { logEl: root.querySelector('#agentLog') });
          MN.closeModal();
          renderBuild();
        });
        const ap = root.querySelector('#approve');
        if (ap) ap.addEventListener('click', () => {
          shipTicket(id);
          MN.closeModal();
          renderBuild();
        });
      }
    });
  };

  const runAgent = async (id, opts = {}) => {
    const ticket = st().build.tickets.find((x) => x.id === id);
    if (!ticket) return;
    const agent = P.agentFor(ticket);
    const script = P.agentScript(ticket, agent);

    pat((s) => {
      const t = s.build.tickets.find((x) => x.id === id);
      t.status = 'progress';
      t.agent = agent.id;
      t.log = [];
    });
    if (!opts.quiet) renderBuild();

    const lines = [];
    for (const step of script) {
      const line = { ...step, time: fmt.clock() };
      lines.push(line);
      if (opts.logEl) {
        opts.logEl.innerHTML = lines.map((l) =>
          `<div class="log-line"><span class="log-t">${esc(l.time)}</span><span class="${esc(l.t)}">${esc(l.s)}</span></div>`
        ).join('') + '<div class="log-line log-cursor"></div>';
        opts.logEl.scrollTop = opts.logEl.scrollHeight;
      }
      await MN.sleep(opts.quiet ? 90 : 230 + Math.random() * 200);
    }

    const pr = 300 + Math.floor(MN.rng(MN.hash(ticket.key))() * 400);
    pat((s) => {
      const t = s.build.tickets.find((x) => x.id === id);
      t.status = 'review';
      t.log = lines;
      t.pr = pr;
    });
    MN.store.log('agent', `${agent.name} completed ${ticket.key} — PR #${pr} open`);
    if (!opts.quiet) MN.toast(`${agent.name} finished`, `${ticket.key} is in review — PR #${pr}.`, 'agent');
  };

  const shipTicket = (id) => {
    const ticket = st().build.tickets.find((x) => x.id === id);
    pat((s) => {
      const t = s.build.tickets.find((x) => x.id === id);
      t.status = 'shipped';
      if (t.component || t.type === 'component') {
        const name = t.component || t.title.replace(/^Build /, '').replace(/ component$/, '');
        if (!s.ship.components.some((c) => c.name === name)) {
          s.ship.components.push({ name, stories: 0, published: false, coverage: 0, diffs: 0, from: t.key });
        }
      }
    });
    MN.store.log('pipeline', `${ticket.key} approved and merged`);
    MN.shell.refresh();
    MN.toast('Merged', `${ticket.key} is shipped.`, 'ok');
  };

  /* =======================================================
     STAGE 5 — SHIP
     ======================================================= */
  const PREVIEWS = {
    Button: '<span class="mini-btn">Continue</span>',
    IconButton: '<span class="mini-btn" style="padding:6px 9px">✦</span>',
    TextField: '<div style="width:100%"><div class="mini-bar" style="width:34%;margin-bottom:6px"></div><div class="mini-input"></div></div>',
    Select: '<div class="mini-input" style="display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:9px;color:var(--ink-mute)">▾</div>',
    Toggle: '<span class="mini-toggle"></span>',
    Card: '<div class="mini-card"><div class="mini-bar" style="width:60%"></div><div class="mini-bar"></div></div>',
    Badge: '<span class="mini-badge">Active</span>',
    Avatar: '<span class="mini-avatars"><i></i><i></i><i></i></span>',
    Table: '<div style="width:100%"><div class="mini-bar" style="width:100%"></div><div class="mini-bar" style="width:88%"></div><div class="mini-bar" style="width:94%"></div></div>',
    EmptyState: '<div class="center"><div style="font-size:16px;opacity:.4">◍</div><div class="mini-bar" style="width:54px;margin:6px auto 0"></div></div>',
    Skeleton: '<div style="width:100%"><div class="mini-bar" style="width:100%"></div><div class="mini-bar"></div></div>'
  };

  const previewFor = (name) => PREVIEWS[name]
    || (/chart|graph|metric/i.test(name) ? '<div style="width:100%;display:flex;align-items:flex-end;gap:4px;height:44px">'
        + [60, 34, 78, 46, 88].map((h) => `<span style="flex:1;height:${h}%;background:var(--accent);opacity:.75;border-radius:3px 3px 0 0"></span>`).join('') + '</div>'
    : /card|row|tile|cell/i.test(name) ? PREVIEWS.Card
    : /input|field|picker|composer/i.test(name) ? PREVIEWS.TextField
    : /badge|pill|flag|status/i.test(name) ? PREVIEWS.Badge
    : `<span class="mini-badge" style="background:var(--surface-3);color:var(--ink-mute)">${esc(name)}</span>`);

  const renderShip = () => {
    const s = st();
    const host = $('#shipOut');
    const d = s.design;
    const shipped = s.build.tickets.filter((t) => t.status === 'shipped');

    // Everything the design specified, annotated with what has actually shipped.
    const catalogue = (d ? d.components : []).map((c) => {
      const live = s.ship.components.find((x) => x.name === c.name);
      return { ...c, live: !!live, stories: live ? live.stories : 0, published: live ? live.published : false, diffs: live ? live.diffs : 0 };
    });
    const published = catalogue.filter((c) => c.published);
    const coverage = catalogue.length ? Math.round((published.length / catalogue.length) * 100) : 0;

    host.innerHTML = `
      <div class="row-between" style="margin-bottom:18px;align-items:flex-start">
        <div>
          <h2 style="margin-bottom:4px">Ship to Storybook</h2>
          <p class="small muted" style="margin:0">
            Reviewed components publish with a story per variant and run against the visual baseline.
          </p>
        </div>
        <div class="row-wrap">
          <button class="btn btn-ghost btn-sm" data-conn-sb>
            ${conn().storybook ? 'Storybook connected' : 'Connect Storybook'}
          </button>
          <button class="btn btn-primary btn-sm" id="publishAll"
            ${catalogue.some((c) => c.live && !c.published) ? '' : 'disabled'}>Publish ready components</button>
        </div>
      </div>

      <div class="grid g4" style="margin-bottom:22px">
        <div class="tile"><p class="tile-label">Components specified</p><p class="tile-value">${catalogue.length}</p>
          <p class="tile-note">${catalogue.filter((c) => c.kind === 'domain').length} domain, ${catalogue.filter((c) => c.kind === 'foundation').length} foundation</p></div>
        <div class="tile"><p class="tile-label">Built &amp; merged</p><p class="tile-value">${catalogue.filter((c) => c.live).length}</p>
          <p class="tile-note">${shipped.length} tickets merged in total</p></div>
        <div class="tile"><p class="tile-label">Published</p><p class="tile-value">${published.length}</p>
          <p class="tile-note">${published.reduce((a, c) => a + c.stories, 0)} stories live</p></div>
        <div class="tile"><p class="tile-label">Story coverage</p><p class="tile-value">${coverage}<small>%</small></p>
          <p class="tile-note ${coverage >= 85 ? 'down' : 'up'}">${coverage >= 85 ? 'Above the 85% bar' : `${85 - coverage} points below the bar`}</p></div>
      </div>

      ${catalogue.length && !catalogue.some((c) => c.live) ? `
        <div class="note" style="margin-bottom:20px">
          <span class="note-ico">ℹ</span>
          <div>
            Nothing is ready to publish yet. Components reach Storybook by being built on the
            board — run an agent on a <b>component</b> ticket, then approve its pull request.
            Screen tickets ship as features and do not produce a published component.
          </div>
        </div>` : ''}

      ${catalogue.length ? `
        <div class="sb-grid">
          ${catalogue.map((c) => `
            <div class="sb-item">
              <div class="sb-canvas">${previewFor(c.name)}</div>
              <div class="sb-meta">
                <b>${esc(c.name)}</b>
                <span>${c.variants} variants</span>
                <div class="sb-tags">
                  ${c.published
                    ? `<span class="badge good">Published</span><span class="badge">${c.stories} stories</span>
                       ${c.diffs ? `<span class="badge medium">${c.diffs} diffs</span>` : '<span class="badge low">No diffs</span>'}`
                    : c.live ? '<span class="badge medium">Ready to publish</span>'
                    : '<span class="badge">Specified</span>'}
                </div>
              </div>
            </div>`).join('')}
        </div>` : `
        <div class="empty">
          <h4>Nothing to ship yet</h4>
          <p>Generate the product design and merge component tickets on the build board first.</p>
        </div>`}`;

    const sb = host.querySelector('[data-conn-sb]');
    if (sb) sb.addEventListener('click', () => {
      MN.store.patch((x) => { x.connectors.storybook = !x.connectors.storybook; });
      MN.shell.refresh();
      renderShip();
    });

    const pub = $('#publishAll');
    if (pub) pub.addEventListener('click', async () => {
      if (!conn().storybook) {
        MN.toast('Connect Storybook first', 'Publishing needs the connector enabled.', 'warn');
        return;
      }
      pub.disabled = true;
      pub.textContent = 'Publishing…';
      await MN.sleep(1200);
      pat((x) => {
        x.ship.components.forEach((c) => {
          if (c.published) return;
          const spec = (x.design.components || []).find((k) => k.name === c.name);
          const r = MN.rng(MN.hash(c.name));
          c.published = true;
          c.stories = spec ? spec.variants : 3;
          c.diffs = r() > 0.7 ? 1 : 0;
        });
        x.ship.published = x.ship.components.filter((c) => c.published).length;
      });
      MN.store.log('ship', `${st().ship.published} components published to Storybook`);
      MN.shell.refresh();
      paintStepper();
      renderShip();
      MN.toast('Published', `${st().ship.published} components are live in Storybook.`, 'ok');
    });
  };

  /* =======================================================
     Boot
     ======================================================= */
  $('#resetPipeline').addEventListener('click', () => {
    MN.modal({
      title: 'Reset the pipeline',
      sub: 'This clears research, viability, design, tickets and shipped components.',
      body: '<p>The design debt report and your workflows are not affected.</p>',
      foot: `<button class="btn btn-ghost" data-close>Cancel</button>
             <button class="btn btn-accent" id="doReset">Reset pipeline</button>`,
      onMount: (root) => root.querySelector('#doReset').addEventListener('click', () => {
        MN.store.patch((s) => {
          s.pipeline = {
            stage: 'research', product: null,
            research: { signals: [], synthesis: null },
            viability: null, design: null,
            build: { tickets: [], sprint: 1 },
            ship: { components: [], published: 0 }
          };
        });
        MN.closeModal();
        window.location.reload();
      })
    });
  });

  restoreBrief();
  paintStepper();
  STAGES.forEach((s) => $('#stage-' + s.key).classList.toggle('hidden', s.key !== current));
  render(current);

  if (MN.sub === 'build' && reached('build')) goto('build');
};

/* =========================================================
   MN Studio — Agents & custom workflows
   The agent roster, a workflow composer, connections and
   the workspace activity log.
   ========================================================= */
MN.PAGES["agents"] = () => {
  'use strict';

  const MN = window.MN;
  const P = MN.Pipeline;
  const { esc, fmt } = MN;
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];

  /* -------------------------------------------------------
     Node vocabulary
     ------------------------------------------------------- */
  const TRIGGERS = {
    schedule: { label: 'On a schedule', icon: '⏱', detail: 'Every night at 02:00 UTC' },

    ticket: { label: 'Ticket created or labelled', icon: '🎫', detail: 'Linear or Jira, matching a filter' },
    pr: { label: 'Pull request opened', icon: '🔀', detail: 'Any branch targeting main' },
    deploy: { label: 'Production deploy', icon: '🚀', detail: 'After the release completes' },

    manual: { label: 'Run manually', icon: '▶', detail: 'Only when someone asks for it' }
  };

  const GATES = {
    threshold: { label: 'Threshold gate', desc: 'Continue only if the measured value crosses the bound.' },
    verdict: { label: 'Verdict gate', desc: 'Continue only on a specific outcome.' },
    approval: { label: 'Human approval', desc: 'Pause and wait for a person to approve.' },
    checks: { label: 'Checks pass', desc: 'Continue only if types, tests and accessibility all pass.' }
  };

  const OUTPUTS = {
    tickets: { label: 'Create tickets', desc: 'Open issues in Linear or Jira with the findings attached.' },
    pr: { label: 'Open a pull request', desc: 'Push the branch and open a PR for review.' },
    storybook: { label: 'Publish to Storybook', desc: 'Publish the component with a story per variant.' },
    report: { label: 'Publish a report', desc: 'Write the report into the workspace and share the link.' },
    notify: { label: 'Notify the team', desc: 'Post to Slack with a summary and a link.' },
    figma: { label: 'Write back to Figma', desc: 'Update variables and post a comment on the affected frames.' }
  };

  /* -------------------------------------------------------
     Seed workflows
     ------------------------------------------------------- */
  const node = (kind, ref, name, desc) => ({ id: MN.uid('n'), kind, ref, name, desc });

  const SEED = () => ([
    {
      id: MN.uid('wf'), name: 'Nightly debt watch', enabled: true,
      desc: 'Re-scores production every night and raises tickets only when the index moves against you.',
      trigger: 'schedule', runs: 128, lastRun: Date.now() - 1000 * 60 * 60 * 7,
      nodes: [
        node('agent', 'auditor', 'Debt Auditor', 'Crawls the production URL and scores all eight dimensions.'),
        node('gate', 'threshold', 'Index rose by more than 3', 'Compare against the last accepted baseline.'),
        node('agent', 'triager', 'Ticket Triager', 'Sizes each new finding and picks an owner.'),
        node('output', 'tickets', 'Create tickets in Linear', 'One per finding, tagged design-debt, sorted into the current cycle.'),
        node('output', 'notify', 'Notify #design-system', 'Summary with the delta and the three biggest movers.')
      ]
    },
    {
      id: MN.uid('wf'), name: 'Figma publish → token sync', enabled: true,
      desc: 'Keeps the repository tokens honest whenever the library is republished.',
      trigger: 'figma', runs: 41, lastRun: Date.now() - 1000 * 60 * 60 * 30,
      nodes: [
        node('agent', 'tokens', 'Token Architect', 'Diffs the published variables against the tokens in the repository.'),
        node('agent', 'a11y', 'Accessibility Guardian', 'Checks every changed pairing still clears AA contrast.'),
        node('gate', 'checks', 'Contrast checks pass', 'Block the sync if any pairing regressed.'),
        node('output', 'pr', 'Open a token PR', 'CSS custom properties regenerated, with the diff summarised.')
      ]
    },
    {
      id: MN.uid('wf'), name: 'UI ticket → shipped component', enabled: true,
      desc: 'Takes a labelled ticket all the way to a published Storybook entry.',
      trigger: 'ticket', runs: 76, lastRun: Date.now() - 1000 * 60 * 90,
      nodes: [
        node('agent', 'triager', 'Ticket Triager', 'Classifies the ticket and routes bugs and features differently.'),
        node('agent', 'builder', 'Feature Builder', 'Implements against the design system, with stories and tests.'),
        node('agent', 'a11y', 'Accessibility Guardian', 'Contrast, names, focus order and target size.'),
        node('gate', 'checks', 'All checks pass', 'Types, unit tests, accessibility and visual regression.'),
        node('gate', 'approval', 'Human review', 'A person approves the pull request before anything publishes.'),
        node('output', 'storybook', 'Publish to Storybook', 'One story per variant, baseline updated.')
      ]
    },
    {
      id: MN.uid('wf'), name: 'Research inbox', enabled: false,
      desc: 'Re-synthesises the research whenever a new transcript lands, and flags when the picture changes.',
      trigger: 'research', runs: 12, lastRun: Date.now() - 1000 * 60 * 60 * 24 * 4,
      nodes: [
        node('agent', 'synthesist', 'Research Synthesist', 'Re-clusters every signal and re-ranks the pains.'),
        node('gate', 'threshold', 'A theme changed rank', 'Only continue when the synthesis actually moved.'),
        node('agent', 'analyst', 'Viability Analyst', 'Re-scores the six axes against the new evidence.'),
        node('output', 'report', 'Publish the updated synthesis', 'Written into the workspace with the diff highlighted.'),
        node('output', 'notify', 'Notify the product lead', 'Only when the verdict itself changes.')
      ]
    }
  ]);

  if (!MN.store.get('workflows')) MN.store.set('workflows', SEED());

  const flows = () => MN.store.get('workflows');
  let selectedId = flows()[0] && flows()[0].id;

  /* -------------------------------------------------------
     Workflow list
     ------------------------------------------------------- */
  const renderList = () => {
    $('#flowList').innerHTML = `
      <div class="stack">
        ${flows().map((w) => `
          <button class="card card-pad" data-flow="${w.id}"
            style="width:100%;text-align:left;cursor:pointer;font:inherit;border-color:${w.id === selectedId ? 'var(--accent)' : 'var(--line-soft)'}">
            <div class="row-between" style="margin-bottom:6px;gap:8px">
              <span class="tiny muted">${TRIGGERS[w.trigger].icon} ${esc(TRIGGERS[w.trigger].label)}</span>
              <span class="badge ${w.enabled ? 'good' : ''}">${w.enabled ? 'live' : 'paused'}</span>
            </div>
            <p class="strong" style="margin:0 0 5px">${esc(w.name)}</p>
            <p class="tiny muted" style="margin:0;line-height:1.45">${esc(w.desc)}</p>
            <p class="tiny muted" style="margin:9px 0 0">
              ${MN.plural(w.nodes.length, 'step')} · ${fmt.int(w.runs)} runs · last ${fmt.when(w.lastRun)}
            </p>
          </button>`).join('')}
      </div>`;
    $$('[data-flow]').forEach((b) => b.addEventListener('click', () => {
      selectedId = b.dataset.flow;
      renderList();
      renderDetail();
    }));
  };

  /* -------------------------------------------------------
     Workflow detail / composer
     ------------------------------------------------------- */
  const iconFor = (n) => n.kind === 'trigger' ? TRIGGERS[n.ref].icon
    : n.kind === 'agent' ? (P.AGENTS.find((a) => a.id === n.ref) || { icon: '◆' }).icon
    : n.kind === 'gate' ? '◇' : '↗';

  const renderDetail = () => {
    const w = flows().find((f) => f.id === selectedId);
    const host = $('#flowDetail');
    if (!w) { host.innerHTML = '<div class="empty"><h4>No workflow selected</h4></div>'; return; }

    const chain = [{ id: 'trg', kind: 'trigger', ref: w.trigger, name: TRIGGERS[w.trigger].label, desc: TRIGGERS[w.trigger].detail }, ...w.nodes];

    host.innerHTML = `
      <div class="card">
        <div class="card-head">
          <div>
            <h3>${esc(w.name)}</h3>
            <p class="sub">${esc(w.desc)}</p>
          </div>
          <div class="row-wrap">
            <label class="toggle">
              <input type="checkbox" id="wfEnabled" ${w.enabled ? 'checked' : ''}>
              <span class="toggle-track"></span>
              <span class="small">${w.enabled ? 'Live' : 'Paused'}</span>
            </label>
            <button class="btn btn-ghost btn-sm" id="renameFlow">Rename</button>
            <button class="btn btn-primary btn-sm" id="runFlow">▶ Run once</button>
          </div>
        </div>
        <div class="card-body">
          <div class="flow" id="flowNodes">
            ${chain.map((n, i) => `
              <div class="flow-node ${esc(n.kind)}" data-node="${esc(n.id)}">
                <span class="flow-ico">${iconFor(n)}</span>
                <span class="grow">
                  <span class="flow-kind">${esc(n.kind)}</span>
                  <span class="flow-name">${esc(n.name)}</span>
                  <span class="flow-desc">${esc(n.desc)}</span>
                </span>
                ${n.kind === 'trigger' ? `
                  <span class="flow-tools">
                    <button class="flow-tool" data-edit-trigger title="Change trigger">✎</button>
                  </span>` : `
                  <span class="flow-tools">
                    <button class="flow-tool" data-up="${esc(n.id)}" title="Move up" ${i === 1 ? 'disabled style="opacity:.3"' : ''}>↑</button>
                    <button class="flow-tool" data-down="${esc(n.id)}" title="Move down" ${i === chain.length - 1 ? 'disabled style="opacity:.3"' : ''}>↓</button>
                    <button class="flow-tool del" data-del="${esc(n.id)}" title="Remove step">✕</button>
                  </span>`}
              </div>
              ${i < chain.length - 1 ? '<div class="flow-link"></div>' : ''}`).join('')}
          </div>
          <div style="margin-top:16px">
            <button class="btn btn-ghost btn-sm btn-full" id="addStep">+ Add a step</button>
          </div>
        </div>
        <div class="card-foot">
          <div class="row-between">
            <p class="small muted" style="margin:0">
              ${fmt.int(w.runs)} runs · last ${fmt.when(w.lastRun)} ·
              ${w.nodes.filter((n) => n.kind === 'agent').length} agents,
              ${w.nodes.filter((n) => n.kind === 'gate').length} gates,
              ${w.nodes.filter((n) => n.kind === 'output').length} outputs
            </p>
            <button class="btn btn-quiet btn-sm" id="deleteFlow" style="color:var(--critical)">Delete workflow</button>
          </div>
        </div>
      </div>
      <div id="runOut" style="margin-top:18px"></div>`;

    $('#wfEnabled').addEventListener('change', (e) => {
      patchFlow(w.id, (f) => { f.enabled = e.target.checked; });
      MN.shell.refresh();
      renderList(); renderDetail();
    });

    $('#renameFlow').addEventListener('click', () => {
      MN.modal({
        title: 'Rename workflow',
        body: `<label class="field"><span class="field-label">Name</span>
                 <input class="input" id="wfName" value="${esc(w.name)}"></label>
               <label class="field" style="margin:0"><span class="field-label">Description</span>
                 <textarea class="textarea" id="wfDesc">${esc(w.desc)}</textarea></label>`,
        foot: `<button class="btn btn-ghost" data-close>Cancel</button>
               <button class="btn btn-primary" id="saveName">Save</button>`,
        onMount: (root) => root.querySelector('#saveName').addEventListener('click', () => {
          const name = root.querySelector('#wfName').value.trim();
          if (!name) { MN.toast('Name required', '', 'warn'); return; }
          patchFlow(w.id, (f) => { f.name = name; f.desc = root.querySelector('#wfDesc').value.trim(); });
          MN.closeModal(); renderList(); renderDetail();
        })
      });
    });

    $('#deleteFlow').addEventListener('click', () => {
      MN.modal({
        title: 'Delete this workflow?',
        body: `<p>“${esc(w.name)}” will be removed. Its ${fmt.int(w.runs)} run records go with it.</p>`,
        foot: `<button class="btn btn-ghost" data-close>Cancel</button>
               <button class="btn btn-accent" id="delYes">Delete</button>`,
        onMount: (root) => root.querySelector('#delYes').addEventListener('click', () => {
          MN.store.set('workflows', flows().filter((f) => f.id !== w.id));
          selectedId = (flows()[0] || {}).id;
          MN.closeModal(); MN.shell.refresh(); renderList(); renderDetail();
          MN.toast('Workflow deleted', '', 'info');
        })
      });
    });

    $('[data-edit-trigger]').addEventListener('click', () => pickTrigger(w.id));
    $('#addStep').addEventListener('click', () => pickStep(w.id));

    $$('[data-del]').forEach((b) => b.addEventListener('click', () => {
      patchFlow(w.id, (f) => { f.nodes = f.nodes.filter((n) => n.id !== b.dataset.del); });
      renderList(); renderDetail();
    }));
    $$('[data-up]').forEach((b) => b.addEventListener('click', () => move(w.id, b.dataset.up, -1)));
    $$('[data-down]').forEach((b) => b.addEventListener('click', () => move(w.id, b.dataset.down, 1)));

    $('#runFlow').addEventListener('click', () => runFlow(w.id));
  };

  const patchFlow = (id, fn) => {
    const all = flows();
    const f = all.find((x) => x.id === id);
    fn(f);
    MN.store.set('workflows', all);
  };

  const move = (wid, nid, dir) => {
    patchFlow(wid, (f) => {
      const i = f.nodes.findIndex((n) => n.id === nid);
      const j = i + dir;
      if (i < 0 || j < 0 || j >= f.nodes.length) return;
      [f.nodes[i], f.nodes[j]] = [f.nodes[j], f.nodes[i]];
    });
    renderDetail();
  };

  const pickTrigger = (wid) => {
    MN.modal({
      title: 'Change the trigger',
      sub: 'What starts this workflow.',
      body: `<div class="choices">
        ${Object.entries(TRIGGERS).map(([k, t]) => `
          <label class="choice"><input type="radio" name="trg" value="${k}">
            <b>${t.icon} ${esc(t.label)}</b><span>${esc(t.detail)}</span></label>`).join('')}
      </div>`,
      foot: `<button class="btn btn-ghost" data-close>Cancel</button>
             <button class="btn btn-primary" id="saveTrg">Set trigger</button>`,
      onMount: (root) => root.querySelector('#saveTrg').addEventListener('click', () => {
        const sel = $$('input[name="trg"]', root).find((r) => r.checked);
        if (!sel) { MN.toast('Pick a trigger', '', 'warn'); return; }
        patchFlow(wid, (f) => { f.trigger = sel.value; });
        MN.closeModal(); renderList(); renderDetail();
      })
    });
  };

  const pickStep = (wid) => {
    MN.modal({
      title: 'Add a step',
      sub: 'Agents do work. Gates decide whether the run continues. Outputs put the result somewhere.',
      wide: true,
      body: `
        <div class="tabs" data-tabs role="tablist">
          <button class="tab" role="tab" id="s-agent" aria-controls="sp-agent" aria-selected="true">Agent</button>
          <button class="tab" role="tab" id="s-gate" aria-controls="sp-gate" aria-selected="false">Gate</button>
          <button class="tab" role="tab" id="s-out" aria-controls="sp-out" aria-selected="false">Output</button>
        </div>
        <div class="panel" id="sp-agent" role="tabpanel">
          <div class="choices">
            ${P.AGENTS.map((a) => `
              <label class="choice"><input type="radio" name="step" value="agent:${a.id}">
                <b>${a.icon} ${esc(a.name)}</b><span>${esc(a.desc)}</span></label>`).join('')}
          </div>
        </div>
        <div class="panel" id="sp-gate" role="tabpanel" hidden>
          <div class="choices">
            ${Object.entries(GATES).map(([k, g]) => `
              <label class="choice"><input type="radio" name="step" value="gate:${k}">
                <b>◇ ${esc(g.label)}</b><span>${esc(g.desc)}</span></label>`).join('')}
          </div>
        </div>
        <div class="panel" id="sp-out" role="tabpanel" hidden>
          <div class="choices">
            ${Object.entries(OUTPUTS).map(([k, o]) => `
              <label class="choice"><input type="radio" name="step" value="output:${k}">
                <b>↗ ${esc(o.label)}</b><span>${esc(o.desc)}</span></label>`).join('')}
          </div>
        </div>
        <label class="field" style="margin:18px 0 0">
          <span class="field-label">Note for this step <span class="muted">(optional)</span></span>
          <input class="input" id="stepNote" placeholder="e.g. only for tickets labelled ui">
        </label>`,
      foot: `<button class="btn btn-ghost" data-close>Cancel</button>
             <button class="btn btn-primary" id="addStepGo">Add step</button>`,
      onMount: (root) => {
        MN.bindTabs(root);
        root.querySelector('#addStepGo').addEventListener('click', () => {
          const sel = $$('input[name="step"]', root).find((r) => r.checked);
          if (!sel) { MN.toast('Pick a step', 'Choose an agent, a gate or an output.', 'warn'); return; }
          const [kind, ref] = sel.value.split(':');
          const note = root.querySelector('#stepNote').value.trim();
          const meta = kind === 'agent' ? P.AGENTS.find((a) => a.id === ref)
            : kind === 'gate' ? GATES[ref] : OUTPUTS[ref];
          patchFlow(wid, (f) => f.nodes.push({
            id: MN.uid('n'), kind, ref,
            name: meta.name || meta.label,
            desc: note || meta.desc
          }));
          MN.closeModal(); renderList(); renderDetail();
          MN.toast('Step added', '', 'ok');
        });
      }
    });
  };

  /* -------------------------------------------------------
     Run a workflow
     ------------------------------------------------------- */
  const runFlow = async (wid) => {
    const w = flows().find((f) => f.id === wid);
    const out = $('#runOut');
    const nodeEls = $$('#flowNodes .flow-node');
    nodeEls.forEach((el) => el.classList.remove('running', 'ran'));

    out.innerHTML = `
      <div class="card">
        <div class="card-head"><h4>Run log</h4><span class="badge info" id="runState">running</span></div>
        <div class="card-body"><div class="log" id="runLog"></div></div>
      </div>`;
    const log = $('#runLog');
    const lines = [];
    const emit = (t, s) => {
      lines.push({ t, s, time: fmt.clock() });
      log.innerHTML = lines.map((l) =>
        `<div class="log-line"><span class="log-t">${esc(l.time)}</span><span class="${esc(l.t)}">${esc(l.s)}</span></div>`
      ).join('') + '<div class="log-line log-cursor"></div>';
      log.scrollTop = log.scrollHeight;
    };

    emit('ag', `workflow "${w.name}" started`);
    emit('dim', `trigger: ${TRIGGERS[w.trigger].label.toLowerCase()} — ${TRIGGERS[w.trigger].detail.toLowerCase()}`);

    const r = MN.rng(MN.hash(w.id + w.runs));
    let halted = false;

    for (let i = 0; i < nodeEls.length; i++) {
      const el = nodeEls[i];
      const n = i === 0 ? null : w.nodes[i - 1];
      el.classList.add('running');
      await MN.sleep(520 + r() * 420);

      if (n) {
        if (n.kind === 'agent') {
          emit('ag', `${n.name} → ${n.desc.toLowerCase()}`);
          emit('ok', `completed in ${(1.2 + r() * 6).toFixed(1)}s`);
        } else if (n.kind === 'gate') {
          const pass = n.ref === 'approval' ? true : r() > 0.16;
          emit(pass ? 'ok' : 'warn', `gate "${n.name}" — ${pass ? 'passed' : 'not met, halting the run'}`);
          if (!pass) {
            el.classList.remove('running');
            el.classList.add('ran');
            halted = true;
            break;
          }
        } else {
          emit('ok', `${n.name} — ${n.desc.toLowerCase()}`);
        }
      } else {
        emit('dim', 'context loaded: workspace, design system, open tickets');
      }

      el.classList.remove('running');
      el.classList.add('ran');
    }

    if (halted) {
      emit('warn', 'run ended early — nothing was written');
      $('#runState').textContent = 'halted at a gate';
      $('#runState').className = 'badge medium';
    } else {
      emit('ag', 'workflow complete');
      $('#runState').textContent = 'complete';
      $('#runState').className = 'badge good';
    }
    log.querySelector('.log-cursor')?.remove();

    patchFlow(wid, (f) => { f.runs += 1; f.lastRun = Date.now(); });
    MN.store.log('workflow', `Ran "${w.name}" — ${halted ? 'halted at a gate' : 'completed'}`);
    renderList();
    MN.toast(halted ? 'Run halted at a gate' : 'Workflow complete',
      halted ? 'Nothing was written — the gate condition was not met.' : `${w.nodes.length} steps executed.`,
      halted ? 'warn' : 'agent');
  };

  /* -------------------------------------------------------
     New workflow
     ------------------------------------------------------- */
  $('#newWorkflow').addEventListener('click', () => {
    MN.modal({
      title: 'New workflow',
      sub: 'Start from a trigger, then add the steps.',
      body: `
        <label class="field"><span class="field-label">Name</span>
          <input class="input" id="nwName" placeholder="e.g. Weekly accessibility sweep"></label>
        <label class="field"><span class="field-label">What it does</span>
          <input class="input" id="nwDesc" placeholder="One line — what this workflow is for"></label>
        <div class="field" style="margin:0">
          <span class="field-label">Trigger</span>
          <div class="choices c2">
            ${Object.entries(TRIGGERS).map(([k, t], i) => `
              <label class="choice"><input type="radio" name="nwTrg" value="${k}" ${i === 0 ? 'checked' : ''}>
                <b>${t.icon} ${esc(t.label)}</b><span>${esc(t.detail)}</span></label>`).join('')}
          </div>
        </div>`,
      foot: `<button class="btn btn-ghost" data-close>Cancel</button>
             <button class="btn btn-primary" id="createWf">Create workflow</button>`,
      onMount: (root) => root.querySelector('#createWf').addEventListener('click', () => {
        const name = root.querySelector('#nwName').value.trim();
        if (!name) { MN.toast('Name it', 'Workflows need a name.', 'warn'); return; }
        const wf = {
          id: MN.uid('wf'), name,
          desc: root.querySelector('#nwDesc').value.trim() || 'No description yet.',
          enabled: false,
          trigger: $$('input[name="nwTrg"]', root).find((x) => x.checked).value,
          runs: 0, lastRun: Date.now(), nodes: []
        };
        MN.store.set('workflows', [wf, ...flows()]);
        selectedId = wf.id;
        MN.closeModal();
        MN.shell.refresh();
        renderList(); renderDetail();
        MN.toast('Workflow created', 'Add its steps, then set it live.', 'ok');
      })
    });
  });

  /* -------------------------------------------------------
     Agent roster
     ------------------------------------------------------- */
  const AREAS = [
    ['research', 'Research', 'Turning raw signals into decisions you can defend.'],
    ['debt', 'Design debt', 'Finding what the product owes and costing the way out.'],
    ['design', 'Design', 'Turning a proven problem into an architecture and a system.'],
    ['build', 'Build', 'Working tickets against the design system, not around it.'],
    ['ship', 'Ship', 'Getting the result into the shared reference.']
  ];

  const renderRoster = () => {
    $('#agentRoster').innerHTML = AREAS.map(([key, name, blurb]) => {
      const list = P.AGENTS.filter((a) => a.area === key);
      if (!list.length) return '';
      return `
        <div class="section-head" style="margin-top:${key === 'research' ? 0 : 34}px">
          <div>
            <h3>${esc(name)}</h3>
            <p class="small muted" style="margin:2px 0 0">${esc(blurb)}</p>
          </div>
          <span class="badge">${MN.plural(list.length, 'agent')}</span>
        </div>
        <div class="grid g3">
          ${list.map((a) => {
            const r = MN.rng(MN.hash(a.id));
            const runs = Math.round(30 + r() * 900);
            const success = (92 + r() * 7.4).toFixed(1);
            return `
              <div class="agent-card" data-agent="${a.id}" tabindex="0" role="button">
                <div class="agent-top">
                  <span class="agent-ava">${a.icon}</span>
                  <div>
                    <h4>${esc(a.name)}</h4>
                    <span class="agent-role">${esc(a.role)}</span>
                  </div>
                </div>
                <p>${esc(a.desc)}</p>
                <div class="agent-stats">
                  <span><b>${fmt.int(runs)}</b> runs</span>
                  <span><b>${success}%</b> clean</span>
                  <span><b>${(1.4 + r() * 8).toFixed(1)}s</b> median</span>
                </div>
              </div>`;
          }).join('')}
        </div>`;
    }).join('');

    $$('[data-agent]').forEach((el) => {
      const open = () => showAgent(el.dataset.agent);
      el.addEventListener('click', open);
      el.addEventListener('keydown', (e) => { if (e.key === 'Enter') open(); });
    });
  };

  const AGENT_TOOLS = {
    synthesist: ['workspace.signals.read', 'transcript.parse', 'synthesis.write'],
    analyst: ['synthesis.read', 'market.lookup', 'viability.write'],
    auditor: ['browser.crawl', 'screenshot.capture', 'a11y.axe', 'report.write'],
    tokens: ['styles.extract', 'figma.variables.read', 'tokens.write', 'pr.open'],
    consolidator: ['components.index', 'similarity.cluster', 'codemod.apply', 'pr.open'],
    a11y: ['contrast.check', 'axe.run', 'focus.trace', 'pr.comment'],
    architect: ['synthesis.read', 'ia.write', 'flows.write'],
    systemsmith: ['tokens.read', 'component.spec', 'component.generate'],
    triager: ['linear.read', 'jira.read', 'ticket.classify', 'ticket.assign'],
    fixer: ['repo.read', 'test.write', 'repo.write', 'ci.read', 'pr.open'],
    builder: ['spec.read', 'design-system.read', 'repo.write', 'story.write', 'pr.open'],
    publisher: ['storybook.publish', 'visual-regression.run', 'baseline.update']
  };

  const showAgent = (id) => {
    const a = P.AGENTS.find((x) => x.id === id);
    const tools = AGENT_TOOLS[id] || [];
    MN.modal({
      title: `${a.icon}  ${a.name}`,
      sub: `${a.role} · ${a.area}`,
      body: `
        <p>${esc(a.desc)}</p>
        <h5 style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mute);margin:20px 0 8px">Tools it can call</h5>
        <div class="row-wrap">${tools.map((t) => `<span class="chip mono">${esc(t)}</span>`).join('')}</div>
        <h5 style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mute);margin:20px 0 8px">Guardrails</h5>
        <ul class="fix-list small">
          <li>Never merges its own work — a pull request always waits for a human.</li>
          <li>Cannot write outside the repositories and files the workspace has granted.</li>
          <li>Every claim it makes carries the evidence it came from, or it is not made.</li>
          <li>Halts and escalates rather than guessing when the context is insufficient.</li>
        </ul>
        <h5 style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mute);margin:20px 0 8px">Used in</h5>
        <div class="row-wrap">
          ${flows().filter((w) => w.nodes.some((n) => n.ref === id)).map((w) => `<span class="chip">${esc(w.name)}</span>`).join('')
            || '<span class="tiny muted">Not currently in any workflow.</span>'}
        </div>`
    });
  };

  /* -------------------------------------------------------
     Connections
     ------------------------------------------------------- */
  const CONNECTORS = [
    ['figma', 'Figma', 'figma', 'Read files, styles, components and variables. Write variables back on approval.'],
    ['linear', 'Linear', 'linear', 'Read and create issues, sync status, and comment with findings.'],
    ['jira', 'Jira', 'jira', 'Read and create tasks and epics, and transition them as work lands.'],
    ['storybook', 'Storybook', 'sb', 'Publish components with stories and run visual regression.'],
    ['github', 'GitHub', 'gh', 'Read repositories, open branches and pull requests, read CI results.'],
    ['slack', 'Slack', 'slack', 'Post run summaries and escalate anything that needs a person.']
  ];

  const renderConnections = () => {
    const conn = MN.store.get('connectors');
    $('#connList').innerHTML = CONNECTORS.map(([k, name, cls, desc]) => `
      <div class="conn">
        <span class="conn-logo ${cls}">${name[0]}${k === 'storybook' ? 'B' : ''}</span>
        <span class="conn-body grow">
          <b>${esc(name)}</b>
          <span>${esc(desc)}</span>
        </span>
        <button class="btn btn-sm ${conn[k] ? 'btn-ghost' : 'btn-primary'}" data-conn="${k}">
          ${conn[k] ? 'Disconnect' : 'Connect'}
        </button>
      </div>`).join('');

    $$('[data-conn]').forEach((b) => b.addEventListener('click', () => {
      const k = b.dataset.conn;
      MN.store.patch((s) => { s.connectors[k] = !s.connectors[k]; });
      MN.store.log('connector', `${k[0].toUpperCase() + k.slice(1)} ${MN.store.get('connectors')[k] ? 'connected' : 'disconnected'}`);
      MN.shell.refresh();
      renderConnections();
      renderActivity();
    }));
  };

  /* -------------------------------------------------------
     Activity
     ------------------------------------------------------- */
  const KIND_ICON = { debt: '🔬', research: '🎙', viability: '⚖', design: '🗺', pipeline: '🗂', agent: '🤖', ship: '📚', workflow: '⚡', figma: '🎨', connector: '🔌' };

  const renderActivity = () => {
    const acts = MN.store.get('activity', []);
    $('#activityList').innerHTML = acts.length ? `
      <div class="card">
        <div class="card-head">
          <h3>Workspace activity</h3>
          <button class="btn btn-quiet btn-sm" id="clearActivity">Clear</button>
        </div>
        <div class="card-body">
          <div class="stack">
            ${acts.map((a) => `
              <div class="row" style="gap:12px;padding:9px 0;border-bottom:1px solid var(--line-soft)">
                <span style="font-size:15px">${KIND_ICON[a.kind] || '•'}</span>
                <span class="grow small" style="color:var(--ink)">${esc(a.text)}</span>
                <span class="tiny muted nowrap">${fmt.when(a.ts)}</span>
              </div>`).join('')}
          </div>
        </div>
      </div>` : `
      <div class="empty">
        <h4>Nothing has happened yet</h4>
        <p>Run a debt analysis, audit a Figma file or work a ticket, and it shows up here.</p>
      </div>`;

    const c = $('#clearActivity');
    if (c) c.addEventListener('click', () => {
      MN.store.patch((s) => { s.activity = []; });
      renderActivity();
    });
  };

  /* -------------------------------------------------------
     Boot
     ------------------------------------------------------- */
  renderList();
  renderDetail();
  renderRoster();
  renderConnections();
  renderActivity();

  if (MN.sub === 'connectors') {
    $('#t-conn').click();
    $('#t-conn').scrollIntoView({ block: 'center' });
  }
};

</script>

/* =========================================================
